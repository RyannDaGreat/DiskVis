             * @pure Zoom towards a screen point. Returns new viewport state.
             * @example ZoomMath.zoomTowards(100, 100, 2, {zoom:1, panX:0, panY:0}) // zoom to 2x at (100,100)
             */
            zoomTowards(screenX, screenY, newZoom, viewport) {
                const world = Viewport.screenToWorld(screenX, screenY, viewport.zoom, viewport.panX, viewport.panY);
                return {
                    zoom: newZoom,
                    panX: screenX - world.x * newZoom,
                    panY: screenY - world.y * newZoom
                };
            },

            /**
             * @pure Apply pan delta. Returns new viewport state.
             * @example ZoomMath.pan({zoom:1, panX:0, panY:0}, 10, 20) // => {zoom:1, panX:-10, panY:-20}
             */
            pan(viewport, deltaX, deltaY) {
                return {
                    zoom: viewport.zoom,
                    panX: viewport.panX - deltaX,
                    panY: viewport.panY - deltaY
                };
            }
        };

        /**
         * WheelHandler - Reusable wheel event setup for zoom/pan.
         * Used by both treemap and sunburst canvases.
         */
        const WheelHandler = {
            /**
             * Setup wheel events on a canvas for zoom/pan.
             * @param {HTMLCanvasElement} canvas - Target canvas
             * @param {Object} viewport - Viewport state object with zoom, panX, panY, minZoom, maxZoom, apply()
             * @param {Function} renderFn - Called after viewport changes
             * @param {Function} [afterRenderFn] - Optional callback after render (e.g., update tooltip)
             */
            setup(canvas, viewport, renderFn, afterRenderFn = null) {
                canvas.addEventListener('wheel', (e) => {
                    e.preventDefault();
                    const rect = canvas.getBoundingClientRect();

                    if (e.ctrlKey) {
                        // Pinch-to-zoom: exponential zoom towards cursor (stable at any level)
                        const newZoom = ZoomMath.clampZoom(
                            viewport.zoom * ZoomMath.expZoomFactor(e.deltaY),
                            viewport.minZoom,
                            viewport.maxZoom
                        );
                        viewport.apply(ZoomMath.zoomTowards(
                            e.clientX - rect.left,
                            e.clientY - rect.top,
                            newZoom,
                            viewport
                        ));
                    } else {
                        // Two-finger pan
                        viewport.apply(ZoomMath.pan(viewport, e.deltaX, e.deltaY));
                    }
                    renderFn();
                    if (afterRenderFn) afterRenderFn();
                }, { passive: false });
            }
        };

        /* ============================================================
         * SECTION: UI State
         * Mutable state for interaction tracking.
         * ============================================================ */

        let touchState = { active: false };

        /** Re-render with current viewport (instant, rects already on GPU) */
        function renderFast() {
            if (webglInitialized) {
                WebGLRenderer.render(Viewport, canvasCSSWidth, canvasCSSHeight);
                renderLabels();
            }
        }

        /* ============================================================
         * SECTION: Input Handlers
         * Event listeners - thin wrappers delegating to pure functions.
         * ============================================================ */

        canvas.addEventListener('touchstart', (e) => {
            if (e.touches.length >= 2) {
                e.preventDefault();
                touchState = TouchMath.createPinchState(
                    e.touches[0], e.touches[1],
                    canvas.getBoundingClientRect(), Viewport
                );
            }
        }, { passive: false });

        canvas.addEventListener('touchmove', (e) => {
            if (!touchState.active || e.touches.length < 2) return;
            e.preventDefault();

            const rect = canvas.getBoundingClientRect();
            const dist = TouchMath.distance(e.touches[0], e.touches[1]);
            const mid = TouchMath.midpoint(e.touches[0], e.touches[1], rect);
            Viewport.apply(ZoomMath.calcPinchZoom(touchState, dist, mid, Viewport.minZoom, Viewport.maxZoom));
            renderFast();
        }, { passive: false });

        canvas.addEventListener('touchend', (e) => {
            if (touchState.active && e.touches.length < 2) {
                touchState.active = false;
            }
        });

        // Prevent browser zoom on pinch (must be at document level)
        document.addEventListener('wheel', (e) => {
            if (e.ctrlKey) e.preventDefault();
        }, { passive: false });

        // Setup wheel handlers - SAME code path for both views (DRY)
        WheelHandler.setup(canvas, Viewport, renderFast, updateTreemapTooltip);
        WheelHandler.setup(sunburstCanvas, SunburstViewport, () => SunburstRenderer.render());
        WheelHandler.setup(typesCanvas, TypesViewport, () => TypesRenderer.render());

        /**
         * TreeUtils - Pure functions for tree traversal and stats.
         * @pure All methods are pure functions.
         */
        const TreeUtils = {
            /**
             * @pure Count files and folders in a tree.
             * @example TreeUtils.countItems(node) // => { files: 100, folders: 10 }
             */
            countItems(node) {
                let files = 0, folders = 0;
                if (node.children) {
                    folders++;
                    for (const child of node.children) {
                        const c = this.countItems(child);
                        files += c.files;
                        folders += c.folders;
                    }
                } else {
                    files = 1;
                }
                return { files, folders };
            }
        };

        function updateStats() {
            const stats = document.getElementById('stats');
            const count = TreeUtils.countItems(currentNode);
            stats.textContent = `${Format.bytes(currentNode.size)} | ${count.files} files, ${count.folders} folders`;
        }

        let resizeTimeout = null;
        window.addEventListener('resize', () => {
            if (!currentNode) return;
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(async () => {
                Viewport.apply(Viewport.defaults());
                ViewState.renderCurrent();
            }, 150);
        });

        // Load JSON+zstd from file picker
        const loading = document.getElementById('loading');
        const fileInput = document.getElementById('fileInput');

        /**
         * Progress - Pure functions for progress bar calculations.
         * All functions are stateless and have no DOM dependencies.
         *
         * @example
         * Progress.calcOverall('parse', 50) // => 30 (halfway through parse phase)
         * Progress.calcStep(500, 1000) // => 50
         * Progress.formatPath('/very/long/path/...') // => '...ong/path/...'
         * Progress.shouldYield(lastTime, 120) // => true if 8.3ms elapsed
         */
        const Progress = {
            /** Phase ranges as [start%, end%] of overall progress */
            PHASES: {
                read: [0, 5],
                parse: [5, 50],
                tree: [50, 80],
                render: [80, 100]
            },

            /**
             * Calculate overall percentage from phase and step progress.
             * @param {string} phase - Phase name (read|parse|tree|render)
             * @param {number} stepPercent - Progress within phase (0-100)
             * @returns {number} Overall progress (0-100)
             * @example Progress.calcOverall('parse', 50) // => 30
             */
            calcOverall(phase, stepPercent) {
                const [start, end] = this.PHASES[phase] || [0, 100];
                return Math.round(start + (stepPercent / 100) * (end - start));
            },

            /**
             * Calculate step percentage from done/total counts.
             * @param {number} done - Items completed
             * @param {number} total - Total items
             * @returns {number} Percentage (0-100)
             * @example Progress.calcStep(250, 1000) // => 25
             */
            calcStep(done, total) {
                return total > 0 ? Math.round((done / total) * 100) : 0;
            },

            /**
             * Truncate path for display, keeping start and end visible.
             * @param {string} path - Full file path
             * @param {number} maxLen - Maximum length (default 60)
             * @returns {string} Truncated path with '....' in middle if needed
             * @example Progress.formatPath('/a/b/c/d/e/f/g.txt', 20) // => '/a/b/..../f/g.txt'
             */
            formatPath(path, maxLen = 60) {
                if (path.length <= maxLen) return path;
                const ellipsis = '....';
                const available = maxLen - ellipsis.length;
                const startLen = Math.ceil(available / 2);
                const endLen = Math.floor(available / 2);
                return path.slice(0, startLen) + ellipsis + path.slice(-endLen);
            },

            /**
             * Check if enough time elapsed to yield for UI update.
             * @param {number} lastYield - Timestamp of last yield (performance.now())
             * @returns {boolean} True if should yield
             * @example Progress.shouldYield(performance.now() - 10) // => true (at 120fps)
             */
            shouldYield(lastYield) {
                return performance.now() - lastYield >= (1000 / Config.TARGET_FPS);
            },

            /**
             * Yield to allow UI update, returns new timestamp.
             * @returns {Promise<number>} New timestamp after frame
             */
            async yieldFrame() {
                await new Promise(r => requestAnimationFrame(r));
                return performance.now();
            }
        };

        /**
         * ProgressUI - Configurable progress display.
         * Call show() with options to configure stages dynamically.
         *
         * @example ProgressUI.show({ stages: ['read', 'parse', 'tree', 'render'] })
         * @example ProgressUI.show({ stages: ['render'], showInfo: false })
         */
        const ProgressUI = {
            /** Stage definitions: id -> { icon, label } */
            STAGE_DEFS: {
                read:   { icon: 'mdi:file-download-outline', label: 'Read' },
                parse:  { icon: 'mdi:code-json', label: 'Parse' },
                tree:   { icon: 'mdi:file-tree-outline', label: 'Build' },
                icons:  { icon: 'mdi:image-outline', label: 'Icons' },
                render: { icon: 'mdi:brush-outline', label: 'Render' }
            },

            activeStages: [],
            showTimeout: null,
            isVisible: false,

            /**
             * Show progress UI with specified stages (after delay threshold).
             * @param {Object} options
             * @param {string[]} options.stages - Stage ids to show (default: all)
             * @param {boolean} options.showInfo - Show info line (default: true)
             */
            show({ stages = ['read', 'parse', 'tree', 'render'], showInfo = true } = {}) {
                this.activeStages = stages;
                this.buildStages(stages);
                document.getElementById('progressInfoLine').style.display = showInfo ? '' : 'none';

                // Delay showing until threshold reached
                clearTimeout(this.showTimeout);
                this.isVisible = false;
                this.showTimeout = setTimeout(() => {
                    loading.classList.remove('hidden');
                    loading.classList.add('processing');
                    this.isVisible = true;
                }, Config.PROGRESS_DELAY_MS);
            },

            /** Build stage HTML dynamically */
            buildStages(stages) {
                const container = document.getElementById('stagesContainer');
                container.innerHTML = stages.map(id => {
                    const def = this.STAGE_DEFS[id];
                    return `<div class="stage" id="stage-${id}">
                        <div class="stage-bubble"><span class="iconify" data-icon="${def.icon}"></span></div>
                        <div class="stage-label">${def.label}</div>
                    </div>`;
                }).join('');
                // Re-scan for new iconify elements
                if (window.Iconify) Iconify.scan();
            },

            /** Hide progress UI with fade-out transition */
            hide() {
                clearTimeout(this.showTimeout);
                if (this.isVisible) {
                    loading.classList.add('hidden');
                }
                this.isVisible = false;
            },

            /** Set stage state: 'active' or 'done' */
            setStage(stage, state) {
                const el = document.getElementById('stage-' + stage);
                if (!el) return;
                el.classList.remove('active', 'done');
                if (state === 'active' || state === 'done') el.classList.add(state);
            },

            /** Update progress bar */
            setProgress(label, percent) {
                document.getElementById('progressLabel').textContent = label;
                document.getElementById('progressPct').textContent = percent + '%';
                document.getElementById('progressFill').style.width = percent + '%';
            },

            /** Update info line */
            setInfo(text) {
                document.getElementById('progressInfoLine').textContent = text || '';
            }
        };

        /* ============================================================
         * SECTION: Main Application
         * File processing, initialization, and event wiring.
         * ============================================================ */

        async function processFile(file) {
            Viewport.apply(Viewport.defaults());
            ProgressUI.show({ stages: ['read', 'parse', 'tree', 'icons', 'render'], showInfo: true });
            let lastYield = performance.now();

            // Stage 1: Read
            ProgressUI.setStage('read', 'active');
            ProgressUI.setProgress('Reading file...', 0);
            ProgressUI.setInfo(file.name);
            lastYield = await Progress.yieldFrame();
            const compressed = new Uint8Array(await file.arrayBuffer());
            ProgressUI.setStage('read', 'done');

            // Stage 2: Parse (includes decompress)
            ProgressUI.setStage('parse', 'active');
            ProgressUI.setProgress('Decompressing...', 0);
            ProgressUI.setInfo('');
            lastYield = await Progress.yieldFrame();
            const decompressed = fzstd.decompress(compressed);
            const text = new TextDecoder().decode(decompressed);
            const lines = text.split('\n');

            const header = JSON.parse(lines[0]);
            const totalFiles = header.count || lines.length - 1;

            const byInode = new Map();
            let lastPath = '';
            for (let i = 1; i < lines.length; i++) {
                if (!lines[i]) continue;
                const f = JSON.parse(lines[i]);
                const fileObj = { inode: f[0], size: f[1], path: f[2] };
                lastPath = fileObj.path;
                const existing = byInode.get(fileObj.inode);
                if (!existing || fileObj.path.length < existing.path.length) {
                    byInode.set(fileObj.inode, fileObj);
                }
                if (Progress.shouldYield(lastYield)) {
                    const pct = Progress.calcStep(i, totalFiles);
                    ProgressUI.setProgress(`Parsing ${i.toLocaleString()} / ${totalFiles.toLocaleString()}`, pct);
                    ProgressUI.setInfo(Progress.formatPath(lastPath));
                    lastYield = await Progress.yieldFrame();
                }
            }
            const uniqueFiles = Array.from(byInode.values());
            ProgressUI.setStage('parse', 'done');

            // Stage 3: Build tree
            ProgressUI.setStage('tree', 'active');
            ProgressUI.setInfo(`${uniqueFiles.length.toLocaleString()} unique files`);
            rootData = await buildTree(uniqueFiles, header.root, async (done, total, path) => {
                if (Progress.shouldYield(lastYield)) {
                    const pct = Progress.calcStep(done, total);
                    ProgressUI.setProgress(`Building ${done.toLocaleString()} / ${total.toLocaleString()}`, pct);
                    lastYield = await Progress.yieldFrame();
                }
            });
            ProgressUI.setStage('tree', 'done');

            // Stage 4: Load file icons
            ProgressUI.setStage('icons', 'active');
            ProgressUI.setProgress('Loading icons...', 0);
            // Collect names from raw files AND tree leaf nodes (for opaque directories)
            const filenames = uniqueFiles.map(f => f.path.split('/').pop());
            const treeLeafNames = TreeTraversal.collectLeafNames(rootData);
            const allNames = [...filenames, ...treeLeafNames];
            const uniqueIcons = FileIcons.getUniqueIcons(allNames);
            ProgressUI.setInfo(`${uniqueIcons.length} icon types`);

            // Initialize WebGL before building atlas (need gl context)
            if (!webglInitialized) {
                WebGLRenderer.init(canvas);
                webglInitialized = true;
            }

            await FileIcons.buildAtlas(WebGLRenderer.gl, uniqueIcons, (loaded, total) => {
                const pct = Math.round(loaded / total * 100);
                ProgressUI.setProgress(`Loading icons ${loaded}/${total}`, pct);
            });
            ProgressUI.setStage('icons', 'done');

            // Stage 5: Render
            ProgressUI.setStage('render', 'active');
            ProgressUI.setInfo('');
            await renderTreemap(rootData);
            ProgressUI.setStage('render', 'done');

            ProgressUI.hide();
        }

        function showFileError(message, err) {
            console.error('File processing error:', err);
            ProgressUI.hide();
            loading.classList.remove('hidden', 'processing');
            loading.innerHTML = `
                <div style="color: #ff6b6b; text-align: center;">
                    <div style="font-size: 16px; margin-bottom: 10px;">Error</div>
                    <div style="font-size: 13px;">${message}</div>
                    <div style="margin-top: 15px; font-size: 12px; color: var(--text-dim);">
                        Drop another .json.zst file to try again
                    </div>
                </div>
                <input type="file" id="fileInput" accept=".zst">
            `;
            // Re-attach file input listener
            document.getElementById('fileInput').addEventListener('change', handleFileChange);
        }

        async function handleFileChange(e) {
            if (!e.target.files[0]) return;
            try {
                await processFile(e.target.files[0]);
            } catch (err) {
                showFileError(`Failed to process file: ${err.message}`, err);
            }
        }

        async function handleFileDrop(e) {
            e.preventDefault();
            loading.style.background = '';
            if (!e.dataTransfer.files[0]) return;
            try {
                await processFile(e.dataTransfer.files[0]);
            } catch (err) {
                showFileError(`Failed to process file: ${err.message}`, err);
            }
        }

        fileInput.addEventListener('change', handleFileChange);
        loading.addEventListener('dragover', e => { e.preventDefault(); loading.style.background = '#2a2a4e'; });
        loading.addEventListener('dragleave', () => { loading.style.background = ''; });
        loading.addEventListener('drop', handleFileDrop);

    </script>
</body>
</html>
