<!--
MANDATORY STANDARDS - All contributors must follow these rules.

1. CSS: Inheritance over duplication - Never rewrite styles, compose classes instead
2. JS: Pure functions - No side effects, marked with @pure, with docstrings and examples
3. No silent failures - Errors must fail loudly, never swallow exceptions
4. Config in one place - All constants consolidated, not scattered
5. Composition over inheritance - Build from small reusable pieces
6. Simplicity - Minimal structure now, expand as needed, no over-engineering
7. Performance with UX - 120fps target, time-based yielding not hardcoded batches
8. DRY - Don't repeat yourself. Extract helpers, reuse code paths with configuration
9. Group pure functions into labeled objects - Related pure functions belong together
   in a named object (e.g., ZoomMath, TouchMath). Mark with "@pure All methods are
   pure functions." Event handlers should be thin, delegating logic to pure functions.
10. Stateful service objects are distinct - Renderers (e.g., WebGLRenderer) and
    other stateful objects are NOT pure. Document what state they manage.
-->
<!DOCTYPE html>
<html lang="en">
<head>

    <style>
        /*
         * CSS INHERITANCE IS STRONGLY PREFERRED.
         * Never rewrite the same style twice - compose classes instead.
         * If you need a variant, extend with a modifier class, don't duplicate.
         */
        :root {
            --bg: #1a1a2e;
            --glass-bg: rgba(30, 30, 50, 0.75);
            --glass-border: rgba(255, 255, 255, 0.1);
            --glass-subtle: rgba(255, 255, 255, 0.08);
            --accent: #6c9bcf;
            --accent-bg: rgba(108, 155, 207, 0.4);
            --accent-glow: rgba(108, 155, 207, 0.5);
            --success: #45D2B0;
            --success-bg: rgba(69, 210, 176, 0.4);
            --success-glow: rgba(69, 210, 176, 0.5);
            --text: #eee;
            --text-dim: #888;
            --text-dimmer: #555;
            --text-small: 11px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            overflow: hidden;
        }

        /* Glassmorphism base */
        .glass {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
        }
        .glass-panel {
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        /* Layout */
        #header {
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }
        #header h1 { font-size: 18px; font-weight: 500; }
        #stats { font-size: 13px; color: var(--text-dim); }

        #container {
            width: 100vw;
            height: calc(100vh - 50px);
            position: relative;
        }
        #canvas { display: block; cursor: pointer; transform-origin: 0 0; }
        #textOverlay {
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
        }

        /* Tooltip */
        #tooltip {
            position: fixed;
            padding: 8px 12px;
            font-size: 12px;
            pointer-events: none;
            z-index: 1000;
            display: none;
            max-width: 500px;
            word-wrap: break-word;
        }

        /* Loading panel */
        #loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 14px;
            padding: 30px 40px;
            cursor: pointer;
            width: 450px;
            transition: opacity 0.4s ease, filter 0.4s ease, transform 0.4s ease;
        }
        #loading.hidden {
            opacity: 0;
            filter: blur(8px);
            transform: translate(-50%, -50%) scale(0.95);
            pointer-events: none;
        }
        #loading:hover { border-color: var(--accent); }
        #loading.processing { cursor: default; }

        /* View toggle buttons */
        .view-toggle {
            display: flex;
            border-radius: 8px;
            overflow: hidden;
            gap: 1px;
        }
        .view-btn {
            padding: 6px 14px;
            border: none;
            background: transparent;
            color: var(--text-dim);
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .view-btn:hover { color: var(--text); background: var(--glass-subtle); }
        .view-btn.active {
            color: var(--accent);
            background: var(--accent-bg);
        }

        /* Sunburst canvas */
        #sunburstCanvas, #icicleCanvas, #typesCanvas {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            cursor: pointer;
        }

        /* Types view layout */
        #typesContainer {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            overflow: hidden;
        }
        #typesCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: calc(100% - 300px);
            height: 100%;
        }
        #typesTable {
            position: absolute;
            top: 0;
            right: 0;
            width: 300px;
            height: 100%;
            overflow-y: auto;
            background: var(--glass-bg);
            border-left: 1px solid var(--glass-border);
            font-size: 12px;
        }
        #typesTable table {
            width: 100%;
            border-collapse: collapse;
        }
        #typesTable th, #typesTable td {
            padding: 6px 10px;
            text-align: left;
            border-bottom: 1px solid var(--glass-border);
        }
        #typesTable th {
            position: sticky;
            top: 0;
            background: var(--bg);
            color: var(--text-dim);
            font-weight: 500;
        }
        #typesTable td:nth-child(2), #typesTable td:nth-child(3) {
            text-align: right;
            font-variant-numeric: tabular-nums;
        }
        #typesTable tr:hover {
            background: var(--glass-subtle);
        }
        .ext-color {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 2px;
            margin-right: 6px;
            vertical-align: middle;
        }

        #loading #fileInput {
            position: absolute;
            inset: 0;
            opacity: 0;
            cursor: pointer;
        }
        #loading .drop-text { text-align: center; font-size: 16px; }
        #loading .progress-section { display: none; }
        #loading.processing .drop-text { display: none; }
        #loading.processing .progress-section { display: block; }

        /* Stage bubbles */
        .stages { display: flex; justify-content: center; gap: 40px; margin-bottom: 20px; }
        .stage { display: flex; flex-direction: column; align-items: center; gap: 6px; }
        .stage-bubble {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--glass-subtle);
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255,255,255,0.25);
            font-size: 18px;
            transition: all 0.3s ease;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
        }
        .stage.active .stage-bubble {
            background: var(--accent-bg);
            color: var(--accent);
            box-shadow: 0 0 12px var(--accent-glow), 0 0 24px var(--accent-glow), inset 0 1px 2px var(--glass-border);
        }
        .stage.done .stage-bubble {
            background: var(--success-bg);
            color: var(--success);
            box-shadow: 0 0 12px var(--success-glow), 0 0 24px var(--success-glow), inset 0 1px 2px var(--glass-border);
        }
        .stage-label { font-size: 10px; color: var(--text-dimmer); transition: color 0.3s ease; }
        .stage.active .stage-label { color: var(--accent); }
        .stage.done .stage-label { color: var(--success); }

        /* Progress bar */
        .progress-bar {
            height: 6px;
            background: var(--glass-border);
            border-radius: 3px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: var(--accent);
            border-radius: 3px;
        }
        .progress-info {
            display: flex;
            justify-content: space-between;
            margin-top: 8px;
            font-size: var(--text-small);
            color: var(--text-dim);
        }
        .progress-info-line {
            font-size: var(--text-small);
            color: var(--text-dimmer);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 12px;
            height: 14px;
        }
    </style>

    <script>
        /* ============================================================
         * SECTION: Pure Math Functions
         * All pure functions - no side effects, testable in isolation.
         * Objects: Viewport, ZoomMath, TouchMath, ColorUtils, Format,
         *          TreeTraversal, TreeUtils, Progress
         * ============================================================ */

        /**
         * Viewport - Pan/zoom state with pure transform methods.
         * State: zoom, panX, panY, minZoom, maxZoom
         * Pure methods: screenToWorld, worldToScreen, isRectVisible
         */
        const Viewport = {
            zoom: 1,
            panX: 0,
            panY: 0,
            get minZoom() { return Config.ZOOM.MIN; },
            get maxZoom() { return Config.ZOOM.MAX; },

            /** @pure Default viewport state */
            defaults() {
                return { zoom: 1, panX: 0, panY: 0 };
            },

            /** Apply state from object */
            apply(state) {
                this.zoom = state.zoom;
                this.panX = state.panX;
                this.panY = state.panY;
            },

            /**
             * @pure
             * Transform screen coordinates to world coordinates.
             * @param {number} screenX
             * @param {number} screenY
             * @param {number} zoom
             * @param {number} panX
             * @param {number} panY
             * @returns {{x: number, y: number}}
             */
            screenToWorld(screenX, screenY, zoom, panX, panY) {
                return {
                    x: (screenX - panX) / zoom,
                    y: (screenY - panY) / zoom
                };
            },

            /**
             * @pure
             * Transform world coordinates to screen coordinates.
             * @param {number} worldX
             * @param {number} worldY
             * @param {number} zoom
             * @param {number} panX
             * @param {number} panY
             * @returns {{x: number, y: number}}
             */
            worldToScreen(worldX, worldY, zoom, panX, panY) {
                return {
                    x: worldX * zoom + panX,
                    y: worldY * zoom + panY
                };
            },

            /**
             * @pure
             * Check if a rect is visible in the viewport.
             * @param {Object} rect - {x, y, w, h} in world coords
             * @param {number} viewWidth - Viewport width
             * @param {number} viewHeight - Viewport height
             * @param {number} zoom
             * @param {number} panX
             * @param {number} panY
             * @returns {boolean}
             */
            isRectVisible(rect, viewWidth, viewHeight, zoom, panX, panY) {
                const screenX = rect.x * zoom + panX;
                const screenY = rect.y * zoom + panY;
                const screenW = rect.w * zoom;
                const screenH = rect.h * zoom;
                return screenX + screenW > 0 && screenX < viewWidth &&
                       screenY + screenH > 0 && screenY < viewHeight;
            }
        };

        /**
         * SunburstViewport - Pan/zoom state for sunburst view.
         * Same interface as Viewport.
         */
        const SunburstViewport = {
            zoom: 1,
            panX: 0,
            panY: 0,
            get minZoom() { return Config.ZOOM.MIN; },
            get maxZoom() { return Config.ZOOM.MAX; },

            defaults() {
                return { zoom: 1, panX: 0, panY: 0 };
            },

            apply(state) {
                this.zoom = state.zoom;
                this.panX = state.panX;
                this.panY = state.panY;
            },

            reset() {
                this.apply(this.defaults());
            }
        };

        /**
         * IcicleViewport - Pan/zoom for icicle view.
         * Zoom only affects X axis (horizontal stretch).
         * Pan works in both directions.
         */
        const IcicleViewport = {
            zoom: 1,
            panX: 0,
            panY: 0,
            get minZoom() { return Config.ZOOM.MIN; },
            get maxZoom() { return Config.ZOOM.MAX; },

            defaults() {
                return { zoom: 1, panX: 0, panY: 0 };
            },

            apply(state) {
                // Guard against NaN/Infinity corrupting viewport state
                if (Number.isFinite(state.zoom)) this.zoom = state.zoom;
                if (Number.isFinite(state.panX)) this.panX = state.panX;
                if (state.panY !== undefined && Number.isFinite(state.panY)) this.panY = state.panY;
            },

            reset() {
                this.apply(this.defaults());
            },

            /** @pure Screen X to world X (with horizontal zoom) */
            screenToWorldX(screenX) {
                return (screenX - this.panX) / this.zoom;
            },

            /** @pure Zoom towards screen X position (horizontal only) */
            zoomTowardsX(screenX, newZoom) {
                const worldX = this.screenToWorldX(screenX);
                const clampedZoom = Math.max(this.minZoom, Math.min(this.maxZoom, newZoom));
                const newPanX = screenX - worldX * clampedZoom;
                // Guard against NaN/Infinity from extreme calculations
                if (!Number.isFinite(newPanX)) return { zoom: this.zoom, panX: this.panX, panY: this.panY };
                return {
                    zoom: clampedZoom,
                    panX: newPanX,
                    panY: this.panY
                };
            }
        };

        /* ============================================================
         * SECTION: Config
         * All constants in one place. No logic, just values.
         * ============================================================ */

        const Config = {
            /** Target frames per second for progress updates */
            TARGET_FPS: 120,

            /** Only show progress bar if operation takes longer than this (ms) */
            PROGRESS_DELAY_MS: 333,

            /** Internal render scale (2 = render at 2x, display at 1x for more detail) */
            RENDER_SCALE: 2,

            /** Minimum dimensions for text label */
            LABEL_MIN_WIDTH: 40,
            LABEL_MIN_HEIGHT: 16,

            /** Label positioning */
            LABEL_PADDING_X: 4,
            LABEL_PADDING_Y: 12,

            /** Rectangle border */
            BORDER_WIDTH: 0.5,       // pixels
            BORDER_DARKNESS: 0.15,   // 0=black, 1=no darkening

            /** File icons */
            ICON_MIN_SIZE: 60,       // minimum rect size (px) to show icon
            ICON_SCALE: 0.4,         // icon size as fraction of rect min dimension
            ICON_MAX_SIZE: 64,       // max icon size in pixels
            ICON_OPACITY: 0.15,      // subtle embossed effect
            ICON_SHADOW_OFFSET: 1.5, // emboss shadow offset in pixels

            /** GrandPerspective "Rainbow" palette (exact colors from source) */
            COLORS: [
                '#FFFF54', '#C8E64C', '#8CD466', '#4DC742',
                '#45D2B0', '#46ACD3', '#438CCB', '#4262C7',
                '#5240C3', '#8C3FC0', '#D145C1', '#E64C8D',
                '#FF5454', '#FF8054', '#FFA054', '#FFB554'
            ],

            /** Directory names/extensions treated as opaque units */
            OPAQUE_DIRECTORIES: [
                // macOS packages
                '.app', '.bundle', '.framework', '.plugin', '.kext',
                '.prefPane', '.qlgenerator', '.saver', '.xpc',
                '.playground', '.xcodeproj', '.xcworkspace',
                '.photoslibrary', '.musiclibrary', '.tvlibrary',
                // Version control
                '.git', '.svn', '.hg',
                // Node/JS
                'node_modules', 'bower_components', '.next', '.nuxt',
                // Python
                '__pycache__', '.venv', 'venv', '.tox', '.eggs', '.pytest_cache', '.mypy_cache', '.ruff_cache',
                // IDEs
                '.idea', '.vscode'
            ],

            /** Shared zoom limits for all views */
            ZOOM: {
                MIN: 0.1,
                MAX: 1000000
            },

            /** Directory selection styling */
            SELECTION: {
                DRAG_LINE_COLOR: 'rgba(108, 155, 207, 0.8)',
                DRAG_LINE_WIDTH: 3,
                DRAG_LINE_DASH: [8, 4],
                HIGHLIGHT_OUTLINE_COLOR: 'rgba(255, 255, 255, 0.9)',
                HIGHLIGHT_OUTLINE_WIDTH: 4,
                PIXELS_PER_ANCESTOR_LEVEL: 30,
                ZOOM_ANIMATION_DURATION: 300
            }
        };

        /**
         * RenderStyle - Shared visual styling for all Canvas2D renderers.
         * DRY: Single source of truth for text, borders, and colors.
         * @pure All functions return values, none mutate.
         */
        const RenderStyle = {
            // Label text constants
            LABEL_FONT_SIZE: 11,
            LABEL_OPACITY: 0.9,
            LABEL_FONT: '-apple-system, BlinkMacSystemFont, sans-serif',
            SHADOW_OPACITY: 0.8,
            SHADOW_BLUR: 2,
            MIN_LABEL_WIDTH: 30,

            // Gradient constants (matches treemap WebGL shader)
            GRADIENT_DARK: 0.6,
            GRADIENT_LIGHT: 1.3,

            // Highlight/hover brightness increase
            HIGHLIGHT_BRIGHTNESS: 40,

            // Rect rendering thresholds
            MIN_RECT_WIDTH: 1,
            SKIP_RECT_THRESHOLD: 0.33,

            // Merged rect base color [r, g, b] for "N smaller" rects
            MERGED_RECT_COLOR: [100, 100, 120],

            /**
             * @pure Label text style spec.
             * @param {number} scale - DPI scale factor
             * @returns {object} Style properties to apply to ctx
             */
            labelText(scale = 1) {
                return {
                    fillStyle: `rgba(255, 255, 255, ${this.LABEL_OPACITY})`,
                    font: `${this.LABEL_FONT_SIZE * scale}px ${this.LABEL_FONT}`,
                    shadowColor: `rgba(0, 0, 0, ${this.SHADOW_OPACITY})`,
                    shadowBlur: this.SHADOW_BLUR * scale,
                    shadowOffsetX: 0,
                    shadowOffsetY: scale
                };
            },

            /**
             * @pure Border color from base RGB (darkened).
             */
            borderColor(r, g, b) {
                const d = Config.BORDER_DARKNESS;
                return `rgb(${Math.round(r * d)}, ${Math.round(g * d)}, ${Math.round(b * d)})`;
            },

            /**
             * @pure Highlight color adjustment.
             * @returns {number[]} [r, g, b] brightened
             */
            highlightRGB(r, g, b) {
                const bright = this.HIGHLIGHT_BRIGHTNESS;
                return [Math.min(255, r + bright), Math.min(255, g + bright), Math.min(255, b + bright)];
            },

            /**
             * @pure Create diagonal gradient (dark top-left, light bottom-right).
             * Matches treemap WebGL shader gradient.
             */
            diagonalGradient(ctx, x, y, w, h, r, g, b) {
                const grad = ctx.createLinearGradient(x, y, x + w, y + h);
                const dk = this.GRADIENT_DARK;
                const lt = this.GRADIENT_LIGHT;
                const dark = [Math.round(r * dk), Math.round(g * dk), Math.round(b * dk)];
                const light = [Math.min(255, Math.round(r * lt)), Math.min(255, Math.round(g * lt)), Math.min(255, Math.round(b * lt))];
                grad.addColorStop(0, `rgb(${dark[0]}, ${dark[1]}, ${dark[2]})`);
                grad.addColorStop(1, `rgb(${light[0]}, ${light[1]}, ${light[2]})`);
                return grad;
            },

            /** Apply a style spec to a canvas context (the only non-pure operation) */
            apply(ctx, style) {
                Object.assign(ctx, style);
            },

            /** Reset shadow on context */
            clearShadow(ctx) {
                ctx.shadowBlur = 0;
            }
        };

        /**
         * FileIcons - Extension to icon mapping and SVG loading.
         * State: cache (loaded SVG images)
         */
        const FileIcons = {
            /**
             * Extension → vscode-icons icon name (file-type-{name})
             * VERIFIED against Iconify API - only includes icons that actually exist
             * Use full names (python not py, typescript not ts)
             */
            EXTENSIONS: {
                // Programming languages (verified)
                js: 'js', mjs: 'js', cjs: 'js',
                ts: 'typescript', mts: 'typescript', cts: 'typescript',
                jsx: 'reactjs', tsx: 'reactts',
                py: 'python', pyw: 'python', pyi: 'python',
                rb: 'ruby', erb: 'ruby',
                rs: 'rust',
                go: 'go',
                java: 'java', jar: 'jar', class: 'class',
                kt: 'kotlin', kts: 'kotlin',
                swift: 'swift', swiftmodule: 'swift', swiftdoc: 'swift',
                c: 'c', h: 'cheader',
                cpp: 'cpp', cc: 'cpp', cxx: 'cpp', hpp: 'cppheader', hh: 'cppheader',
                m: 'objectivec', mm: 'objectivecpp',
                cs: 'csharp', csx: 'csharp',
                php: 'php', phtml: 'php',
                lua: 'lua',
                r: 'r', R: 'r',
                jl: 'julia',
                ex: 'elixir', exs: 'elixir',
                erl: 'erlang', hrl: 'erlang',
                hs: 'haskell', lhs: 'haskell',
                scala: 'scala', sc: 'scala',
                clj: 'clojure', cljs: 'clojure', cljc: 'clojure',
                pl: 'perl', pm: 'perl',
                sh: 'shell', bash: 'shell', zsh: 'shell', fish: 'shell',
                ps1: 'powershell', psm1: 'powershell',
                sql: 'sql',
                asm: 'assembly', s: 'assembly',
                dart: 'dartlang',
                zig: 'zig',

            /** Texture atlas state */
            atlas: null,           // WebGL texture
            atlasSize: 0,          // Grid size (e.g., 8 = 8x8 grid)
            iconSize: 256,         // Size of each icon in atlas (higher = better quality)
            iconToIndex: new Map(), // icon name → atlas index

            /**
             * Get icon name for a filename.
             * Checks app bundles first, then file extensions.
             * @param {string} filename
             * @returns {string|null} Icon name or null if no mapping
             */
            getIconName(filename) {
                // Check for .app bundles first
                if (filename.endsWith('.app')) {
                    const appName = filename.slice(0, -4); // Remove .app
                    if (this.APP_BUNDLES[appName]) {
                        return this.APP_BUNDLES[appName];
                    }
                    return 'macos-app'; // Generic macOS app icon
                }
                // Check for .bundle (Chrome, etc.)
                if (filename.endsWith('.bundle')) {
                    const bundleName = filename.slice(0, -7); // Remove .bundle
                    if (this.SPECIAL_DIRS[bundleName]) {
                        return this.SPECIAL_DIRS[bundleName];
                    }
                    return 'bundle';  // Gift icon for generic bundles
                }
                // Check for photo/music/tv libraries
                if (filename.endsWith('.photoslibrary')) return 'photoslibrary';
                if (filename.endsWith('.musiclibrary')) return 'audio';
                if (filename.endsWith('.tvlibrary')) return 'video';
                // Check for macOS framework bundles
                if (filename.endsWith('.framework')) return 'framework';
                // Check for special directories (node_modules, __pycache__, etc.)
                if (this.SPECIAL_DIRS[filename]) {
                    return this.SPECIAL_DIRS[filename];
                }
                const dot = filename.lastIndexOf('.');
                if (dot <= 0) return null;
                const ext = filename.slice(dot + 1).toLowerCase();
                if (this.EXTENSIONS[ext]) return this.EXTENSIONS[ext];
                // Generate text icon for short extensions (3 chars or less)
                if (ext.length <= 3 && ext.length > 0) {
                    return '_ext_' + ext.toUpperCase();
                }
                return null;
            },

            /**
             * Get atlas index for a filename (0 = no icon).
             * @param {string} filename
             * @returns {number} Atlas index (1-based), 0 if no icon
             */
            getAtlasIndex(filename) {
                const iconName = this.getIconName(filename);
                if (!iconName) return 0;
                return this.iconToIndex.get(iconName) || 0;
            },

            /**
             * Build texture atlas from unique icon names.
             * @param {WebGL2RenderingContext} gl
             * @param {string[]} iconNames - Unique icon names to load
             * @param {function} onProgress - Progress callback(loaded, total)
             * @returns {Promise<void>}
             */
            async buildAtlas(gl, iconNames, onProgress) {
                const size = Math.ceil(Math.sqrt(iconNames.length + 1)); // +1 for empty slot 0
                const iconPx = this.iconSize;
                const atlasPx = size * iconPx;

                // Create offscreen canvas for atlas
                const canvas = document.createElement('canvas');
                canvas.width = atlasPx;
                canvas.height = atlasPx;
                const ctx = canvas.getContext('2d');

                // Slot 0 is empty (transparent)
                this.iconToIndex.clear();
                let loaded = 0;

                // Load and draw each icon from local assets or generate text icons
                for (let i = 0; i < iconNames.length; i++) {
                    const name = iconNames[i];
                    const idx = i + 1; // 1-based index stored in iconToIndex
                    // Draw at 0-based position so shader lookup matches
                    const col = i % size;
                    const row = Math.floor(i / size);
                    const x = col * iconPx;
                    const y = row * iconPx;

                    // Check if this is a text-based icon for unknown extension
                    if (name.startsWith('_ext_')) {
                        const ext = name.slice(5); // Remove '_ext_' prefix
                        // Draw text icon with extension name
                        ctx.save();
                        ctx.fillStyle = '#FFFFFF';
                        ctx.font = `bold ${iconPx * 0.4}px -apple-system, sans-serif`;
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.fillText(ext, x + iconPx / 2, y + iconPx / 2);
                        ctx.restore();
                        this.iconToIndex.set(name, idx);
                    } else {
                        try {
                            // Load from local assets folder
                            const url = `assets/icons/${name}.svg`;
                            const response = await fetch(url);
                            if (response.ok) {
                                const svgText = await response.text();
                                const blob = new Blob([svgText], { type: 'image/svg+xml' });
                                const img = new Image();
                                img.src = URL.createObjectURL(blob);
                                await new Promise((resolve, reject) => {
                                    img.onload = resolve;
                                    img.onerror = reject;
                                });
                                ctx.drawImage(img, x, y, iconPx, iconPx);
                                URL.revokeObjectURL(img.src);
                                this.iconToIndex.set(name, idx);
                            }
                        } catch (err) {
                            console.warn(`Failed to load icon "${name}":`, err.message || err);
                        }
                    }

                    loaded++;
                    if (onProgress) onProgress(loaded, iconNames.length);
                }

                // Upload to WebGL texture
                this.atlasSize = size;
                this.atlas = gl.createTexture();
                gl.bindTexture(gl.TEXTURE_2D, this.atlas);
                gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, canvas);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
            },

            /**

             * @param {string[]} filenames
             * @returns {string[]} Unique icon names
             */
            getUniqueIcons(filenames) {
                const icons = new Set();
                for (const name of filenames) {
                    const icon = this.getIconName(name);
                    if (icon) icons.add(icon);

                return [...icons];

        // Pre-parse colors to RGB for faster drawing
        const colorsRGB = Config.COLORS.map(hex => {

        /**

        const Format = {
            /**
             * @pure Format bytes as human-readable string.
             * @example Format.bytes(0) // => '0 B'
             * @example Format.bytes(1024) // => '1 KB'
             * @example Format.bytes(1073741824) // => '1 GB'
             */
            bytes(bytes) {
                if (bytes === 0) return '0 B';
                const k = 1024;
                const sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
                const i = Math.floor(Math.log(bytes) / Math.log(k));
                return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
            },

            /**
             * @pure Get the total render scale.
             * @example Format.renderScale() // => 4 (on 2x retina with RENDER_SCALE=2)
             */
            renderScale() {
                return Config.RENDER_SCALE * (window.devicePixelRatio || 1);
            },

            /** Size a canvas for HiDPI: buffer at scale, CSS at 1x */
            sizeCanvas(canvas, cssW, cssH, scale) {
                canvas.width = cssW * scale;
                canvas.height = cssH * scale;
                canvas.style.width = cssW + 'px';
                canvas.style.height = cssH + 'px';
            },

            /**
             * @pure Truncate filename in the middle, preserving extension when possible.
             * Falls back to truncating extension if space is too tight.
             * @param {string} name - Filename to truncate
             * @param {function} measureFn - Function that returns width of text
             * @param {number} maxWidth - Maximum allowed width
             * @returns {string} Truncated filename with '…' in middle
             * @example Format.middleTruncate('longfile.txt', fn, 50) // => 'lon…e.txt'
             */
            middleTruncate(name, measureFn, maxWidth) {
                if (measureFn(name) <= maxWidth) return name;

                // Find extension (last dot, but not at start)
                const dotIdx = name.lastIndexOf('.');
                const hasExt = dotIdx > 0;
                const ext = hasExt ? name.slice(dotIdx) : '';
                const base = hasExt ? name.slice(0, dotIdx) : name;

                // Try to fit with extension first
                let lo = 1, hi = base.length - 1;
                while (lo < hi) {
                    const mid = Math.ceil((lo + hi) / 2);
                    const half = Math.floor(mid / 2);
                    const candidate = base.slice(0, half) + '…' + base.slice(-(mid - half)) + ext;
                    if (measureFn(candidate) <= maxWidth) {
                        lo = mid;
                    } else {
                        hi = mid - 1;
                    }
                }

                // Check if minimal with extension fits
                const minWithExt = base[0] + '…' + ext;
                if (measureFn(minWithExt) <= maxWidth) {
                    if (lo < 2) return minWithExt;
                    const half = Math.floor(lo / 2);
                    return base.slice(0, half) + '…' + base.slice(-(lo - half)) + ext;
                }

                // Extension doesn't fit - truncate the whole name without preserving ext
                const fullName = name;
                lo = 1; hi = fullName.length - 1;
                while (lo < hi) {
                    const mid = Math.ceil((lo + hi) / 2);
                    const half = Math.floor(mid / 2);
                    const candidate = fullName.slice(0, half) + '…' + fullName.slice(-(mid - half));
                    if (measureFn(candidate) <= maxWidth) {
                        lo = mid;
                    } else {
                        hi = mid - 1;
                    }
                }
                if (lo < 2) return fullName[0] + '…';
                const half = Math.floor(lo / 2);
                return fullName.slice(0, half) + '…' + fullName.slice(-(lo - half));
            }
        };

        /**
         * @pure
         * Check if a directory name matches an opaque pattern.
         * Matches exact names (node_modules, .git) or extensions (.app, .framework).
         * @param {string} name - Directory name
         * @returns {boolean}
         * @example isOpaqueDirectory('node_modules') // => true
         * @example isOpaqueDirectory('MyApp.app') // => true
         * @example isOpaqueDirectory('.git') // => true
         * @example isOpaqueDirectory('src') // => false
         */
        function isOpaqueDirectory(name) {
            return Config.OPAQUE_DIRECTORIES.some(pattern =>
                name === pattern || name.endsWith(pattern)
            );
        }


        /* ============================================================
         * SECTION: Layout Algorithm
         * Tree building and squarify treemap layout.
         * Pure algorithms that produce rect data from tree structure.
         * ============================================================ */

        async function buildTree(files, rootPath, onProgress) {
            const root = { name: rootPath, path: rootPath, size: 0, children: {} };
            const total = files.length;

            for (let i = 0; i < files.length; i++) {
                const { size, path } = files[i];
                const relativePath = path.startsWith(rootPath)
                    ? path.slice(rootPath.length).replace(/^\//, '')
                    : path;

                const parts = relativePath.split('/').filter(p => p);
                let current = root;
                let opaqueDepth = -1;  // Track where we hit an opaque directory

                // Find first opaque directory in path
                for (let j = 0; j < parts.length; j++) {
                    if (isOpaqueDirectory(parts[j])) {
                        opaqueDepth = j;
                        break;
                    }
                }

                // Build tree only up to opaque directory (or full path if none)
                const buildDepth = opaqueDepth >= 0 ? opaqueDepth + 1 : parts.length;

                for (let j = 0; j < buildDepth; j++) {
                    const part = parts[j];
                    const isLeaf = j === parts.length - 1 || j === opaqueDepth;

                    if (!current.children[part]) {
                        current.children[part] = {
                            name: part,
                            path: rootPath + '/' + parts.slice(0, j + 1).join('/'),
                            size: 0,
                            children: isLeaf ? null : {}
                        };
                    }

                    // If this is an opaque dir, ensure it stays a leaf
                    if (j === opaqueDepth) {
                        current.children[part].children = null;
                    }

                    // Set leaf size directly (file or opaque dir)
                    if (isLeaf) {
                        current.children[part].size += size;
                    }

                    current = current.children[part];
                }

                // Propagate size up to parents (not leaf)
                current = root;
                for (let j = 0; j < buildDepth - 1; j++) {
                    current.size += size;
                    current = current.children[parts[j]];
                }
                current.size += size;  // Add to immediate parent of leaf

                if (onProgress) {
                    await onProgress(i, total, path);
                }
            }

            // Convert children objects to sorted arrays
            function convertChildren(node) {
                if (node.children && typeof node.children === 'object') {
                    const arr = Object.values(node.children);
                    arr.forEach(convertChildren);
                    arr.sort((a, b) => b.size - a.size);
                    node.children = arr;
                }
                return node;
            }

            return convertChildren(root);
        }

        // Squarified treemap algorithm
        function squarify(children, rect, getSize) {
            if (!children || children.length === 0) return [];

            const results = [];
            const totalSize = children.reduce((sum, c) => sum + getSize(c), 0);
            if (totalSize === 0) return [];

            const area = rect.width * rect.height;
            const normalized = children.map(c => ({
                item: c,
                normalizedSize: (getSize(c) / totalSize) * area
            })).filter(x => x.normalizedSize > 0);

            layoutRow(normalized, rect, results);
            return results;
        }

        function layoutRow(items, rect, results) {
            if (items.length === 0) return;

            const isWide = rect.width >= rect.height;
            const side = isWide ? rect.height : rect.width;

            let row = [];
            let rowArea = 0;
            let remaining = [...items];

            while (remaining.length > 0) {
                const item = remaining[0];
                const testRow = [...row, item];
                const testArea = rowArea + item.normalizedSize;

                const currentWorst = row.length > 0 ? worstRatio(row, rowArea, side) : Infinity;
                const newWorst = worstRatio(testRow, testArea, side);

                if (row.length === 0 || newWorst <= currentWorst) {
                    row.push(item);
                    rowArea += item.normalizedSize;
                    remaining.shift();
                } else {
                    const rowRect = layoutRowRects(row, rowArea, rect, isWide, results);

                    if (isWide) {
                        rect = { x: rect.x + rowRect.usedWidth, y: rect.y,
                                 width: rect.width - rowRect.usedWidth, height: rect.height };
                    } else {
                        rect = { x: rect.x, y: rect.y + rowRect.usedHeight,
                                 width: rect.width, height: rect.height - rowRect.usedHeight };
                    }

                    row = [];
                    rowArea = 0;
                }
            }

            if (row.length > 0) {
                layoutRowRects(row, rowArea, rect, isWide, results);
            }
        }

        /**
         * @pure
         * Calculate worst aspect ratio in a row of treemap items.
         * Lower is better (1.0 = perfect square).
         * @param {Array} row - Items with normalizedSize
         * @param {number} area - Total area of row
         * @param {number} side - Length of the fixed side
         * @returns {number} Worst aspect ratio (>=1), or Infinity if invalid
         * @example worstRatio([], 0, 0) // => Infinity
         * @example worstRatio([{normalizedSize: 100}], 100, 10) // => 1
         */
        function worstRatio(row, area, side) {
            if (row.length === 0 || area === 0 || side === 0) return Infinity;
            const rowWidth = area / side;
            let worst = 0;
            for (const item of row) {
                const h = item.normalizedSize / rowWidth;
                const ratio = Math.max(rowWidth / h, h / rowWidth);
                worst = Math.max(worst, ratio);
            }
            return worst;
        }

        function layoutRowRects(row, rowArea, rect, isWide, results) {
            if (row.length === 0) return { usedWidth: 0, usedHeight: 0 };

            const side = isWide ? rect.height : rect.width;
            const rowThickness = rowArea / side;
            let offset = 0;

            for (const item of row) {
                const itemLength = item.normalizedSize / rowThickness;
                let itemRect;

                if (isWide) {
                    itemRect = { x: rect.x, y: rect.y + offset, width: rowThickness, height: itemLength };
                } else {
                    itemRect = { x: rect.x + offset, y: rect.y, width: itemLength, height: rowThickness };
                }

                results.push({ item: item.item, rect: itemRect });
                offset += itemLength;
            }

            return { usedWidth: isWide ? rowThickness : 0, usedHeight: isWide ? 0 : rowThickness };
        }

        /**
         * ColorUtils - Pure functions for color assignment.
         * @pure All methods are pure functions.
         */
        const ColorUtils = {
            /**
             * @pure Hash a string to a 32-bit integer using djb2 algorithm.
             * @example ColorUtils.hash('txt') // => 115801
             */
            hash(str) {
                let hash = 0;
                for (let i = 0; i < str.length; i++) {
                    hash = ((hash << 5) - hash) + str.charCodeAt(i);
                    hash |= 0;
                }
                return hash;
            },

            /**
             * @pure Get color palette index for a filename based on its extension.
             * @example ColorUtils.indexForExtension('foo.txt') // => 9
             * @example ColorUtils.indexForExtension('noext') // => 0
             */
            indexForExtension(name) {
                const dot = name.lastIndexOf('.');
                const ext = dot > 0 ? name.slice(dot + 1).toLowerCase() : '';
                return Math.abs(this.hash(ext)) % Config.COLORS.length;
            },

            /**
             * @pure Parse hex color string to [r, g, b] array.
             * @example ColorUtils.parseHex('#FF5454') // => [255, 84, 84]
             */
            parseHex(hex) {
                const h = hex.startsWith('#') ? hex.slice(1) : hex;
                return [
                    parseInt(h.slice(0, 2), 16),
                    parseInt(h.slice(2, 4), 16),
                    parseInt(h.slice(4, 6), 16)
                ];
            }
        };

        // Collect all leaf rectangles recursively
        /**
         * Collect leaf rectangles and store bounds on all nodes for hit testing.
         * Mutates nodes by adding `bounds` property.
         */
        function collectLeafRects(node, rect, results) {
            // Store bounds on this node for tree-based hit testing
            node.bounds = rect;

            const children = node.children || [];
            if (children.length === 0) return;

            const layouts = squarify(children, rect, c => c.size);

            for (const layout of layouts) {
                const { item, rect: r } = layout;
                const hasChildren = item.children && item.children.length > 0;

                if (hasChildren) {
                    collectLeafRects(item, r, results);
                } else {
                    item.bounds = r;  // Store bounds on leaf too
                    const colorIdx = ColorUtils.indexForExtension(item.name);
                    results.push({ item, x: r.x, y: r.y, w: r.width, h: r.height, colorIdx });
                }
            }
        }

        /**
         * TreeUtils - Pure functions for tree traversal.
         * @pure All methods are pure functions.
         */
        const TreeTraversal = {
            /**
             * @pure Hit test a point against the tree, returning the leaf node.
             * Uses tree traversal O(depth) instead of O(n).
             * @example TreeTraversal.hitTest(root, 100, 100) // => { name: 'file.txt', ... }
             */
            hitTest(node, x, y) {
                if (!node || !node.bounds) return null;

                const b = node.bounds;
                if (x < b.x || x >= b.x + b.width || y < b.y || y >= b.y + b.height) {
                    return null;
                }

                if (!node.children || node.children.length === 0) {
                    return node;
                }

                for (const child of node.children) {
                    const hit = this.hitTest(child, x, y);
                    if (hit) return hit;
                }

                return null;
            },

            /**
             * @pure Collect all leaf node names from a tree.
             * @example TreeTraversal.collectLeafNames(root) // => ['file.txt', 'Photos.photoslibrary']
             */
            collectLeafNames(node) {
                const names = [];
                const traverse = (n) => {
                    if (!n.children || n.children.length === 0) {
                        names.push(n.name);
                    } else {
                        for (const child of n.children) {
                            traverse(child);
                        }
                    }
                };
                traverse(node);
                return names;
            },

            /**
             * @pure Find all ancestors from root to target node (inclusive).
             * @param {Object} rootNode - Root of tree
             * @param {Object} targetNode - Node to find ancestors for
             * @returns {Object[]} Array of nodes from root to target
             * @example TreeTraversal.findAncestors(root, leaf) // => [root, ..., parent, leaf]
             */
            findAncestors(rootNode, targetNode) {
                const ancestors = [];
                const traverse = (node, path) => {
                    path.push(node);
                    if (node.path === targetNode.path) {
                        ancestors.push(...path);
                        return true;
                    }
                    if (node.children) {
                        for (const child of node.children) {
                            if (traverse(child, path)) return true;
                        }
                    }
                    path.pop();
                    return false;
                };
                traverse(rootNode, []);
                return ancestors;
            },

            /**
             * @pure Get an ancestor N levels up from target.
             * @param {Object} rootNode - Root of tree
             * @param {Object} targetNode - Starting node
             * @param {number} levelsUp - How many levels to go up (0 = target itself)
             * @returns {Object|null} Ancestor node or null if not found
             * @example TreeTraversal.getAncestor(root, leaf, 1) // => parent of leaf
             */
            getAncestor(rootNode, targetNode, levelsUp) {
                const ancestors = this.findAncestors(rootNode, targetNode);
                if (!ancestors.length) return null;
                const idx = Math.max(0, ancestors.length - 1 - levelsUp);
                return ancestors[idx];
            }
        };

        /**
         * SunburstLayout - Pure functions for sunburst arc calculations.
         * @pure All methods are pure functions.
         */
        const SunburstLayout = {
            /** Cache for path -> colorIdx to ensure consistency */
            colorCache: new Map(),

            /** Ring width configuration */
            FULL_WIDTH_RINGS: 10,   // First N rings are full width
            RING_WIDTH_SCALE: 0.5,  // Scale factor for ring thickness (1.0 = fill available space)
            DECAY_FACTOR: 0.75,     // Each subsequent ring is this fraction of previous (higher = see deeper)
            MIN_RING_WIDTH: 1,      // Minimum ring width in pixels

            /**
             * @pure Get consistent color index for a node path.
             * Uses path hash so folders keep their color when drilling.
             */
            colorForPath(path) {
                if (this.colorCache.has(path)) {
                    return this.colorCache.get(path);
                }
                const idx = Math.abs(ColorUtils.hash(path)) % Config.COLORS.length;
                this.colorCache.set(path, idx);
                return idx;
            },

            /**
             * @pure Calculate ring width for a given depth.
             * Full width for first N rings, then exponential decay.
             */
            getRingWidth(depth, baseWidth) {
                if (depth < this.FULL_WIDTH_RINGS) {
                    return baseWidth;
                }
                const decayDepth = depth - this.FULL_WIDTH_RINGS;
                return Math.max(this.MIN_RING_WIDTH, baseWidth * Math.pow(this.DECAY_FACTOR, decayDepth + 1));
            },

            /**
             * @pure Calculate cumulative radius at start of a depth level.
             */
            getRadiusAtDepth(depth, innerRadius, baseWidth) {
                let r = innerRadius;
                for (let d = 0; d < depth; d++) {
                    r += this.getRingWidth(d, baseWidth);
                }
                return r;
            },

            /**
             * @pure Calculate arcs for sunburst visualization.
             * Includes the root node as depth 0 (full 360° ring).
             * Ring widths decay exponentially after FULL_WIDTH_RINGS.
             */
            calculateArcs(node, centerX, centerY, innerRadius, baseRingWidth, maxDepth) {
                const arcs = [];
                const TAU = Math.PI * 2;
                const MIN_ANGLE = 0.3 * (Math.PI / 180);

                const traverse = (n, depth, startAngle, endAngle) => {
                    if (depth > maxDepth) return;
                    const angleSpan = endAngle - startAngle;
                    if (angleSpan < MIN_ANGLE) return;

                    const r0 = this.getRadiusAtDepth(depth, innerRadius, baseRingWidth);
                    const ringW = this.getRingWidth(depth, baseRingWidth);
                    const r1 = r0 + ringW;
                    const colorIdx = this.colorForPath(n.path);

                    arcs.push({
                        node: n,
                        path: n.path,
                        depth,
                        startAngle,
                        endAngle,
                        innerRadius: r0,
                        outerRadius: r1,
                        colorIdx,
                        centerX,
                        centerY
                    });

                    if (n.children && n.children.length > 0) {
                        let childStart = startAngle;
                        for (const child of n.children) {
                            const childSpan = (child.size / n.size) * angleSpan;
                            traverse(child, depth + 1, childStart, childStart + childSpan);
                            childStart += childSpan;
                        }
                    }
                };

                // Add root as depth 0 (full 360° innermost ring)
                const rootWidth = this.getRingWidth(0, baseRingWidth);
                arcs.push({
                    node: node,
                    path: node.path,
                    depth: 0,
                    startAngle: -Math.PI / 2,
                    endAngle: -Math.PI / 2 + TAU,
                    innerRadius: innerRadius,
                    outerRadius: innerRadius + rootWidth,
                    colorIdx: this.colorForPath(node.path),
                    centerX,
                    centerY,
                    isRoot: true
                });

                // Children start at depth 1
                if (node.children && node.children.length > 0) {
                    let childStart = -Math.PI / 2;
                    for (const child of node.children) {
                        const childSpan = (child.size / node.size) * TAU;
                        traverse(child, 1, childStart, childStart + childSpan);
                        childStart += childSpan;
                    }
                }

                return arcs;
            },

            /**
             * @pure Hit test - skip the root ring (depth 0, full circle)
             */
            hitTest(x, y, arcs, centerX, centerY) {
                const dx = x - centerX;
                const dy = y - centerY;
                const dist = Math.sqrt(dx * dx + dy * dy);
                let angle = Math.atan2(dy, dx);

                let hit = null;
                for (const arc of arcs) {
                    // Skip root ring for hit testing (it's just visual)
                    if (arc.isRoot) continue;

                    if (dist >= arc.innerRadius && dist < arc.outerRadius) {
                        let a = angle;
                        let start = arc.startAngle;
                        let end = arc.endAngle;

                        while (a < start) a += Math.PI * 2;
                        while (a > end && end - start < Math.PI * 2) a -= Math.PI * 2;

                        if (a >= start && a < end) {
                            hit = arc;
                        }
                    }
                }
                return hit;
            },

            /** @pure Check if point is in center circle. */
            isInCenter(x, y, centerX, centerY, radius) {
                const dx = x - centerX;
                const dy = y - centerY;
                return dx * dx + dy * dy < radius * radius;
            },

            /** @pure Linear interpolate a value */
            lerp(a, b, t) {
                return a + (b - a) * t;
            },

            /** @pure EaseInOutQuad */
            easeInOutQuad(t) {
                return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
            }
        };

        /**
         * IcicleLayout - Pure functions for icicle chart layout.
         * Root at top, full width. Children below, width proportional to size.
         * @pure All methods are pure functions.
         */
        const IcicleLayout = {
            ROW_HEIGHT: 24,

            /** Minimum rect width before merging into "N smaller items" */
            MERGE_THRESHOLD: 2,

            /**
             * @pure Calculate rectangles for icicle visualization.
             * Returns array of { x, y, w, h, node, depth }
             * Tiny children are merged into one "N smaller items" rect.
             * Merged children still get traversed (tree continues below).
             */
            calculateRects(node, width) {
                const rects = [];
                const rowHeight = this.ROW_HEIGHT;
                const mergeThreshold = this.MERGE_THRESHOLD;

                const traverse = (n, x, w, depth, skipOwnRect = false) => {
                    const y = depth * rowHeight;

                    // Add rect for this node (unless it's a merged child - those are represented by merge rect)
                    if (!skipOwnRect) {
                        rects.push({
                            x, y, w, h: rowHeight,
                            node: n,
                            depth,
                            colorIdx: Math.abs(ColorUtils.hash(n.path)) % Config.COLORS.length
                        });
                    }

                    if (n.children && n.children.length > 0) {
                        let childX = x;
                        let mergedChildren = [];
                        let mergeStartX = null;

                        for (const child of n.children) {
                            const childW = (child.size / n.size) * w;

                            if (childW >= mergeThreshold) {
                                traverse(child, childX, childW, depth + 1, false);
                            } else {
                                // Collect for merge
                                if (mergeStartX === null) mergeStartX = childX;
                                mergedChildren.push({ child, x: childX, w: childW });
                                // Traverse children of merged item (but skip its own rect)
                                traverse(child, childX, childW, depth + 1, true);
                            }
                            childX += childW;
                        }

                        // Add merged rect if any tiny children
                        if (mergedChildren.length > 0 && mergeStartX !== null) {
                            const mergeW = x + w - mergeStartX;
                            rects.push({
                                x: mergeStartX,
                                y: (depth + 1) * rowHeight,
                                w: mergeW,
                                h: rowHeight,
                                node: {
                                    name: `${mergedChildren.length} smaller`,
                                    path: n.path + '/_merged',
                                    size: mergedChildren.reduce((sum, m) => sum + m.child.size, 0)
                                },
                                depth: depth + 1,
                                colorIdx: 0,
                                isMerged: true,
                                mergedChildren: mergedChildren
                            });
                        }
                    }
                };

                traverse(node, 0, width, 0, false);
                return rects;
            },

            /**
             * @pure Hit test a point against icicle rects.
             */
            hitTest(rects, x, y) {
                // Iterate in reverse to find topmost (deepest) hit
                for (let i = rects.length - 1; i >= 0; i--) {
                    const r = rects[i];
                    if (x >= r.x && x < r.x + r.w && y >= r.y && y < r.y + r.h) {
                        return r;
                    }
                }
                return null;
            }
        };

        /* ============================================================
         * SECTION: Renderer
         * WebGL rendering with text overlay on Canvas2D.
         * ============================================================ */

        const canvas = document.getElementById('canvas');
        const textCanvas = document.getElementById('textOverlay');
        const textCtx = textCanvas.getContext('2d');

        let rootData = null;
        let currentNode = null;
        let renderedRects = [];
        let canvasCSSWidth = 0;
        let canvasCSSHeight = 0;

        /**
         * Collect visible labels by traversing tree with pruning.
         * Skips branches that are outside viewport or too small for labels.
         */
        function collectVisibleLabels(node, results, zoom, panX, panY, viewW, viewH, minW, minH) {
            if (!node.bounds) return;
            const { x, y, width, height } = node.bounds;

            // Screen-space bounds
            const sx = x * zoom + panX;
            const sy = y * zoom + panY;
            const sw = width * zoom;
            const sh = height * zoom;

            // Prune: outside viewport
            if (sx + sw < 0 || sx > viewW || sy + sh < 0 || sy > viewH) return;

            // Prune: too small to ever have labels
            if (sw < minW && sh < minH) return;

            if (node.children) {
                for (const child of node.children) {
                    collectVisibleLabels(child, results, zoom, panX, panY, viewW, viewH, minW, minH);
                }
            } else if (sw >= minW && sh >= minH) {
                // Leaf node large enough for label
                results.push({ node, sx, sy, sw, sh });
            }
        }

        /** Render text labels on overlay canvas using tree traversal */
        function renderLabels() {
            const scale = Format.renderScale();
            const { zoom, panX, panY } = Viewport;

            textCtx.clearRect(0, 0, textCanvas.width, textCanvas.height);
            if (!currentNode) return;

            // Collect visible labels using tree traversal with pruning
            const labels = [];
            collectVisibleLabels(
                currentNode, labels,
                zoom, panX, panY,
                canvasCSSWidth, canvasCSSHeight,
                Config.LABEL_MIN_WIDTH, Config.LABEL_MIN_HEIGHT
            );

            // Pre-compute scaled padding
            const padX = Config.LABEL_PADDING_X * scale;
            const padY = Config.LABEL_PADDING_Y * scale;

            // Apply shared text style
            RenderStyle.apply(textCtx, RenderStyle.labelText(scale));

            const measureFn = t => textCtx.measureText(t).width;
            for (const { node, sx, sy, sw } of labels) {
                const displayText = Format.middleTruncate(node.name, measureFn, sw * scale - padX * 2);
                textCtx.fillText(displayText, sx * scale + padX, sy * scale + padY);
            }

            RenderStyle.clearShadow(textCtx);
        }

        // Cache for treemap layout - invalidated on node or size change
        const treemapCache = { node: null, width: 0, height: 0, rects: null };

        async function renderTreemap(node) {
            currentNode = node;
            updateStats();

            const container = document.getElementById('container');
            canvasCSSWidth = container.clientWidth;
            canvasCSSHeight = container.clientHeight;
            const scale = Format.renderScale();

            Format.sizeCanvas(canvas, canvasCSSWidth, canvasCSSHeight, scale);
            Format.sizeCanvas(textCanvas, canvasCSSWidth, canvasCSSHeight, scale);

            // Use cached layout if node and size unchanged
            if (treemapCache.node === node &&
                treemapCache.width === canvasCSSWidth &&
                treemapCache.height === canvasCSSHeight &&
                treemapCache.rects) {
                renderedRects = treemapCache.rects;
            } else {
                // Collect all leaf rects (in CSS pixel space)
                renderedRects = [];
                const baseRect = { x: 0, y: 0, width: canvasCSSWidth, height: canvasCSSHeight };
                collectLeafRects(node, baseRect, renderedRects);
                // Cache the result
                treemapCache.node = node;
                treemapCache.width = canvasCSSWidth;
                treemapCache.height = canvasCSSHeight;
                treemapCache.rects = renderedRects;
            }

            // Initialize WebGL on first use
            if (!webglInitialized) {
                WebGLRenderer.init(canvas);
                webglInitialized = true;
            }
            // Upload rects to GPU
            WebGLRenderer.setRects(renderedRects);
            // Render with viewport transform
            WebGLRenderer.render(Viewport, canvasCSSWidth, canvasCSSHeight);
            // Render text labels on overlay
            renderLabels();
            return { drawn: renderedRects.length, culled: 0 };
        }

        /**
         * WebGLRenderer - Stateful WebGL renderer for treemap rectangles.
         * State: gl, program, vao, buffers, rectCount
         * Draws all rectangles in a single draw call using instancing.
         */
        const WebGLRenderer = {
            gl: null,
            program: null,
            buffers: null,
            rectCount: 0,

            /** Vertex shader - transforms rect corners using viewport */
            VERT_SRC: `#version 300 es
                precision mediump float;
                // Per-vertex: corner offset (0,0), (1,0), (0,1), (1,1)
                in vec2 a_corner;
                // Per-instance: rect position, size, color, icon
                in vec4 a_rect;  // x, y, w, h
                in vec3 a_color;
                in float a_iconIdx;  // atlas index (0 = no icon)

                uniform vec2 u_resolution;
                uniform float u_zoom;
                uniform vec2 u_pan;
                uniform float u_borderWidth;
                uniform float u_atlasSize;  // grid size (e.g., 8)

                out vec3 v_color;
                out vec2 v_uv;
                out float v_borderUV;
                flat out vec2 v_iconCell;  // icon cell (col, row) in atlas - flat, not interpolated
                flat out float v_hasIcon;  // 1.0 if has icon
                flat out vec2 v_rectAspect; // rect width/height for aspect ratio correction
                out float v_iconScale;     // how much of rect the icon covers

                void main() {
                    // Calculate world position
                    vec2 pos = a_rect.xy + a_corner * a_rect.zw;
                    // Apply viewport transform
                    vec2 screen = pos * u_zoom + u_pan;
                    // Convert to clip space (-1 to 1)
                    vec2 clip = (screen / u_resolution) * 2.0 - 1.0;
                    clip.y = -clip.y;  // Flip Y for canvas coords
                    gl_Position = vec4(clip, 0.0, 1.0);

                    v_color = a_color;
                    v_uv = a_corner;

                    // Border width in UV space
                    float screenSize = min(a_rect.z, a_rect.w) * u_zoom;
                    v_borderUV = u_borderWidth / max(screenSize, 1.0);

                    // Pass rect aspect ratio for icon scaling
                    v_rectAspect = a_rect.zw;  // width, height

                    // Icon cell in atlas (flat = same for all vertices of this instance)
                    // Fade icon: full above 20px, fade 20->10px, gone below 10px
                    float iconFade = smoothstep(10.0, 20.0, screenSize);
                    v_hasIcon = (a_iconIdx > 0.5) ? iconFade : 0.0;
                    if (a_iconIdx > 0.5) {
                        float idx = a_iconIdx - 1.0;  // 0-based
                        v_iconCell = vec2(mod(idx, u_atlasSize), floor(idx / u_atlasSize));
                    } else {
                        v_iconCell = vec2(0.0);
                    }

                    // Icon always covers fixed 40% of rect - scales perfectly with zoom
                    v_iconScale = 0.4;
                }
            `,

            /** Fragment shader - gradient, border, and embossed icon */
            FRAG_SRC: `#version 300 es
                precision mediump float;
                in vec3 v_color;
                in vec2 v_uv;
                in float v_borderUV;
                flat in vec2 v_iconCell;
                flat in float v_hasIcon;
                flat in vec2 v_rectAspect;
                in float v_iconScale;

                uniform float u_borderDarkness;
                uniform sampler2D u_iconAtlas;
                uniform float u_atlasSize;

                out vec4 fragColor;

                void main() {
                    // Diagonal gradient: dark at top-left, light at bottom-right
                    float t = (v_uv.x + v_uv.y) * 0.5;
                    vec3 dark = v_color * 0.6;
                    vec3 light = min(v_color * 1.3, vec3(1.0));
                    vec3 color = mix(dark, light, t);

                    // Embossed icon in center with aspect ratio preservation
                    // v_hasIcon is 0-1 fade value (smoothstep from 10-20px screen size)
                    if (v_hasIcon > 0.01) {
                        // Calculate aspect-corrected icon region
                        // Icon is square, rect may not be - fit icon inside
                        float rectW = v_rectAspect.x;
                        float rectH = v_rectAspect.y;
                        float minDim = min(rectW, rectH);

                        // Scale factors to map rect UV to square icon UV
                        vec2 aspectScale = vec2(rectW / minDim, rectH / minDim);

                        // Map rect UV to icon-sized square region in center
                        vec2 centered = (v_uv - 0.5) * aspectScale / v_iconScale;

                        if (abs(centered.x) < 0.5 && abs(centered.y) < 0.5) {
                            // Convert to 0-1 within icon cell
                            vec2 iconLocal = centered + 0.5;
                            // Calculate atlas UV from cell position
                            vec2 atlasUV = (v_iconCell + iconLocal) / u_atlasSize;

                            // Sample icon with slight offset for emboss shadow
                            float offset = 2.0 / (u_atlasSize * 256.0);  // ~2 pixels in atlas
                            vec4 iconShadow = texture(u_iconAtlas, atlasUV + vec2(offset, offset));
                            vec4 iconMain = texture(u_iconAtlas, atlasUV);

                            // White emboss effect with fade: shadow darkens slightly, main adds white
                            float shadowAlpha = iconShadow.a * 0.12 * v_hasIcon;
                            float mainAlpha = iconMain.a * 0.25 * v_hasIcon;

                            // Apply emboss: slight shadow, then white highlight
                            color = mix(color, color * 0.85, shadowAlpha);
                            color = mix(color, vec3(1.0), mainAlpha);
                        }
                    }

                    // Thin dark border
                    float edge = min(min(v_uv.x, v_uv.y), min(1.0 - v_uv.x, 1.0 - v_uv.y));
                    float border = smoothstep(0.0, v_borderUV, edge);
                    color *= mix(u_borderDarkness, 1.0, border);

                    fragColor = vec4(color, 1.0);
                }
            `,

            /** Initialize WebGL context and shaders */
            init(canvas) {
                const gl = canvas.getContext('webgl2', { antialias: false });
                if (!gl) throw new Error('WebGL2 not supported');
                this.gl = gl;

                // Compile shaders
                const vert = this._compileShader(gl.VERTEX_SHADER, this.VERT_SRC);
                const frag = this._compileShader(gl.FRAGMENT_SHADER, this.FRAG_SRC);

                // Link program
                const program = gl.createProgram();
                gl.attachShader(program, vert);
                gl.attachShader(program, frag);
                gl.linkProgram(program);
                if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
                    throw new Error('Shader link failed: ' + gl.getProgramInfoLog(program));
                }
                this.program = program;

                // Get locations
                this.locs = {
                    a_corner: gl.getAttribLocation(program, 'a_corner'),
                    a_rect: gl.getAttribLocation(program, 'a_rect'),
                    a_color: gl.getAttribLocation(program, 'a_color'),
                    a_iconIdx: gl.getAttribLocation(program, 'a_iconIdx'),
                    u_resolution: gl.getUniformLocation(program, 'u_resolution'),
                    u_zoom: gl.getUniformLocation(program, 'u_zoom'),
                    u_pan: gl.getUniformLocation(program, 'u_pan'),
                    u_borderWidth: gl.getUniformLocation(program, 'u_borderWidth'),
                    u_borderDarkness: gl.getUniformLocation(program, 'u_borderDarkness'),
                    u_atlasSize: gl.getUniformLocation(program, 'u_atlasSize'),
                    u_iconAtlas: gl.getUniformLocation(program, 'u_iconAtlas')
                };

                // Create corner buffer (quad vertices)
                const cornerBuffer = gl.createBuffer();
                gl.bindBuffer(gl.ARRAY_BUFFER, cornerBuffer);
                gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
                    0, 0,  1, 0,  0, 1,  // Triangle 1
                    0, 1,  1, 0,  1, 1   // Triangle 2
                ]), gl.STATIC_DRAW);

                this.buffers = {
                    corner: cornerBuffer,
                    rect: gl.createBuffer(),
                    color: gl.createBuffer(),
                    iconIdx: gl.createBuffer()
                };

                // Create VAO
                this.vao = gl.createVertexArray();
                gl.bindVertexArray(this.vao);

                // Corner attribute (per-vertex)
                gl.bindBuffer(gl.ARRAY_BUFFER, cornerBuffer);
                gl.enableVertexAttribArray(this.locs.a_corner);
                gl.vertexAttribPointer(this.locs.a_corner, 2, gl.FLOAT, false, 0, 0);

                // Rect attribute (per-instance)
                gl.bindBuffer(gl.ARRAY_BUFFER, this.buffers.rect);
                gl.enableVertexAttribArray(this.locs.a_rect);
                gl.vertexAttribPointer(this.locs.a_rect, 4, gl.FLOAT, false, 0, 0);
                gl.vertexAttribDivisor(this.locs.a_rect, 1);

                // Color attribute (per-instance)
                gl.bindBuffer(gl.ARRAY_BUFFER, this.buffers.color);
                gl.enableVertexAttribArray(this.locs.a_color);
                gl.vertexAttribPointer(this.locs.a_color, 3, gl.FLOAT, false, 0, 0);
                gl.vertexAttribDivisor(this.locs.a_color, 1);

                // Icon index attribute (per-instance)
                gl.bindBuffer(gl.ARRAY_BUFFER, this.buffers.iconIdx);
                gl.enableVertexAttribArray(this.locs.a_iconIdx);
                gl.vertexAttribPointer(this.locs.a_iconIdx, 1, gl.FLOAT, false, 0, 0);
                gl.vertexAttribDivisor(this.locs.a_iconIdx, 1);

                gl.bindVertexArray(null);
            },

            /** Compile a shader */
            _compileShader(type, source) {
                const gl = this.gl;
                const shader = gl.createShader(type);
                gl.shaderSource(shader, source);
                gl.compileShader(shader);
                if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
                    throw new Error('Shader compile failed: ' + gl.getShaderInfoLog(shader));
                }
                return shader;
            },

            /** Upload rect data to GPU */
            setRects(rects) {
                const gl = this.gl;
                this.rectCount = rects.length;

                // Build typed arrays
                const rectData = new Float32Array(rects.length * 4);
                const colorData = new Float32Array(rects.length * 3);
                const iconData = new Float32Array(rects.length);

                for (let i = 0; i < rects.length; i++) {
                    const r = rects[i];
                    rectData[i * 4 + 0] = r.x;
                    rectData[i * 4 + 1] = r.y;
                    rectData[i * 4 + 2] = r.w;
                    rectData[i * 4 + 3] = r.h;

                    const [cr, cg, cb] = colorsRGB[r.colorIdx];
                    colorData[i * 3 + 0] = cr / 255;
                    colorData[i * 3 + 1] = cg / 255;
                    colorData[i * 3 + 2] = cb / 255;

                    // Icon atlas index (0 = no icon)
                    iconData[i] = FileIcons.getAtlasIndex(r.item.name);
                }

                // Upload to GPU
                gl.bindBuffer(gl.ARRAY_BUFFER, this.buffers.rect);
                gl.bufferData(gl.ARRAY_BUFFER, rectData, gl.STATIC_DRAW);

                gl.bindBuffer(gl.ARRAY_BUFFER, this.buffers.color);
                gl.bufferData(gl.ARRAY_BUFFER, colorData, gl.STATIC_DRAW);

                gl.bindBuffer(gl.ARRAY_BUFFER, this.buffers.iconIdx);
                gl.bufferData(gl.ARRAY_BUFFER, iconData, gl.STATIC_DRAW);
            },

            /** Render all rects with current viewport */
            render(viewport, cssWidth, cssHeight) {
                const gl = this.gl;

                // Viewport uses actual canvas buffer size
                gl.viewport(0, 0, gl.canvas.width, gl.canvas.height);
                gl.clearColor(0.102, 0.102, 0.180, 1.0);  // #1a1a2e
                gl.clear(gl.COLOR_BUFFER_BIT);

                if (this.rectCount === 0) return;

                gl.useProgram(this.program);
                gl.bindVertexArray(this.vao);

                // Set uniforms (resolution is CSS pixel space where rects are defined)
                gl.uniform2f(this.locs.u_resolution, cssWidth, cssHeight);
                gl.uniform1f(this.locs.u_zoom, viewport.zoom);
                gl.uniform2f(this.locs.u_pan, viewport.panX, viewport.panY);
                gl.uniform1f(this.locs.u_borderWidth, Config.BORDER_WIDTH);
                gl.uniform1f(this.locs.u_borderDarkness, Config.BORDER_DARKNESS);

                // Icon atlas
                gl.uniform1f(this.locs.u_atlasSize, FileIcons.atlasSize || 1);
                if (FileIcons.atlas) {
                    gl.activeTexture(gl.TEXTURE0);
                    gl.bindTexture(gl.TEXTURE_2D, FileIcons.atlas);
                    gl.uniform1i(this.locs.u_iconAtlas, 0);
                }

                // Draw all rects in one call
                gl.drawArraysInstanced(gl.TRIANGLES, 0, 6, this.rectCount);

                gl.bindVertexArray(null);
            }
        };

        let webglInitialized = false;

        /**
         * SunburstRenderer - Stateful Canvas2D renderer for sunburst visualization.
         * Two-phase animation: (1) fade siblings out/new content in, (2) expand angles
         */
        const SunburstRenderer = {
            canvas: null,
            ctx: null,
            arcs: [],
            rootNode: null,
