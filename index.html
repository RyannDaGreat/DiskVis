            displayNode: null,
            navigationStack: [],
            hoveredArc: null,
            innerRadius: 60,
            baseRingWidth: 0,
            maxDepth: 50,  // High limit - exponential decay handles the space
            centerX: 0,
            centerY: 0,
            width: 0,
            height: 0,

            // Animation state
            animating: false,
            animationId: null,

            init(canvas) {
                this.canvas = canvas;
                this.ctx = canvas.getContext('2d');
            },

            setRoot(node, width, height) {
                this.rootNode = node;
                this.displayNode = node;
                this.navigationStack = [];
                this.width = width;
                this.height = height;
                this.setupCanvas(width, height);
                this.arcs = this.calculateArcsForNode(node);
                this.render();
            },

            setupCanvas(width, height) {
                const scale = window.devicePixelRatio || 1;
                this.canvas.width = width * scale;
                this.canvas.height = height * scale;
                this.canvas.style.width = width + 'px';
                this.canvas.style.height = height + 'px';

                this.centerX = width / 2;
                this.centerY = height / 2;
                const maxRadius = Math.min(width, height) / 2 - 20;

                // Calculate base ring width so that full-width rings + decayed rings fit
                // Full rings take: FULL_WIDTH_RINGS * baseWidth
                // Decayed rings converge to: baseWidth * DECAY / (1 - DECAY) approximately
                const fullRings = SunburstLayout.FULL_WIDTH_RINGS;
                const decay = SunburstLayout.DECAY_FACTOR;
                const decaySum = decay / (1 - decay);  // Geometric series sum
                const totalFactor = fullRings + decaySum;
                const naturalWidth = (maxRadius - this.innerRadius) / totalFactor;
                // Apply scale factor to control ring thickness
                this.baseRingWidth = naturalWidth * SunburstLayout.RING_WIDTH_SCALE;
            },

            calculateArcsForNode(node) {
                return SunburstLayout.calculateArcs(
                    node, this.centerX, this.centerY,
                    this.innerRadius, this.baseRingWidth, this.maxDepth
                );
            },

            calculateLayout(width, height) {
                this.width = width;
                this.height = height;
                this.setupCanvas(width, height);
                this.arcs = this.calculateArcsForNode(this.displayNode);
            },

            render(arcsToRender = null) {
                const ctx = this.ctx;
                const scale = window.devicePixelRatio || 1;
                const arcs = arcsToRender || this.arcs;

                // Clear at base transform
                ctx.setTransform(scale, 0, 0, scale, 0, 0);
                ctx.fillStyle = '#1a1a2e';
                ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

                // Apply viewport transform - SAME math as treemap: screen = world * zoom + pan
                const vp = SunburstViewport;
                ctx.translate(vp.panX, vp.panY);
                ctx.scale(vp.zoom, vp.zoom);

                // Sort by depth so inner rings draw first
                const sorted = [...arcs].sort((a, b) => a.depth - b.depth);
                for (const arc of sorted) {
                    if (arc.opacity !== undefined && arc.opacity < 0.01) continue;
                    this.drawArc(arc, !this.animating && arc === this.hoveredArc, arc.opacity);
                }

                // Draw text labels on top of arcs
                for (const arc of sorted) {
                    if (arc.opacity !== undefined && arc.opacity < 0.01) continue;
                    this.drawArcText(arc, arc.opacity !== undefined ? arc.opacity : 1);
                }

                this.drawCenter();
            },

            drawArc(arc, highlighted, opacity = 1) {
                const ctx = this.ctx;
                const angleSpan = arc.endAngle - arc.startAngle;
                if (angleSpan < 0.001 || arc.outerRadius <= arc.innerRadius) return;

                const [r, g, b] = colorsRGB[arc.colorIdx];

                // Each segment gets its own vertical gradient (dark at bottom, light at top)
                const gradient = ctx.createLinearGradient(
                    this.centerX, this.centerY + arc.outerRadius,  // bottom (dark)
                    this.centerX, this.centerY - arc.outerRadius   // top (light)
                );
                const baseColor = highlighted
                    ? [Math.min(255, r + 40), Math.min(255, g + 40), Math.min(255, b + 40)]
                    : [r, g, b];

                gradient.addColorStop(0, `rgba(${Math.round(baseColor[0] * 0.7)}, ${Math.round(baseColor[1] * 0.7)}, ${Math.round(baseColor[2] * 0.7)}, ${opacity})`);
                gradient.addColorStop(1, `rgba(${Math.min(255, Math.round(baseColor[0] * 1.2))}, ${Math.min(255, Math.round(baseColor[1] * 1.2))}, ${Math.min(255, Math.round(baseColor[2] * 1.2))}, ${opacity})`);

                ctx.beginPath();
                ctx.arc(this.centerX, this.centerY, arc.outerRadius, arc.startAngle, arc.endAngle);
                ctx.arc(this.centerX, this.centerY, arc.innerRadius, arc.endAngle, arc.startAngle, true);
                ctx.closePath();

                ctx.fillStyle = gradient;
                ctx.fill();

                ctx.strokeStyle = `rgba(0, 0, 0, ${0.3 * opacity})`;
                ctx.lineWidth = 0.5 / SunburstViewport.zoom;  // Constant thickness regardless of zoom
                ctx.stroke();
            },

            drawArcText(arc, opacity = 1) {
                const ctx = this.ctx;
                if (!arc.node || !arc.node.name) return;
                if (opacity < 0.5) return; // Don't draw text for fading arcs

                const angleSpan = arc.endAngle - arc.startAngle;
                const ringHeight = arc.outerRadius - arc.innerRadius;

                // Skip if arc is too small
                if (angleSpan < 0.05 || ringHeight < 10) return;

                const middleRadius = (arc.innerRadius + arc.outerRadius) / 2;
                const arcLength = middleRadius * angleSpan;

                // Skip if arc length is too short for any text
                if (arcLength < 20) return;

                ctx.save();

                // Monospace font - uniform character width makes curved text simple
                const fontSize = Math.max(8, Math.min(12, ringHeight * 0.55));
                ctx.font = `${fontSize}px Menlo, Monaco, monospace`;
                ctx.fillStyle = `rgba(255, 255, 255, ${0.9 * opacity})`;
                ctx.textBaseline = 'middle';
                ctx.shadowColor = 'rgba(0, 0, 0, 0.7)';
                ctx.shadowBlur = 2;
                ctx.shadowOffsetX = 1;
                ctx.shadowOffsetY = 1;

                const name = arc.node.name;
                const charWidth = ctx.measureText('M').width; // All chars same width
                const padding = 4;
                const maxChars = Math.floor((arcLength - padding * 2) / charWidth);

                if (maxChars < 1) { ctx.restore(); return; }

                // Truncate if needed
                let displayText = name;
                if (name.length > maxChars) {
                    if (maxChars <= 3) {
                        displayText = name.substring(0, maxChars);
                    } else {
                        const half = Math.floor((maxChars - 1) / 2);
                        displayText = name.substring(0, half) + '…' + name.slice(-(maxChars - half - 1));
                    }
                }

                const midAngle = (arc.startAngle + arc.endAngle) / 2;
                let normalizedMid = midAngle % (Math.PI * 2);
                if (normalizedMid < 0) normalizedMid += Math.PI * 2;

                // Flip text in bottom half so it's always readable
                const flipText = normalizedMid > 0 && normalizedMid < Math.PI;
                const direction = flipText ? -1 : 1;

                // Calculate start angle to center text
                const totalAngle = displayText.length * charWidth / middleRadius;
                const startAngle = midAngle - direction * totalAngle / 2;

                // Draw each character with uniform spacing
                for (let i = 0; i < displayText.length; i++) {
                    const charAngle = startAngle + direction * (i + 0.5) * charWidth / middleRadius;
                    const x = this.centerX + Math.cos(charAngle) * middleRadius;
                    const y = this.centerY + Math.sin(charAngle) * middleRadius;

                    ctx.save();
                    ctx.translate(x, y);
                    ctx.rotate(charAngle + Math.PI / 2 + (flipText ? Math.PI : 0));
                    ctx.fillText(displayText[i], -charWidth / 2, 0);
                    ctx.restore();
                }

                ctx.restore();
            },

            drawCenter() {
                const ctx = this.ctx;
                const canGoBack = this.navigationStack.length > 0;

                ctx.beginPath();
                ctx.arc(this.centerX, this.centerY, this.innerRadius, 0, Math.PI * 2);

                const gradient = ctx.createRadialGradient(
                    this.centerX, this.centerY, 0,
                    this.centerX, this.centerY, this.innerRadius
                );
                gradient.addColorStop(0, canGoBack ? 'rgba(108, 155, 207, 0.3)' : 'rgba(30, 30, 50, 0.8)');
                gradient.addColorStop(1, canGoBack ? 'rgba(108, 155, 207, 0.1)' : 'rgba(30, 30, 50, 0.6)');
                ctx.fillStyle = gradient;
                ctx.fill();

                ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
                ctx.lineWidth = 1 / SunburstViewport.zoom;  // Constant thickness regardless of zoom
                ctx.stroke();

                if (this.animating) return;

                ctx.fillStyle = canGoBack ? 'rgba(108, 155, 207, 0.9)' : 'rgba(255, 255, 255, 0.6)';
                ctx.font = '12px -apple-system, BlinkMacSystemFont, sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';

                const label = this.displayNode ? this.displayNode.name : '';
                const maxWidth = this.innerRadius * 1.6;
                const displayLabel = Format.middleTruncate(label, t => ctx.measureText(t).width, maxWidth);
                ctx.fillText(displayLabel, this.centerX, this.centerY - 8);

                if (this.displayNode) {
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
                    ctx.font = '10px -apple-system, BlinkMacSystemFont, sans-serif';
                    ctx.fillText(Format.bytes(this.displayNode.size), this.centerX, this.centerY + 8);
                }

                if (canGoBack) {
                    ctx.fillStyle = 'rgba(108, 155, 207, 0.6)';
                    ctx.font = '18px -apple-system, BlinkMacSystemFont, sans-serif';
                    ctx.fillText('↑', this.centerX, this.centerY + 26);
                }
            },

            handleMouseMove(x, y) {
                if (this.animating) return null;

                if (SunburstLayout.isInCenter(x, y, this.centerX, this.centerY, this.innerRadius)) {
                    if (this.hoveredArc) {
                        this.hoveredArc = null;
                        this.render();
                    }
                    return this.navigationStack.length > 0 ? { node: this.displayNode, isCenter: true } : null;
                }

                const hit = SunburstLayout.hitTest(x, y, this.arcs, this.centerX, this.centerY);
                if (hit !== this.hoveredArc) {
                    this.hoveredArc = hit;
                    this.render();
                }
                return hit ? { node: hit.node, isCenter: false } : null;
            },

            handleClick(x, y) {
                if (this.animating) return false;

                if (SunburstLayout.isInCenter(x, y, this.centerX, this.centerY, this.innerRadius)) {
                    return this.drillUp();
                }

                const hit = SunburstLayout.hitTest(x, y, this.arcs, this.centerX, this.centerY);
                if (hit && hit.node.children && hit.node.children.length > 0) {
                    SelectedDirectory.set(hit.node, 'sunburst');
                    return this.drillDown(hit.node, hit);
                }
                return false;
            },

            /**
             * Two-phase drill down animation:
             * Phase 1: Fade out siblings, fade in new outer rings (angles stay fixed)
             * Phase 2: Expand clicked segment and children to 360°
             */
            drillDown(node, clickedArc) {
                const TAU = Math.PI * 2;
                const fromArcs = this.arcs;
                const toArcsRaw = this.calculateArcsForNode(node);

                const clickedPath = node.path;
                const clickedStart = clickedArc.startAngle;
                const clickedEnd = clickedArc.endAngle;
                const clickedSpan = clickedEnd - clickedStart;
                const clickedDepth = clickedArc.depth;

                // Save for back navigation
                this.navigationStack.push({
                    node: this.displayNode,
                    arcs: fromArcs,
                    clickedPath,
                    clickedStart,
                    clickedEnd,
                    clickedDepth
                });

                this.displayNode = node;
                this.hoveredArc = null;

                // Build arc sets for animation
                // "Staying" arcs: clicked segment and its descendants (visible in both views)
                // "Leaving" arcs: siblings (fade out in phase 1)
                // "Entering" arcs: new deeper content (fade in during phase 1)

                const stayingArcs = [];  // {from, mid, to} - from=current, mid=after phase1, to=final
                const leavingArcs = [];  // fade out
                const enteringArcs = []; // fade in

                const toByPath = new Map();
                for (const a of toArcsRaw) toByPath.set(a.path, a);

                for (const fromArc of fromArcs) {
                    const isDescendant = fromArc.path === clickedPath || fromArc.path.startsWith(clickedPath + '/');

                    if (isDescendant) {
                        const toArc = toByPath.get(fromArc.path);
                        if (toArc) {
                            // Calculate mid-state: same angles as now, but new outer content will appear
                            stayingArcs.push({
                                from: { ...fromArc, opacity: 1 },
                                to: { ...toArc, opacity: 1 }
                            });
                        }
                    } else {
                        // Sibling - fades out
                        leavingArcs.push({ ...fromArc, opacity: 1 });
                    }
                }

                // Find new arcs that weren't visible before
                for (const toArc of toArcsRaw) {
                    const wasVisible = fromArcs.some(f => f.path === toArc.path);
                    if (!wasVisible) {
                        // New arc - appears at its final angle but fades in
                        // Position it relative to clicked segment's current angle during phase 1
                        const relStart = (toArc.startAngle - (-Math.PI / 2)) / TAU;
                        const relEnd = (toArc.endAngle - (-Math.PI / 2)) / TAU;
                        const midStart = clickedStart + relStart * clickedSpan;
                        const midEnd = clickedStart + relEnd * clickedSpan;

                        // Depth offset: this arc will be further out during phase 1
                        const offsetDepth = toArc.depth + clickedDepth;
                        const midInner = SunburstLayout.getRadiusAtDepth(offsetDepth, this.innerRadius, this.baseRingWidth);
                        const midOuter = midInner + SunburstLayout.getRingWidth(offsetDepth, this.baseRingWidth);

                        enteringArcs.push({
                            mid: {
                                ...toArc,
                                startAngle: midStart,
                                endAngle: midEnd,
                                innerRadius: midInner,
                                outerRadius: midOuter,
                                opacity: 1
                            },
                            to: { ...toArc, opacity: 1 }
                        });
                    }
                }

                // Animation phases
                const phase1Duration = 200;  // ms - fade
                const phase2Duration = 300;  // ms - expand
                const totalDuration = phase1Duration + phase2Duration;

                this.animating = true;
                const startTime = performance.now();

                const animate = (now) => {
                    const elapsed = now - startTime;
                    const t = Math.min(1, elapsed / totalDuration);
                    const phase1T = Math.min(1, elapsed / phase1Duration);
                    const phase2T = elapsed > phase1Duration
                        ? Math.min(1, (elapsed - phase1Duration) / phase2Duration)
                        : 0;

                    const ease1 = SunburstLayout.easeInOutQuad(phase1T);
                    const ease2 = SunburstLayout.easeInOutQuad(phase2T);

                    const frameArcs = [];

                    // Leaving arcs: fade out during phase 1
                    for (const arc of leavingArcs) {
                        frameArcs.push({ ...arc, opacity: 1 - ease1 });
                    }

                    // Staying arcs: keep angles during phase 1, expand during phase 2
                    for (const { from, to } of stayingArcs) {
                        // Phase 2: interpolate from current angles to final 360° angles
                        frameArcs.push({
                            ...to,
                            startAngle: SunburstLayout.lerp(from.startAngle, to.startAngle, ease2),
                            endAngle: SunburstLayout.lerp(from.endAngle, to.endAngle, ease2),
                            innerRadius: SunburstLayout.lerp(from.innerRadius, to.innerRadius, ease2),
                            outerRadius: SunburstLayout.lerp(from.outerRadius, to.outerRadius, ease2),
                            opacity: 1
                        });
                    }

                    // Entering arcs: fade in during phase 1 at mid position, move to final during phase 2
                    for (const { mid, to } of enteringArcs) {
                        frameArcs.push({
                            ...to,
                            startAngle: SunburstLayout.lerp(mid.startAngle, to.startAngle, ease2),
                            endAngle: SunburstLayout.lerp(mid.endAngle, to.endAngle, ease2),
                            innerRadius: SunburstLayout.lerp(mid.innerRadius, to.innerRadius, ease2),
                            outerRadius: SunburstLayout.lerp(mid.outerRadius, to.outerRadius, ease2),
                            opacity: ease1
                        });
                    }

                    this.render(frameArcs);

                    if (t < 1) {
                        this.animationId = requestAnimationFrame(animate);
                    } else {
                        this.animating = false;
                        this.animationId = null;
                        this.arcs = toArcsRaw;
                        this.render();
                    }
                };

                if (this.animationId) cancelAnimationFrame(this.animationId);
                this.animationId = requestAnimationFrame(animate);
                return true;
            },

            /** Two-phase drill up animation (reverse of drill down) */
            drillUp() {
                if (this.navigationStack.length === 0) return false;

                const prev = this.navigationStack.pop();
                const TAU = Math.PI * 2;
                const fromArcsRaw = this.arcs;
                const toArcs = prev.arcs;

                const clickedStart = prev.clickedStart;
                const clickedEnd = prev.clickedEnd;
                const clickedSpan = clickedEnd - clickedStart;
                const clickedDepth = prev.clickedDepth;

                this.displayNode = prev.node;
                this.hoveredArc = null;

                const toByPath = new Map();
                for (const a of toArcs) toByPath.set(a.path, a);

                const stayingArcs = [];
                const leavingArcs = [];
                const enteringArcs = [];

                // Current arcs that will stay (exist in parent view)
                for (const fromArc of fromArcsRaw) {
                    const toArc = toByPath.get(fromArc.path);
                    if (toArc) {
                        stayingArcs.push({
                            from: { ...fromArc, opacity: 1 },
                            to: { ...toArc, opacity: 1 }
                        });
                    } else {
                        // This arc won't exist in parent - it collapses and fades
                        leavingArcs.push({
                            from: { ...fromArc, opacity: 1 },
                            mid: {
                                ...fromArc,
                                startAngle: SunburstLayout.lerp(clickedStart, clickedEnd,
                                    (fromArc.startAngle - (-Math.PI/2)) / TAU),
                                endAngle: SunburstLayout.lerp(clickedStart, clickedEnd,
                                    (fromArc.endAngle - (-Math.PI/2)) / TAU),
                                opacity: 1
                            }
                        });
                    }
                }

                // Parent arcs that will appear (siblings)
                for (const toArc of toArcs) {
                    const wasVisible = fromArcsRaw.some(f => f.path === toArc.path);
                    if (!wasVisible) {
                        // Sibling coming back - starts collapsed at edge
                        const midAngle = (toArc.startAngle + toArc.endAngle) / 2;
                        const collapsePoint = midAngle < (clickedStart + clickedEnd) / 2
                            ? clickedStart : clickedEnd;

                        enteringArcs.push({
                            mid: {
                                ...toArc,
                                startAngle: collapsePoint,
                                endAngle: collapsePoint,
                                innerRadius: this.innerRadius,
                                outerRadius: this.innerRadius,
                                opacity: 0
                            },
                            to: { ...toArc, opacity: 1 }
                        });
                    }
                }

                const phase1Duration = 300;  // collapse
                const phase2Duration = 200;  // fade in siblings
                const totalDuration = phase1Duration + phase2Duration;

                this.animating = true;
                const startTime = performance.now();

                const animate = (now) => {
                    const elapsed = now - startTime;
                    const t = Math.min(1, elapsed / totalDuration);
                    const phase1T = Math.min(1, elapsed / phase1Duration);
                    const phase2T = elapsed > phase1Duration
                        ? Math.min(1, (elapsed - phase1Duration) / phase2Duration)
                        : 0;

                    const ease1 = SunburstLayout.easeInOutQuad(phase1T);
                    const ease2 = SunburstLayout.easeInOutQuad(phase2T);

                    const frameArcs = [];

                    // Staying arcs: collapse angles during phase 1
                    for (const { from, to } of stayingArcs) {
                        frameArcs.push({
                            ...to,
                            startAngle: SunburstLayout.lerp(from.startAngle, to.startAngle, ease1),
                            endAngle: SunburstLayout.lerp(from.endAngle, to.endAngle, ease1),
                            innerRadius: SunburstLayout.lerp(from.innerRadius, to.innerRadius, ease1),
                            outerRadius: SunburstLayout.lerp(from.outerRadius, to.outerRadius, ease1),
                            opacity: 1
                        });
                    }

                    // Leaving arcs: collapse during phase 1, fade during phase 2
                    for (const { from, mid } of leavingArcs) {
                        frameArcs.push({
                            ...from,
                            startAngle: SunburstLayout.lerp(from.startAngle, mid.startAngle, ease1),
                            endAngle: SunburstLayout.lerp(from.endAngle, mid.endAngle, ease1),
                            opacity: 1 - ease2
                        });
                    }

                    // Entering arcs: expand and fade in during phase 2
                    for (const { mid, to } of enteringArcs) {
                        frameArcs.push({
                            ...to,
                            startAngle: SunburstLayout.lerp(mid.startAngle, to.startAngle, ease1),
                            endAngle: SunburstLayout.lerp(mid.endAngle, to.endAngle, ease1),
                            innerRadius: SunburstLayout.lerp(mid.innerRadius, to.innerRadius, ease1),
                            outerRadius: SunburstLayout.lerp(mid.outerRadius, to.outerRadius, ease1),
                            opacity: ease2
                        });
                    }

                    this.render(frameArcs);

                    if (t < 1) {
                        this.animationId = requestAnimationFrame(animate);
                    } else {
                        this.animating = false;
                        this.animationId = null;
                        this.arcs = toArcs;
                        this.render();
                    }
                };

                if (this.animationId) cancelAnimationFrame(this.animationId);
                this.animationId = requestAnimationFrame(animate);
                return true;
            },

            drillToRoot() {
                if (this.navigationStack.length === 0) return false;
                this.drillUp();
                return true;
            }
        };

        /**
         * IcicleRenderer - Stateful Canvas2D renderer for icicle visualization.
         */
        const IcicleRenderer = {
            canvas: null,
            ctx: null,
            rects: [],
            rootNode: null,
            displayNode: null,
            navigationStack: [],
            hoveredRect: null,
            width: 0,
            height: 0,

            init(canvas) {
                this.canvas = canvas;
                this.ctx = canvas.getContext('2d');
            },

            setRoot(node, width, height) {
                this.rootNode = node;
                this.displayNode = node;
                this.navigationStack = [];
                this.width = width;
                this.height = height;
                this.setupCanvas(width, height);
                this.rects = IcicleLayout.calculateRects(node, width);
            },

            setupCanvas(width, height) {
                const scale = window.devicePixelRatio || 1;
                this.canvas.width = width * scale;
                this.canvas.height = height * scale;
                this.canvas.style.width = width + 'px';
                this.canvas.style.height = height + 'px';
                this.width = width;
                this.height = height;
            },

            calculateLayout(width, height) {
                this.setupCanvas(width, height);
                this.rects = IcicleLayout.calculateRects(this.displayNode, width);
            },

            render() {
                const ctx = this.ctx;
                const scale = window.devicePixelRatio || 1;
                const vp = IcicleViewport;

                ctx.setTransform(scale, 0, 0, scale, 0, 0);
                ctx.imageSmoothingEnabled = false;  // Crisp rects, no anti-aliasing
                ctx.fillStyle = '#1a1a2e';
                ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

                // Draw rects with transform
                for (const r of this.rects) {
                    const highlighted = r === this.hoveredRect;
                    this.drawRect(r, highlighted);
                }

                // Draw labels WITHOUT horizontal stretch
                for (const r of this.rects) {
                    this.drawLabel(r);
                }
            },

            drawRect(r, highlighted) {
                const ctx = this.ctx;
                const vp = IcicleViewport;

                // Transform to screen
                const screenX = Math.round(r.x * vp.zoom + vp.panX);
                const screenY = Math.round(r.y + vp.panY);
                const screenW = Math.round(r.w * vp.zoom);
                const screenH = r.h;

                // Cull off-screen
                if (screenX + screenW < 0 || screenX > this.width ||
                    screenY + screenH < 0 || screenY > this.height) return;

                // Merged rect: check if should burst open
                if (r.isMerged && r.mergedChildren) {
                    // If largest merged child would be visible, burst open
                    const largest = r.mergedChildren[0];
                    if (largest && largest.w * vp.zoom >= IcicleLayout.MERGE_THRESHOLD) {
                        // Burst: draw children individually
                        for (const m of r.mergedChildren) {
                            const cw = Math.round(m.w * vp.zoom);
                            if (cw < 1) continue;
                            const cx = Math.round(m.x * vp.zoom + vp.panX);
                            const color = colorsRGB[Math.abs(ColorUtils.hash(m.child.path)) % Config.COLORS.length];
                            ctx.fillStyle = RenderStyle.diagonalGradient(ctx, cx, screenY, cw, screenH, ...color);
                            ctx.fillRect(cx, screenY, cw, screenH);
                            ctx.strokeStyle = '#000';
                            ctx.lineWidth = 1;
                            ctx.strokeRect(cx + 0.5, screenY + 0.5, cw, screenH);
                        }
                        return;
                    }
                    // Still too small: just black fill, no stroke
                    ctx.fillStyle = '#000';
                    ctx.fillRect(screenX, screenY, screenW, screenH);
                    return;
                }

                // Skip tiny non-merged rects
                if (screenW < 1) return;

                const [red, g, b] = colorsRGB[r.colorIdx];
                const baseColor = highlighted
                    ? RenderStyle.highlightRGB(red, g, b)
                    : [red, g, b];

                ctx.fillStyle = RenderStyle.diagonalGradient(ctx, screenX, screenY, screenW, screenH, ...baseColor);
                ctx.fillRect(screenX, screenY, screenW, screenH);

                ctx.strokeStyle = '#000';
                ctx.lineWidth = 1;
                ctx.strokeRect(screenX + 0.5, screenY + 0.5, screenW, screenH);
            },

            drawLabel(r) {
                const ctx = this.ctx;
                const vp = IcicleViewport;

                // Transform rect coords to screen
                const screenX = r.x * vp.zoom + vp.panX;
                const screenY = r.y + vp.panY;
                const screenW = r.w * vp.zoom;
                const screenH = r.h;
                const screenRight = screenX + screenW;

                // Skip if completely off screen vertically
                if (screenY + screenH < 0 || screenY > this.height) return;
                // Skip if completely off screen horizontally
                if (screenRight < 0 || screenX > this.width) return;

                // Sticky label: pin to left edge if rect extends past it
                const labelX = Math.max(0, screenX);
                const visibleRight = Math.min(this.width, screenRight);
                const visibleWidth = visibleRight - labelX;

                // Skip if visible area too narrow for label
                if (visibleWidth < RenderStyle.MIN_LABEL_WIDTH) return;

                const padding = Config.LABEL_PADDING_X;
                const maxWidth = visibleWidth - padding * 2;

                // Apply shared text style (scale=1 for icicle)
                RenderStyle.apply(ctx, RenderStyle.labelText(1));
                ctx.textBaseline = 'middle';

                // Build label text
                let labelText = r.node.name;
                if (r.isMerged && r.mergedChildren) {
                    // Count how many merged children are "in view" (would be visible at current zoom)
                    const inView = r.mergedChildren.filter(m =>
                        m.w * IcicleViewport.zoom >= RenderStyle.SKIP_RECT_THRESHOLD
                    ).length;
                    labelText = `${r.mergedChildren.length} smaller` + (inView > 0 ? ` (${inView} in view)` : '');
                }

                const measureFn = t => ctx.measureText(t).width;
                const displayText = Format.middleTruncate(labelText, measureFn, maxWidth);
                ctx.fillText(displayText, labelX + padding, screenY + screenH / 2);

                RenderStyle.clearShadow(ctx);
            },

            handleMouseMove(worldX, worldY) {
                const hit = IcicleLayout.hitTest(this.rects, worldX, worldY);
                if (hit !== this.hoveredRect) {
                    this.hoveredRect = hit;
                    this.render();
                }
                return hit ? { node: hit.node } : null;
            },

            handleClick(worldX, worldY) {
                const hit = IcicleLayout.hitTest(this.rects, worldX, worldY);
                if (hit && hit.node.children && hit.node.children.length > 0) {
                    // Set selected directory and zoom/pan to show it (no drill-down)
                    SelectedDirectory.set(hit.node, 'icicle');
                    this.animateZoomToFit(hit);
                    return true;
                }
                return false;
            },

            drillDown(node) {
                if (!node || !node.children || node.children.length === 0) return false;
                this.navigationStack.push(this.displayNode);
                this.displayNode = node;
                this.rects = IcicleLayout.calculateRects(node, this.width, this.height);
                IcicleViewport.reset();
                this.render();
                return true;
            },

            drillUp() {
                if (this.navigationStack.length === 0) return false;
                this.displayNode = this.navigationStack.pop();
                this.rects = IcicleLayout.calculateRects(this.displayNode, this.width, this.height);
                IcicleViewport.reset();
                this.render();
                return true;
            },

            drillToRoot() {
                if (this.navigationStack.length === 0) return false;
                this.drillUp();
                return true;
            },

            /**
             * Find rect by node path in current rects.
             */
            findRectByPath(path) {
                return this.rects.find(r => r.node.path === path);
            },

            /**
             * Animate zoom to fit a specific rect.
             * Used when treemap drag-select triggers cross-view sync.
             */
            animateZoomToFit(targetRect) {
                if (!targetRect || this.animatingZoom) return;

                const duration = Config.SELECTION.ZOOM_ANIMATION_DURATION;
                const startTime = performance.now();

                // Calculate target viewport to fit the rect
                const padding = 20;
                const targetWidth = targetRect.w;
                const targetZoom = Math.max(
                    Config.ZOOM.MIN,
                    Math.min(Config.ZOOM.MAX, (this.width - padding * 2) / targetWidth)
                );
                const targetPanX = -targetRect.x * targetZoom + padding;
                const targetPanY = -targetRect.y + padding;

                const startZoom = IcicleViewport.zoom;
                const startPanX = IcicleViewport.panX;
                const startPanY = IcicleViewport.panY;

                this.animatingZoom = true;

                const animate = (now) => {
                    const elapsed = now - startTime;
                    const t = Math.min(1, elapsed / duration);
                    // Ease-out cubic
                    const ease = 1 - Math.pow(1 - t, 3);

                    IcicleViewport.zoom = startZoom + (targetZoom - startZoom) * ease;
                    IcicleViewport.panX = startPanX + (targetPanX - startPanX) * ease;
                    IcicleViewport.panY = startPanY + (targetPanY - startPanY) * ease;

                    this.render();

                    if (t < 1) {
                        requestAnimationFrame(animate);
                    } else {
                        this.animatingZoom = false;
                    }
                };

                requestAnimationFrame(animate);
            }
        };

        /**
         * TypesAnalysis - Pure functions for file type aggregation.
         * @pure All methods are pure functions.
         */
        const TypesAnalysis = {
            /**
             * @pure Extract extension from filename.
             * @param {string} filename - File name
             * @returns {string} Extension (lowercase, without dot) or '(no ext)'
             * @example TypesAnalysis.getExtension('file.TXT') // => 'txt'
             */
            getExtension(filename) {
                const lastDot = filename.lastIndexOf('.');
                if (lastDot === -1 || lastDot === 0 || lastDot === filename.length - 1) {
                    return '(no ext)';
                }
                return filename.slice(lastDot + 1).toLowerCase();
            },

            /**
             * @pure Aggregate file sizes by extension with statistics.
             * Extensions with count < minCount are grouped into "other".
             * @param {Object} node - Root node of tree
             * @param {number} minCount - Minimum file count to be its own category (default 2)
             * @returns {Object[]} Array of {ext, size, count, min, max, mean, median, stdDev} sorted by size desc
             */
            aggregateByExtension(node, minCount = 2) {
                const extMap = new Map();

                const traverse = (n) => {
                    if (!n.children || n.children.length === 0) {
                        const ext = this.getExtension(n.name);
                        if (!extMap.has(ext)) {
                            extMap.set(ext, { ext, size: 0, count: 0, sizes: [] });
                        }
                        const entry = extMap.get(ext);
                        entry.size += n.size;
                        entry.count += 1;
                        entry.sizes.push(n.size);
                    } else {
                        for (const child of n.children) {
                            traverse(child);
                        }
                    }
                };

                traverse(node);

                // Calculate statistics for each extension
                const calcStats = (sizes) => {
                    if (sizes.length === 0) return { min: 0, max: 0, mean: 0, median: 0, stdDev: 0 };
                    const sorted = [...sizes].sort((a, b) => a - b);
                    const min = sorted[0];
                    const max = sorted[sorted.length - 1];
                    const sum = sizes.reduce((a, b) => a + b, 0);
                    const mean = sum / sizes.length;
                    const median = sizes.length % 2 === 0
                        ? (sorted[sizes.length / 2 - 1] + sorted[sizes.length / 2]) / 2
                        : sorted[Math.floor(sizes.length / 2)];
                    const variance = sizes.reduce((acc, s) => acc + Math.pow(s - mean, 2), 0) / sizes.length;
                    const stdDev = Math.sqrt(variance);
                    return { min, max, mean, median, stdDev };
                };

                // Separate into qualifying extensions and "other"
                const results = [];
                let otherSizes = [];

                for (const entry of extMap.values()) {
                    if (entry.count >= minCount) {
                        const stats = calcStats(entry.sizes);
                        results.push({ ext: entry.ext, size: entry.size, count: entry.count, ...stats });
                    } else {
                        otherSizes.push(...entry.sizes);
                    }
                }

                // Add "other" if it has any files
                if (otherSizes.length > 0) {
                    const stats = calcStats(otherSizes);
                    const size = otherSizes.reduce((a, b) => a + b, 0);
                    results.push({ ext: 'other', size, count: otherSizes.length, ...stats });
                }

                // Sort by size descending
                return results.sort((a, b) => b.size - a.size);
            }
        };

        /**
         * TypesViewport - Pan/zoom state for types pie chart.
         */
        const TypesViewport = {
            zoom: 1,
            panX: 0,
            panY: 0,
            get minZoom() { return Config.ZOOM.MIN; },
            get maxZoom() { return Config.ZOOM.MAX; },

            defaults() {
                return { zoom: 1, panX: 0, panY: 0 };
            },

            apply(state) {
                this.zoom = state.zoom;
                this.panX = state.panX;
                this.panY = state.panY;
            },

            reset() {
                this.apply(this.defaults());
            }
        };

        /**
         * TypesRenderer - Canvas2D renderer for file types pie chart.
         * State: canvas, ctx, width, height, data, arcs, hoveredArc
         */
        const TypesRenderer = {
            canvas: null,
            ctx: null,
            width: 0,
            height: 0,
            data: [],          // [{ext, size, count, colorIdx}]
            arcs: [],          // [{ext, size, count, startAngle, endAngle, colorIdx}]
            hoveredArc: null,
            centerX: 0,
            centerY: 0,
            radius: 0,

            init(canvas) {
                this.canvas = canvas;
                this.ctx = canvas.getContext('2d');
            },

            setData(node, width, height) {
                // Available width for chart (excluding 300px table)
                const chartWidth = width - 300;
                this.width = chartWidth;
                this.height = height;

                // Size canvas
                const scale = Config.RENDER_SCALE;
                this.canvas.width = chartWidth * scale;
                this.canvas.height = height * scale;
                // CSS handles sizing via calc(100% - 300px)

                // Calculate center and radius
                this.centerX = chartWidth / 2;
                this.centerY = height / 2;
                this.radius = Math.min(this.centerX, this.centerY) * 0.8;

                // Aggregate data
                const rawData = TypesAnalysis.aggregateByExtension(node);
                const totalSize = rawData.reduce((sum, d) => sum + d.size, 0);
                this.totalSize = totalSize;

                // Calculate cumulative values from smallest to largest
                // Data is sorted by size DESC, so we accumulate from the end
                let cumSize = 0;
                let cumCount = 0;
                for (let i = rawData.length - 1; i >= 0; i--) {
                    cumSize += rawData[i].size;
                    cumCount += rawData[i].count;
                    rawData[i].cumSize = cumSize;
                    rawData[i].cumCount = cumCount;
                    rawData[i].cumPct = (cumSize / totalSize) * 100;
                    rawData[i].pct = (rawData[i].size / totalSize) * 100;
                }

                // Assign colors using same hash as treemap
                this.data = rawData.map((d, i) => ({
                    ...d,
                    colorIdx: Math.abs(ColorUtils.hash(d.ext)) % Config.COLORS.length
                }));

                // Calculate arcs
                const TAU = Math.PI * 2;
                let startAngle = -Math.PI / 2;  // Start at top

                this.arcs = this.data.map(d => {
                    const span = (d.size / totalSize) * TAU;
                    const arc = {
                        ...d,
                        startAngle,
                        endAngle: startAngle + span
                    };
                    startAngle += span;
                    return arc;
                });

                this.updateTable();
            },

            updateTable() {
                const table = document.getElementById('typesTable');

                let html = '<table><thead><tr><th>Extension</th><th>Count</th><th>Cum#</th><th>Size</th><th>CumSize</th><th>%</th><th>Cum%</th><th>Min</th><th>Max</th><th>Mean</th><th>Median</th><th>StdDev</th></tr></thead><tbody>';

                for (const d of this.data) {
                    const color = Config.COLORS[d.colorIdx];
                    html += `<tr data-ext="${d.ext}">
                        <td><span class="ext-color" style="background:${color}"></span>${d.ext}</td>
                        <td>${d.count.toLocaleString()}</td>
                        <td>${d.cumCount.toLocaleString()}</td>
                        <td>${Format.bytes(d.size)}</td>
                        <td>${Format.bytes(d.cumSize)}</td>
                        <td>${d.pct.toFixed(1)}%</td>
                        <td>${d.cumPct.toFixed(1)}%</td>
                        <td>${Format.bytes(d.min)}</td>
                        <td>${Format.bytes(d.max)}</td>
                        <td>${Format.bytes(d.mean)}</td>
                        <td>${Format.bytes(d.median)}</td>
                        <td>${Format.bytes(d.stdDev)}</td>
                    </tr>`;
                }

                html += '</tbody></table>';
                table.innerHTML = html;

                // Add hover handlers to table rows
                table.querySelectorAll('tr[data-ext]').forEach(row => {
                    row.addEventListener('mouseenter', () => {
                        const ext = row.dataset.ext;
                        this.hoveredArc = this.arcs.find(a => a.ext === ext);
                        this.render();
                    });
                    row.addEventListener('mouseleave', () => {
                        this.hoveredArc = null;
                        this.render();
                    });
                });
            },

            render() {
                if (!this.ctx || !this.arcs.length) return;

                const ctx = this.ctx;
                const scale = Config.RENDER_SCALE;
                const cx = this.centerX * scale;
                const cy = this.centerY * scale;
                const r = this.radius * scale;

                // Apply viewport transform
                ctx.setTransform(
                    TypesViewport.zoom, 0, 0, TypesViewport.zoom,
                    TypesViewport.panX * scale, TypesViewport.panY * scale
                );

                // Clear
                ctx.clearRect(-10000, -10000, 20000, 20000);

                // Draw arcs
                for (const arc of this.arcs) {
                    const [r255, g255, b255] = ColorUtils.parseHex(Config.COLORS[arc.colorIdx]);
                    const isHovered = arc === this.hoveredArc;

                    // Use gradient like sunburst
                    const midAngle = (arc.startAngle + arc.endAngle) / 2;
                    const gradX = cx + Math.cos(midAngle) * r * 0.5;
                    const gradY = cy + Math.sin(midAngle) * r * 0.5;

                    let fillR = r255, fillG = g255, fillB = b255;
                    if (isHovered) {
                        [fillR, fillG, fillB] = RenderStyle.highlightRGB(r255, g255, b255);
                    }

                    ctx.beginPath();
                    ctx.moveTo(cx, cy);
                    ctx.arc(cx, cy, r, arc.startAngle, arc.endAngle);
                    ctx.closePath();

                    // Gradient fill
                    const grad = RenderStyle.diagonalGradient(ctx,
                        cx - r, cy - r, r * 2, r * 2,
                        fillR, fillG, fillB
                    );
                    ctx.fillStyle = grad;
                    ctx.fill();

                    // Border - subtle like sunburst
                    ctx.strokeStyle = 'rgba(0, 0, 0, 0.3)';
                    ctx.lineWidth = 0.5 * scale / TypesViewport.zoom;  // Constant thickness
                    ctx.stroke();
                }

                // Draw labels for larger segments
                ctx.setTransform(1, 0, 0, 1, 0, 0);  // Reset transform for text
                RenderStyle.apply(ctx, RenderStyle.labelText(scale));

                for (const arc of this.arcs) {
                    const span = arc.endAngle - arc.startAngle;
                    if (span < 0.1) continue;  // Skip small segments

                    const midAngle = (arc.startAngle + arc.endAngle) / 2;
                    const labelR = this.radius * 0.65 * TypesViewport.zoom;
                    const tx = (this.centerX * TypesViewport.zoom + TypesViewport.panX) * scale;
                    const ty = (this.centerY * TypesViewport.zoom + TypesViewport.panY) * scale;
                    const lx = tx + Math.cos(midAngle) * labelR * scale;
                    const ly = ty + Math.sin(midAngle) * labelR * scale;

                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(arc.ext, lx, ly);
                }

                RenderStyle.clearShadow(ctx);
            },

            handleMouseMove(screenX, screenY) {
                // Transform to world coords
                const worldX = (screenX - TypesViewport.panX) / TypesViewport.zoom;
                const worldY = (screenY - TypesViewport.panY) / TypesViewport.zoom;

                // Check if in pie
                const dx = worldX - this.centerX;
                const dy = worldY - this.centerY;
                const dist = Math.sqrt(dx * dx + dy * dy);

                if (dist > this.radius) {
                    if (this.hoveredArc) {
                        this.hoveredArc = null;
                        this.render();
                    }
                    return null;
                }

                // Find arc by angle
                let angle = Math.atan2(dy, dx);
                // Normalize to [0, 2PI] from our start point
                if (angle < -Math.PI / 2) angle += Math.PI * 2;

                const hit = this.arcs.find(a => angle >= a.startAngle && angle < a.endAngle);
                if (hit !== this.hoveredArc) {
                    this.hoveredArc = hit;
                    this.render();
                }

                return hit ? hit : null;  // Return full arc data (ext, size, count, pct, cumPct, cumSize, cumCount)
            }
        };

        /**
         * SelectedDirectory - Shared state for directory selection across all views.
         * State: node, path, observers
         * Other views subscribe to changes and react accordingly.
         */
        const SelectedDirectory = {
            node: null,
            path: null,
            observers: [],
            source: null,  // Which view triggered the selection ('treemap', 'icicle', 'sunburst')

            /**
             * Set the selected directory. No-op for non-directories.
             * @param {Object} newNode - Directory node to select (must have children)
             * @param {string} source - Which view triggered this ('treemap', 'icicle', 'sunburst')
             * @returns {boolean} True if selection changed
             */
            set(newNode, source = null) {
                if (newNode && (!newNode.children || !newNode.children.length)) return false;
                const newPath = newNode?.path ?? null;
                if (this.path === newPath) return false;
                this.node = newNode;
                this.path = newPath;
                this.source = source;
                this.observers.forEach(fn => fn(newNode, source));
                return true;
            },

            subscribe(fn) { this.observers.push(fn); },
            clear() { this.set(null, null); },
            get() { return this.node; }
        };

        /**
         * ViewState - Manages view switching between treemap, sunburst, and icicle.
         * State: current view, UI bindings
         */
        const ViewState = {
            current: 'treemap',

            /** Initialize view state and wire up toggle buttons */
            init() {
                const buttons = document.querySelectorAll('.view-btn');
                buttons.forEach(btn => {
                    btn.addEventListener('click', () => {
                        const view = btn.dataset.view;
                        if (view !== this.current) {
                            this.setView(view);
                        }
                    });
                });
            },

            /** Switch to a different view */
            setView(view) {
                this.current = view;

                // Update button states
                document.querySelectorAll('.view-btn').forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.view === view);
                });

                // Toggle canvas visibility
                const treemapCanvas = document.getElementById('canvas');
                const textOverlay = document.getElementById('textOverlay');
                const sunburstCanvas = document.getElementById('sunburstCanvas');
                const icicleCanvas = document.getElementById('icicleCanvas');
                const typesContainer = document.getElementById('typesContainer');

                treemapCanvas.style.display = 'none';
                textOverlay.style.display = 'none';
                sunburstCanvas.style.display = 'none';
                icicleCanvas.style.display = 'none';
                typesContainer.style.display = 'none';

                const container = document.getElementById('container');

                if (view === 'treemap') {
                    treemapCanvas.style.display = 'block';
                    textOverlay.style.display = 'block';
                    if (currentNode) renderTreemap(currentNode);
                } else if (view === 'sunburst') {
                    sunburstCanvas.style.display = 'block';
                    if (currentNode) {
                        if (!SunburstRenderer.canvas) {
                            SunburstRenderer.init(sunburstCanvas);
                        }
                        SunburstRenderer.setRoot(currentNode, container.clientWidth, container.clientHeight);
                        SunburstRenderer.render();
                    }
                } else if (view === 'icicle') {
                    icicleCanvas.style.display = 'block';
                    if (currentNode) {
                        if (!IcicleRenderer.canvas) {
                            IcicleRenderer.init(icicleCanvas);
                        }
                        IcicleRenderer.setRoot(currentNode, container.clientWidth, container.clientHeight);
                        IcicleRenderer.render();
                    }
                } else if (view === 'types') {
                    typesContainer.style.display = 'block';
                    const typesCanvas = document.getElementById('typesCanvas');
                    typesCanvas.style.display = 'block';
                    if (currentNode) {
                        if (!TypesRenderer.canvas) {
                            TypesRenderer.init(typesCanvas);
                        }
                        TypesRenderer.setData(currentNode, container.clientWidth, container.clientHeight);
                        TypesRenderer.render();
                    }
                }
            },

            /** Re-render current view (e.g., after resize) */
            renderCurrent() {
                const container = document.getElementById('container');
                if (this.current === 'treemap') {
                    if (currentNode) renderTreemap(currentNode);
                } else if (this.current === 'sunburst') {
                    if (currentNode && SunburstRenderer.canvas) {
                        SunburstRenderer.calculateLayout(container.clientWidth, container.clientHeight);
                        SunburstRenderer.render();
                    }
                } else if (this.current === 'icicle') {
                    if (currentNode && IcicleRenderer.canvas) {
                        IcicleRenderer.calculateLayout(container.clientWidth, container.clientHeight);
                        IcicleRenderer.render();
                    }
                } else if (this.current === 'types') {
                    if (currentNode && TypesRenderer.canvas) {
                        TypesRenderer.setData(currentNode, container.clientWidth, container.clientHeight);
                        TypesRenderer.render();
                    }
                }
            }
        };

        // Initialize ViewState
        ViewState.init();

        // Subscribe to SelectedDirectory changes for cross-view sync
        SelectedDirectory.subscribe((node, source) => {
            if (!node) return;

            // When treemap drag-select triggers, sync other views
            if (source === 'treemap') {
                // Icicle: animate zoom-to-fit the selected directory
                if (IcicleRenderer.rects) {
                    const rect = IcicleRenderer.findRectByPath(node.path);
                    if (rect) {
                        IcicleRenderer.animateZoomToFit(rect);
                    }
                }

                // Sunburst: drill to selected directory (if different from current)
                if (SunburstRenderer.displayNode && SunburstRenderer.displayNode.path !== node.path) {
                    // Find the arc for this node and drill to it
                    const arc = SunburstRenderer.arcs?.find(a => a.node.path === node.path);
                    if (arc && node.children?.length > 0) {
                        SunburstRenderer.drillDown(node, arc);
                    }
                }
            }
        });

        // Track last mouse position for hover updates during pan/zoom
        let lastMouseX = 0, lastMouseY = 0, lastClientX = 0, lastClientY = 0;
        let mouseOverCanvas = false;

        function updateTreemapTooltip() {
            if (!mouseOverCanvas || ViewState.current !== 'treemap') return;
            const world = Viewport.screenToWorld(lastMouseX, lastMouseY, Viewport.zoom, Viewport.panX, Viewport.panY);
            const hit = currentNode ? TreeTraversal.hitTest(currentNode, world.x, world.y) : null;
            const tooltip = document.getElementById('tooltip');
            if (hit) {
                tooltip.innerHTML = `<strong>${hit.name}</strong><br>${Format.bytes(hit.size)}<br><small>${hit.path}</small>`;
                tooltip.style.display = 'block';
                tooltip.style.left = (lastClientX + 15) + 'px';
                tooltip.style.top = (lastClientY + 15) + 'px';
            } else {
                tooltip.style.display = 'none';
            }
        }

        // Hit-testing for tooltip
        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            lastMouseX = e.clientX - rect.left;
            lastMouseY = e.clientY - rect.top;
            lastClientX = e.clientX;
            lastClientY = e.clientY;
            mouseOverCanvas = true;
            updateTreemapTooltip();
        });

        canvas.addEventListener('mouseenter', () => { mouseOverCanvas = true; });
        canvas.addEventListener('mouseleave', () => {
            mouseOverCanvas = false;
            document.getElementById('tooltip').style.display = 'none';
        });

        // Treemap drag selection state
        const treemapDrag = {
            active: false,
            startX: 0,
            startY: 0,
            startNode: null,     // The file/directory initially clicked
            currentAncestor: null  // Current ancestor being highlighted
        };

        /**
         * Render drag selection feedback on textOverlay.
         * Shows: thin outlines on ALL ancestors, thick outline on current, dashed line, path label.
         * All coordinates must account for: Viewport zoom/pan + full render scale (including DPI)
         */
        function renderDragSelection(curScreenX, curScreenY) {
            // Re-render treemap with labels first (clears and redraws text overlay)
            renderFast();

            if (!treemapDrag.startNode) return;

            const textOverlay = document.getElementById('textOverlay');
            const ctx = textOverlay.getContext('2d');
            // Use full render scale including devicePixelRatio
            const scale = Format.renderScale();
            const { zoom, panX, panY } = Viewport;

            // Get all ancestors from root to the start node
            const ancestors = TreeTraversal.findAncestors(currentNode, treemapDrag.startNode);

            // Draw thin outlines on ALL ancestors (so user can see boundaries)
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
            ctx.lineWidth = 1 * scale;
            for (const ancestor of ancestors) {
                if (!ancestor.bounds) continue;
                const b = ancestor.bounds;
                const sx = (b.x * zoom + panX) * scale;
                const sy = (b.y * zoom + panY) * scale;
                const sw = b.width * zoom * scale;
                const sh = b.height * zoom * scale;
                ctx.strokeRect(sx, sy, sw, sh);
            }

            // Draw thicker highlight on current ancestor selection
            if (treemapDrag.currentAncestor?.bounds) {
                const b = treemapDrag.currentAncestor.bounds;
                const boxCanvasX = (b.x * zoom + panX) * scale;
                const boxCanvasY = (b.y * zoom + panY) * scale;
                const boxCanvasW = b.width * zoom * scale;
                const boxCanvasH = b.height * zoom * scale;

                ctx.strokeStyle = Config.SELECTION.HIGHLIGHT_OUTLINE_COLOR;
                ctx.lineWidth = Config.SELECTION.HIGHLIGHT_OUTLINE_WIDTH * scale;
                ctx.strokeRect(boxCanvasX, boxCanvasY, boxCanvasW, boxCanvasH);

                // Draw path label above the selection box
                const path = treemapDrag.currentAncestor.path || treemapDrag.currentAncestor.name;
                const fontSize = 12 * scale;
                const labelPadding = 4 * scale;
                const labelHeight = fontSize + labelPadding * 2;
                const labelY = boxCanvasY - labelPadding;

                ctx.font = `bold ${fontSize}px -apple-system, BlinkMacSystemFont, sans-serif`;
                ctx.textAlign = 'left';
                ctx.textBaseline = 'bottom';

                // Background pill for readability
                const textWidth = ctx.measureText(path).width;
                ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
                const bgX = boxCanvasX - labelPadding;
                const bgY = labelY - fontSize - labelPadding;
                const bgW = textWidth + labelPadding * 2;
                const bgH = labelHeight;
                ctx.beginPath();
                ctx.roundRect(bgX, bgY, bgW, bgH, 4 * scale);
                ctx.fill();

                // Text
                ctx.fillStyle = '#fff';
                ctx.fillText(path, boxCanvasX, labelY);
            }

            // Draw dashed line from drag start to current mouse position
            ctx.setLineDash(Config.SELECTION.DRAG_LINE_DASH.map(v => v * scale));
            ctx.strokeStyle = Config.SELECTION.DRAG_LINE_COLOR;
            ctx.lineWidth = Config.SELECTION.DRAG_LINE_WIDTH * scale;
            ctx.beginPath();
            ctx.moveTo(treemapDrag.startX * scale, treemapDrag.startY * scale);
            ctx.lineTo(curScreenX * scale, curScreenY * scale);
            ctx.stroke();
            ctx.setLineDash([]);
        }

        canvas.addEventListener('mousedown', (e) => {
            const rect = canvas.getBoundingClientRect();
            const screenX = e.clientX - rect.left;
            const screenY = e.clientY - rect.top;
            const world = Viewport.screenToWorld(screenX, screenY, Viewport.zoom, Viewport.panX, Viewport.panY);

            if (!currentNode) return;
            const hit = TreeTraversal.hitTest(currentNode, world.x, world.y);
            if (!hit) return;

            // Start drag
            treemapDrag.active = true;
            treemapDrag.startX = screenX;
            treemapDrag.startY = screenY;
            treemapDrag.startNode = hit;
            treemapDrag.currentAncestor = null;
        });

        // Track drag movement (extends existing mousemove)
        canvas.addEventListener('mousemove', (e) => {
            if (!treemapDrag.active || !currentNode) return;

            const rect = canvas.getBoundingClientRect();
            const curX = e.clientX - rect.left;
            const curY = e.clientY - rect.top;

            // Calculate drag distance and ancestor level
            const dx = curX - treemapDrag.startX;
            const dy = curY - treemapDrag.startY;
            const dist = Math.sqrt(dx * dx + dy * dy);
            const levelsUp = Math.floor(dist / Config.SELECTION.PIXELS_PER_ANCESTOR_LEVEL);

            // Get ancestor at that level
            const ancestor = TreeTraversal.getAncestor(currentNode, treemapDrag.startNode, levelsUp);

            // Only update if ancestor changed
            if (ancestor && ancestor !== treemapDrag.currentAncestor) {
                treemapDrag.currentAncestor = ancestor;
            }

            // Render visual feedback
            if (treemapDrag.currentAncestor) {
                renderDragSelection(curX, curY);
            }
        });

        canvas.addEventListener('mouseup', () => {
            if (treemapDrag.active && treemapDrag.currentAncestor) {
                // Set selected directory
                SelectedDirectory.set(treemapDrag.currentAncestor, 'treemap');
            }

            // Clear drag state
            treemapDrag.active = false;
            treemapDrag.startNode = null;
            treemapDrag.currentAncestor = null;

            // Clear overlay
            const textOverlay = document.getElementById('textOverlay');
            const ctx = textOverlay.getContext('2d');
            ctx.clearRect(0, 0, textOverlay.width, textOverlay.height);

            // Re-render to restore labels
            if (currentNode) renderFast();
        });

        // Sunburst canvas event handlers
        const sunburstCanvas = document.getElementById('sunburstCanvas');

        sunburstCanvas.addEventListener('mousemove', (e) => {
            const rect = sunburstCanvas.getBoundingClientRect();
            const screenX = e.clientX - rect.left;
            const screenY = e.clientY - rect.top;

            // Transform screen to world coords (same as treemap)
            const world = Viewport.screenToWorld(
                screenX, screenY,
                SunburstViewport.zoom, SunburstViewport.panX, SunburstViewport.panY
            );

            const result = SunburstRenderer.handleMouseMove(world.x, world.y);
            const tooltip = document.getElementById('tooltip');

            if (result && result.node) {
                const node = result.node;
                tooltip.innerHTML = `<strong>${node.name}</strong><br>${Format.bytes(node.size)}<br><small>${node.path}</small>`;
                tooltip.style.display = 'block';
                tooltip.style.left = (e.clientX + 15) + 'px';
                tooltip.style.top = (e.clientY + 15) + 'px';
            } else {
                tooltip.style.display = 'none';
            }
        });

        sunburstCanvas.addEventListener('mouseleave', () => {
            document.getElementById('tooltip').style.display = 'none';
            if (SunburstRenderer.hoveredArc) {
                SunburstRenderer.hoveredArc = null;
                SunburstRenderer.render();
            }
        });

        sunburstCanvas.addEventListener('click', (e) => {
            const rect = sunburstCanvas.getBoundingClientRect();
            const screenX = e.clientX - rect.left;
            const screenY = e.clientY - rect.top;

            // Transform screen to world coords (same as treemap)
            const world = Viewport.screenToWorld(
                screenX, screenY,
                SunburstViewport.zoom, SunburstViewport.panX, SunburstViewport.panY
            );

            SunburstRenderer.handleClick(world.x, world.y);
        });

        // Sunburst touch handlers - pinch zoom (same as treemap)
        let sunburstTouchState = { active: false };

        sunburstCanvas.addEventListener('touchstart', (e) => {
            if (e.touches.length >= 2) {
                e.preventDefault();
                const rect = sunburstCanvas.getBoundingClientRect();
                sunburstTouchState = TouchMath.createPinchState(
                    e.touches[0], e.touches[1], rect, SunburstViewport
                );
            }
        }, { passive: false });

        sunburstCanvas.addEventListener('touchmove', (e) => {
            if (!sunburstTouchState.active || e.touches.length < 2) return;
            e.preventDefault();

            const rect = sunburstCanvas.getBoundingClientRect();
            const dist = TouchMath.distance(e.touches[0], e.touches[1]);
            const mid = TouchMath.midpoint(e.touches[0], e.touches[1], rect);
            SunburstViewport.apply(ZoomMath.calcPinchZoom(
                sunburstTouchState, dist, mid,
                SunburstViewport.minZoom, SunburstViewport.maxZoom
            ));
            SunburstRenderer.render();
        }, { passive: false });

        sunburstCanvas.addEventListener('touchend', (e) => {
            if (sunburstTouchState.active && e.touches.length < 2) {
                sunburstTouchState.active = false;
            }
        });

        // Icicle canvas event handlers
        const icicleCanvas = document.getElementById('icicleCanvas');

        icicleCanvas.addEventListener('mousemove', (e) => {
            const rect = icicleCanvas.getBoundingClientRect();
            const screenX = e.clientX - rect.left;
            const screenY = e.clientY - rect.top;

            // Transform to world coords
            const worldX = IcicleViewport.screenToWorldX(screenX);
            const worldY = screenY - IcicleViewport.panY;

            const result = IcicleRenderer.handleMouseMove(worldX, worldY);
            const tooltip = document.getElementById('tooltip');

            if (result && result.node) {
                const node = result.node;
                tooltip.innerHTML = `<strong>${node.name}</strong><br>${Format.bytes(node.size)}<br><small>${node.path}</small>`;
                tooltip.style.display = 'block';
                tooltip.style.left = (e.clientX + 15) + 'px';
                tooltip.style.top = (e.clientY + 15) + 'px';
            } else {
                tooltip.style.display = 'none';
            }
        });

        icicleCanvas.addEventListener('mouseleave', () => {
            document.getElementById('tooltip').style.display = 'none';
            if (IcicleRenderer.hoveredRect) {
                IcicleRenderer.hoveredRect = null;
                IcicleRenderer.render();
            }
        });

        icicleCanvas.addEventListener('click', (e) => {
            const rect = icicleCanvas.getBoundingClientRect();
            const screenX = e.clientX - rect.left;
            const screenY = e.clientY - rect.top;
            const worldX = IcicleViewport.screenToWorldX(screenX);
            const worldY = screenY - IcicleViewport.panY;
            IcicleRenderer.handleClick(worldX, worldY);
        });

        // Icicle wheel handler - horizontal zoom, pan in all directions
        // Throttled with RAF to prevent overwhelming the renderer
        let icicleRenderPending = false;
        icicleCanvas.addEventListener('wheel', (e) => {
            e.preventDefault();
            const rect = icicleCanvas.getBoundingClientRect();
            const screenX = e.clientX - rect.left;

            if (e.ctrlKey) {
                // Pinch-to-zoom: exponential zoom (stable at any level)
                const newZoom = IcicleViewport.zoom * ZoomMath.expZoomFactor(e.deltaY);
                IcicleViewport.apply(IcicleViewport.zoomTowardsX(screenX, newZoom));
            } else {
                // Pan in both directions (guard against NaN)
                if (Number.isFinite(e.deltaX)) IcicleViewport.panX -= e.deltaX;
                if (Number.isFinite(e.deltaY)) IcicleViewport.panY -= e.deltaY;
            }

            if (!icicleRenderPending) {
                icicleRenderPending = true;
                requestAnimationFrame(() => {
                    IcicleRenderer.render();
                    icicleRenderPending = false;
                });
            }
        }, { passive: false });

        // Types canvas event handlers
        const typesCanvas = document.getElementById('typesCanvas');

        typesCanvas.addEventListener('mousemove', (e) => {
            const rect = typesCanvas.getBoundingClientRect();
            const screenX = e.clientX - rect.left;
            const screenY = e.clientY - rect.top;

            const result = TypesRenderer.handleMouseMove(screenX, screenY);
            const tooltip = document.getElementById('tooltip');

            if (result) {
                tooltip.innerHTML = `<strong>.${result.ext}</strong><br>` +
                    `${result.count.toLocaleString()} files | ${Format.bytes(result.size)}<br>` +
                    `${result.pct.toFixed(1)}% (cum: ${result.cumPct.toFixed(1)}%)<br>` +
                    `<small>min: ${Format.bytes(result.min)} | max: ${Format.bytes(result.max)}<br>` +
                    `mean: ${Format.bytes(result.mean)} | median: ${Format.bytes(result.median)}<br>` +
                    `stdDev: ${Format.bytes(result.stdDev)}</small>`;
                tooltip.style.display = 'block';
                tooltip.style.left = (e.clientX + 15) + 'px';
                tooltip.style.top = (e.clientY + 15) + 'px';
            } else {
                tooltip.style.display = 'none';
            }
        });

        typesCanvas.addEventListener('mouseleave', () => {
            document.getElementById('tooltip').style.display = 'none';
            if (TypesRenderer.hoveredArc) {
                TypesRenderer.hoveredArc = null;
                TypesRenderer.render();
            }
        });

        /**
         * TouchMath - Pure functions for touch gesture calculations.
         * @pure All methods are pure functions.
         */
        const TouchMath = {
            /**
             * @pure Distance between two touch points.
             * @example TouchMath.distance({clientX:0,clientY:0}, {clientX:3,clientY:4}) // => 5
             */
            distance(t1, t2) {
                const dx = t2.clientX - t1.clientX;
                const dy = t2.clientY - t1.clientY;
                return Math.sqrt(dx * dx + dy * dy);
            },

            /**
             * @pure Midpoint between two touches, relative to a rect.
             * @example TouchMath.midpoint(t1, t2, {left:0,top:0}) // => {x, y}
             */
            midpoint(t1, t2, rect) {
                return {
                    x: (t1.clientX + t2.clientX) / 2 - rect.left,
                    y: (t1.clientY + t2.clientY) / 2 - rect.top
                };
            },

            /**
             * @pure Create initial touch state for pinch gesture.
             */
            createPinchState(t1, t2, rect, viewport) {
                const mid = this.midpoint(t1, t2, rect);
                return {
                    active: true,
                    initialZoom: viewport.zoom,
                    initialPanX: viewport.panX,
                    initialPanY: viewport.panY,
                    initialDist: this.distance(t1, t2),
                    initialMidX: mid.x,
                    initialMidY: mid.y
                };
            }
        };

        /**
         * ZoomMath - Pure functions for zoom/pan calculations.
         * @pure All methods are pure functions.
         */
        const ZoomMath = {
            /**
             * @pure Clamp zoom to valid range.
             * @example ZoomMath.clampZoom(0.5, 1, 20) // => 1
             */
            clampZoom(zoom, min, max) {
                return Math.max(min, Math.min(max, zoom));
            },

            /**
             * @pure Calculate exponential zoom factor from wheel delta.
             * Stable at any zoom level, never produces negative/zero values.
             * @param {number} deltaY - Wheel deltaY
             * @param {number} sensitivity - Zoom speed (default 0.005)
             * @returns {number} Multiplier to apply to current zoom
             * @example ZoomMath.expZoomFactor(100) // => ~0.61 (zoom out)
             * @example ZoomMath.expZoomFactor(-100) // => ~1.65 (zoom in)
             */
            expZoomFactor(deltaY, sensitivity = 0.01) {
                return Math.pow(2, -deltaY * sensitivity);
            },

            /**
             * @pure Calculate new viewport state for pinch zoom.
             * Returns {zoom, panX, panY} without mutating anything.
             */
            calcPinchZoom(touchState, currentDist, currentMid, minZoom, maxZoom) {
                const zoomDelta = currentDist / touchState.initialDist;
                const newZoom = this.clampZoom(touchState.initialZoom * zoomDelta, minZoom, maxZoom);
                const world = Viewport.screenToWorld(
                    touchState.initialMidX, touchState.initialMidY,
                    touchState.initialZoom, touchState.initialPanX, touchState.initialPanY
                );
                return {
                    zoom: newZoom,
                    panX: currentMid.x - world.x * newZoom,
                    panY: currentMid.y - world.y * newZoom
                };
            },

            /**
