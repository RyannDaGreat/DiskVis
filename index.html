<!--
MANDATORY STANDARDS - All contributors must follow these rules.

1. CSS: Inheritance over duplication - Never rewrite styles, compose classes instead
2. JS: Pure functions - No side effects, marked with @pure, with docstrings and examples
3. No silent failures - Errors must fail loudly, never swallow exceptions
4. Config in one place - All constants consolidated, not scattered
5. Composition over inheritance - Build from small reusable pieces
6. Simplicity - Minimal structure now, expand as needed, no over-engineering
7. Performance with UX - 120fps target, time-based yielding not hardcoded batches
8. Same pathway, less code - Reuse code paths with configuration, not duplication
9. Group pure functions into labeled objects - Related pure functions belong together
   in a named object (e.g., Geometry, TouchMath). Event handlers should be thin,
   delegating logic to pure functions. Mark objects containing only pure functions.
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Disk Space Treemap</title>
    <style>
        /*
         * CSS INHERITANCE IS STRONGLY PREFERRED.
         * Never rewrite the same style twice - compose classes instead.
         * If you need a variant, extend with a modifier class, don't duplicate.
         */
        :root {
            --bg: #1a1a2e;
            --glass-bg: rgba(30, 30, 50, 0.75);
            --glass-border: rgba(255, 255, 255, 0.1);
            --glass-subtle: rgba(255, 255, 255, 0.08);
            --accent: #6c9bcf;
            --accent-bg: rgba(108, 155, 207, 0.4);
            --accent-glow: rgba(108, 155, 207, 0.5);
            --success: #45D2B0;
            --success-bg: rgba(69, 210, 176, 0.4);
            --success-glow: rgba(69, 210, 176, 0.5);
            --text: #eee;
            --text-dim: #888;
            --text-dimmer: #555;
            --text-small: 11px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            overflow: hidden;
        }

        /* Glassmorphism base */
        .glass {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
        }
        .glass-panel {
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        /* Layout */
        #header {
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }
        #header h1 { font-size: 18px; font-weight: 500; }
        #stats { font-size: 13px; color: var(--text-dim); }

        #container {
            width: 100vw;
            height: calc(100vh - 50px);
            position: relative;
        }
        #canvas { display: block; cursor: pointer; transform-origin: 0 0; }
        #textOverlay {
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
        }

        /* Tooltip */
        #tooltip {
            position: fixed;
            padding: 8px 12px;
            font-size: 12px;
            pointer-events: none;
            z-index: 1000;
            display: none;
            max-width: 500px;
            word-wrap: break-word;
        }

        /* Loading panel */
        #loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 14px;
            padding: 30px 40px;
            cursor: pointer;
            width: 450px;
            transition: opacity 0.4s ease, filter 0.4s ease, transform 0.4s ease;
        }
        #loading.hidden {
            opacity: 0;
            filter: blur(8px);
            transform: translate(-50%, -50%) scale(0.95);
            pointer-events: none;
        }
        #loading:hover { border-color: var(--accent); }
        #loading.processing { cursor: default; }

        #loading #fileInput {
            position: absolute;
            inset: 0;
            opacity: 0;
            cursor: pointer;
        }
        #loading .drop-text { text-align: center; font-size: 16px; }
        #loading .progress-section { display: none; }
        #loading.processing .drop-text { display: none; }
        #loading.processing .progress-section { display: block; }

        /* Stage bubbles */
        .stages { display: flex; justify-content: center; gap: 40px; margin-bottom: 20px; }
        .stage { display: flex; flex-direction: column; align-items: center; gap: 6px; }
        .stage-bubble {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--glass-subtle);
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255,255,255,0.25);
            font-size: 18px;
            transition: all 0.3s ease;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
        }
        .stage.active .stage-bubble {
            background: var(--accent-bg);
            color: var(--accent);
            box-shadow: 0 0 12px var(--accent-glow), 0 0 24px var(--accent-glow), inset 0 1px 2px var(--glass-border);
        }
        .stage.done .stage-bubble {
            background: var(--success-bg);
            color: var(--success);
            box-shadow: 0 0 12px var(--success-glow), 0 0 24px var(--success-glow), inset 0 1px 2px var(--glass-border);
        }
        .stage-label { font-size: 10px; color: var(--text-dimmer); transition: color 0.3s ease; }
        .stage.active .stage-label { color: var(--accent); }
        .stage.done .stage-label { color: var(--success); }

        /* Progress bar */
        .progress-bar {
            height: 6px;
            background: var(--glass-border);
            border-radius: 3px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: var(--accent);
            border-radius: 3px;
        }
        .progress-info {
            display: flex;
            justify-content: space-between;
            margin-top: 8px;
            font-size: var(--text-small);
            color: var(--text-dim);
        }
        .progress-info-line {
            font-size: var(--text-small);
            color: var(--text-dimmer);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 12px;
            height: 14px;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/fzstd@0.1.1/umd/index.min.js"></script>
    <script src="https://code.iconify.design/3/3.1.0/iconify.min.js"></script>
</head>
<body>
    <div id="header" class="glass">
        <h1>Disk Space Visualization</h1>
        <div id="stats"></div>
    </div>
    <div id="container">
        <canvas id="canvas"></canvas>
        <canvas id="textOverlay"></canvas>
    </div>
    <div id="tooltip" class="glass glass-panel"></div>
    <div id="loading" class="glass glass-panel">
        <div class="drop-text">Drop .json.zst file here</div>
        <div class="progress-section">
            <div class="stages" id="stagesContainer"></div>
            <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
            <div class="progress-info">
                <span id="progressLabel">Loading...</span>
                <span id="progressPct">0%</span>
            </div>
            <div class="progress-info-line" id="progressInfoLine"></div>
        </div>
        <input type="file" id="fileInput" accept=".zst">
    </div>

    <script>
        /* ============================================================
         * SECTION: Pure Math Functions
         * All pure functions - no side effects, testable in isolation.
         * Objects: Viewport, ZoomMath, TouchMath, ColorUtils, Format,
         *          TreeTraversal, TreeUtils, Progress
         * ============================================================ */

        /**
         * Viewport - Pan/zoom state with pure transform methods.
         * State: zoom, panX, panY, minZoom, maxZoom
         * Pure methods: screenToWorld, worldToScreen, isRectVisible
         */
        const Viewport = {
            zoom: 1,
            panX: 0,
            panY: 0,
            minZoom: 1,
            maxZoom: 100,

            /** @pure Default viewport state */
            defaults() {
                return { zoom: 1, panX: 0, panY: 0 };
            },

            /** Apply state from object */
            apply(state) {
                this.zoom = state.zoom;
                this.panX = state.panX;
                this.panY = state.panY;
            },

            /**
             * @pure
             * Transform screen coordinates to world coordinates.
             * @param {number} screenX
             * @param {number} screenY
             * @param {number} zoom
             * @param {number} panX
             * @param {number} panY
             * @returns {{x: number, y: number}}
             */
            screenToWorld(screenX, screenY, zoom, panX, panY) {
                return {
                    x: (screenX - panX) / zoom,
                    y: (screenY - panY) / zoom
                };
            },

            /**
             * @pure
             * Transform world coordinates to screen coordinates.
             * @param {number} worldX
             * @param {number} worldY
             * @param {number} zoom
             * @param {number} panX
             * @param {number} panY
             * @returns {{x: number, y: number}}
             */
            worldToScreen(worldX, worldY, zoom, panX, panY) {
                return {
                    x: worldX * zoom + panX,
                    y: worldY * zoom + panY
                };
            },

            /**
             * @pure
             * Check if a rect is visible in the viewport.
             * @param {Object} rect - {x, y, w, h} in world coords
             * @param {number} viewWidth - Viewport width
             * @param {number} viewHeight - Viewport height
             * @param {number} zoom
             * @param {number} panX
             * @param {number} panY
             * @returns {boolean}
             */
            isRectVisible(rect, viewWidth, viewHeight, zoom, panX, panY) {
                const screenX = rect.x * zoom + panX;
                const screenY = rect.y * zoom + panY;
                const screenW = rect.w * zoom;
                const screenH = rect.h * zoom;
                return screenX + screenW > 0 && screenX < viewWidth &&
                       screenY + screenH > 0 && screenY < viewHeight;
            }
        };

        /* ============================================================
         * SECTION: Config
         * All constants in one place. No logic, just values.
         * ============================================================ */

        const Config = {
            /** Target frames per second for progress updates */
            TARGET_FPS: 120,

            /** Only show progress bar if operation takes longer than this (ms) */
            PROGRESS_DELAY_MS: 333,

            /** Internal render scale (2 = render at 2x, display at 1x for more detail) */
            RENDER_SCALE: 2,

            /** Minimum dimensions for text label */
            LABEL_MIN_WIDTH: 40,
            LABEL_MIN_HEIGHT: 16,

            /** Label positioning */
            LABEL_PADDING_X: 4,
            LABEL_PADDING_Y: 12,

            /** GrandPerspective "Rainbow" palette (exact colors from source) */
            COLORS: [
                '#FFFF54', '#C8E64C', '#8CD466', '#4DC742',
                '#45D2B0', '#46ACD3', '#438CCB', '#4262C7',
                '#5240C3', '#8C3FC0', '#D145C1', '#E64C8D',
                '#FF5454', '#FF8054', '#FFA054', '#FFB554'
            ],

            /** Directory names/extensions treated as opaque units */
            OPAQUE_DIRECTORIES: [
                // macOS packages
                '.app', '.bundle', '.framework', '.plugin', '.kext',
                '.prefPane', '.qlgenerator', '.saver', '.xpc',
                '.playground', '.xcodeproj', '.xcworkspace',
                '.photoslibrary', '.musiclibrary', '.tvlibrary',
                // Version control
                '.git', '.svn', '.hg',
                // Node/JS
                'node_modules', 'bower_components', '.next', '.nuxt',
                // Python
                '__pycache__', '.venv', 'venv', '.tox', '.eggs', '.pytest_cache', '.mypy_cache', '.ruff_cache',
                // IDEs
                '.idea', '.vscode'
            ]
        };

        // Pre-parse colors to RGB for faster drawing
        const colorsRGB = Config.COLORS.map(hex => {
            const num = parseInt(hex.slice(1), 16);
            return [(num >> 16), ((num >> 8) & 0xFF), (num & 0xFF)];
        });

        /**
         * Format - Pure formatting utility functions.
         * @pure All methods are pure functions.
         */
        const Format = {
            /**
             * @pure Format bytes as human-readable string.
             * @example Format.bytes(0) // => '0 B'
             * @example Format.bytes(1024) // => '1 KB'
             * @example Format.bytes(1073741824) // => '1 GB'
             */
            bytes(bytes) {
                if (bytes === 0) return '0 B';
                const k = 1024;
                const sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
                const i = Math.floor(Math.log(bytes) / Math.log(k));
                return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
            },

            /**
             * @pure Get the total render scale.
             * @example Format.renderScale() // => 4 (on 2x retina with RENDER_SCALE=2)
             */
            renderScale() {
                return Config.RENDER_SCALE * (window.devicePixelRatio || 1);
            },

            /** Size a canvas for HiDPI: buffer at scale, CSS at 1x */
            sizeCanvas(canvas, cssW, cssH, scale) {
                canvas.width = cssW * scale;
                canvas.height = cssH * scale;
                canvas.style.width = cssW + 'px';
                canvas.style.height = cssH + 'px';
            },

            /**
             * @pure Truncate filename in the middle, preserving extension.
             * @param {string} name - Filename to truncate
             * @param {function} measureFn - Function that returns width of text
             * @param {number} maxWidth - Maximum allowed width
             * @returns {string} Truncated filename with '…' in middle
             * @example Format.middleTruncate('longfile.txt', fn, 50) // => 'lon…e.txt'
             */
            middleTruncate(name, measureFn, maxWidth) {
                if (measureFn(name) <= maxWidth) return name;

                // Find extension (last dot, but not at start)
                const dotIdx = name.lastIndexOf('.');
                const hasExt = dotIdx > 0;
                const ext = hasExt ? name.slice(dotIdx) : '';
                const base = hasExt ? name.slice(0, dotIdx) : name;

                // Binary search for how many chars we can keep
                let lo = 1, hi = base.length - 1;
                while (lo < hi) {
                    const mid = Math.ceil((lo + hi) / 2);
                    const half = Math.floor(mid / 2);
                    const candidate = base.slice(0, half) + '…' + base.slice(-(mid - half)) + ext;
                    if (measureFn(candidate) <= maxWidth) {
                        lo = mid;
                    } else {
                        hi = mid - 1;
                    }
                }

                if (lo < 2) return base[0] + '…' + ext;
                const half = Math.floor(lo / 2);
                return base.slice(0, half) + '…' + base.slice(-(lo - half)) + ext;
            }
        };

        /**
         * @pure
         * Check if a directory name matches an opaque pattern.
         * Matches exact names (node_modules, .git) or extensions (.app, .framework).
         * @param {string} name - Directory name
         * @returns {boolean}
         * @example isOpaqueDirectory('node_modules') // => true
         * @example isOpaqueDirectory('MyApp.app') // => true
         * @example isOpaqueDirectory('.git') // => true
         * @example isOpaqueDirectory('src') // => false
         */
        function isOpaqueDirectory(name) {
            return Config.OPAQUE_DIRECTORIES.some(pattern =>
                name === pattern || name.endsWith(pattern)
            );
        }


        /* ============================================================
         * SECTION: Layout Algorithm
         * Tree building and squarify treemap layout.
         * Pure algorithms that produce rect data from tree structure.
         * ============================================================ */

        async function buildTree(files, rootPath, onProgress) {
            const root = { name: rootPath, path: rootPath, size: 0, children: {} };
            const total = files.length;

            for (let i = 0; i < files.length; i++) {
                const { size, path } = files[i];
                const relativePath = path.startsWith(rootPath)
                    ? path.slice(rootPath.length).replace(/^\//, '')
                    : path;

                const parts = relativePath.split('/').filter(p => p);
                let current = root;
                let opaqueDepth = -1;  // Track where we hit an opaque directory

                // Find first opaque directory in path
                for (let j = 0; j < parts.length; j++) {
                    if (isOpaqueDirectory(parts[j])) {
                        opaqueDepth = j;
                        break;
                    }
                }

                // Build tree only up to opaque directory (or full path if none)
                const buildDepth = opaqueDepth >= 0 ? opaqueDepth + 1 : parts.length;

                for (let j = 0; j < buildDepth; j++) {
                    const part = parts[j];
                    const isLeaf = j === parts.length - 1 || j === opaqueDepth;

                    if (!current.children[part]) {
                        current.children[part] = {
                            name: part,
                            path: rootPath + '/' + parts.slice(0, j + 1).join('/'),
                            size: 0,
                            children: isLeaf ? null : {}
                        };
                    }

                    // If this is an opaque dir, ensure it stays a leaf
                    if (j === opaqueDepth) {
                        current.children[part].children = null;
                    }

                    // Set leaf size directly (file or opaque dir)
                    if (isLeaf) {
                        current.children[part].size += size;
                    }

                    current = current.children[part];
                }

                // Propagate size up to parents (not leaf)
                current = root;
                for (let j = 0; j < buildDepth - 1; j++) {
                    current.size += size;
                    current = current.children[parts[j]];
                }
                current.size += size;  // Add to immediate parent of leaf

                if (onProgress) {
                    await onProgress(i, total, path);
                }
            }

            // Convert children objects to sorted arrays
            function convertChildren(node) {
                if (node.children && typeof node.children === 'object') {
                    const arr = Object.values(node.children);
                    arr.forEach(convertChildren);
                    arr.sort((a, b) => b.size - a.size);
                    node.children = arr;
                }
                return node;
            }

            return convertChildren(root);
        }

        // Squarified treemap algorithm
        function squarify(children, rect, getSize) {
            if (!children || children.length === 0) return [];

            const results = [];
            const totalSize = children.reduce((sum, c) => sum + getSize(c), 0);
            if (totalSize === 0) return [];

            const area = rect.width * rect.height;
            const normalized = children.map(c => ({
                item: c,
                normalizedSize: (getSize(c) / totalSize) * area
            })).filter(x => x.normalizedSize > 0);

            layoutRow(normalized, rect, results);
            return results;
        }

        function layoutRow(items, rect, results) {
            if (items.length === 0) return;

            const isWide = rect.width >= rect.height;
            const side = isWide ? rect.height : rect.width;

            let row = [];
            let rowArea = 0;
            let remaining = [...items];

            while (remaining.length > 0) {
                const item = remaining[0];
                const testRow = [...row, item];
                const testArea = rowArea + item.normalizedSize;

                const currentWorst = row.length > 0 ? worstRatio(row, rowArea, side) : Infinity;
                const newWorst = worstRatio(testRow, testArea, side);

                if (row.length === 0 || newWorst <= currentWorst) {
                    row.push(item);
                    rowArea += item.normalizedSize;
                    remaining.shift();
                } else {
                    const rowRect = layoutRowRects(row, rowArea, rect, isWide, results);

                    if (isWide) {
                        rect = { x: rect.x + rowRect.usedWidth, y: rect.y,
                                 width: rect.width - rowRect.usedWidth, height: rect.height };
                    } else {
                        rect = { x: rect.x, y: rect.y + rowRect.usedHeight,
                                 width: rect.width, height: rect.height - rowRect.usedHeight };
                    }

                    row = [];
                    rowArea = 0;
                }
            }

            if (row.length > 0) {
                layoutRowRects(row, rowArea, rect, isWide, results);
            }
        }

        /**
         * @pure
         * Calculate worst aspect ratio in a row of treemap items.
         * Lower is better (1.0 = perfect square).
         * @param {Array} row - Items with normalizedSize
         * @param {number} area - Total area of row
         * @param {number} side - Length of the fixed side
         * @returns {number} Worst aspect ratio (>=1), or Infinity if invalid
         * @example worstRatio([], 0, 0) // => Infinity
         * @example worstRatio([{normalizedSize: 100}], 100, 10) // => 1
         */
        function worstRatio(row, area, side) {
            if (row.length === 0 || area === 0 || side === 0) return Infinity;
            const rowWidth = area / side;
            let worst = 0;
            for (const item of row) {
                const h = item.normalizedSize / rowWidth;
                const ratio = Math.max(rowWidth / h, h / rowWidth);
                worst = Math.max(worst, ratio);
            }
            return worst;
        }

        function layoutRowRects(row, rowArea, rect, isWide, results) {
            if (row.length === 0) return { usedWidth: 0, usedHeight: 0 };

            const side = isWide ? rect.height : rect.width;
            const rowThickness = rowArea / side;
            let offset = 0;

            for (const item of row) {
                const itemLength = item.normalizedSize / rowThickness;
                let itemRect;

                if (isWide) {
                    itemRect = { x: rect.x, y: rect.y + offset, width: rowThickness, height: itemLength };
                } else {
                    itemRect = { x: rect.x + offset, y: rect.y, width: itemLength, height: rowThickness };
                }

                results.push({ item: item.item, rect: itemRect });
                offset += itemLength;
            }

            return { usedWidth: isWide ? rowThickness : 0, usedHeight: isWide ? 0 : rowThickness };
        }

        /**
         * ColorUtils - Pure functions for color assignment.
         * @pure All methods are pure functions.
         */
        const ColorUtils = {
            /**
             * @pure Hash a string to a 32-bit integer using djb2 algorithm.
             * @example ColorUtils.hash('txt') // => 115801
             */
            hash(str) {
                let hash = 0;
                for (let i = 0; i < str.length; i++) {
                    hash = ((hash << 5) - hash) + str.charCodeAt(i);
                    hash |= 0;
                }
                return hash;
            },

            /**
             * @pure Get color palette index for a filename based on its extension.
             * @example ColorUtils.indexForExtension('foo.txt') // => 9
             * @example ColorUtils.indexForExtension('noext') // => 0
             */
            indexForExtension(name) {
                const dot = name.lastIndexOf('.');
                const ext = dot > 0 ? name.slice(dot + 1).toLowerCase() : '';
                return Math.abs(this.hash(ext)) % Config.COLORS.length;
            }
        };

        // Collect all leaf rectangles recursively
        /**
         * Collect leaf rectangles and store bounds on all nodes for hit testing.
         * Mutates nodes by adding `bounds` property.
         */
        function collectLeafRects(node, rect, results) {
            // Store bounds on this node for tree-based hit testing
            node.bounds = rect;

            const children = node.children || [];
            if (children.length === 0) return;

            const layouts = squarify(children, rect, c => c.size);

            for (const layout of layouts) {
                const { item, rect: r } = layout;
                const hasChildren = item.children && item.children.length > 0;

                if (hasChildren) {
                    collectLeafRects(item, r, results);
                } else {
                    item.bounds = r;  // Store bounds on leaf too
                    const colorIdx = ColorUtils.indexForExtension(item.name);
                    results.push({ item, x: r.x, y: r.y, w: r.width, h: r.height, colorIdx });
                }
            }
        }

        /**
         * TreeUtils - Pure functions for tree traversal.
         * @pure All methods are pure functions.
         */
        const TreeTraversal = {
            /**
             * @pure Hit test a point against the tree, returning the leaf node.
             * Uses tree traversal O(depth) instead of O(n).
             * @example TreeTraversal.hitTest(root, 100, 100) // => { name: 'file.txt', ... }
             */
            hitTest(node, x, y) {
                if (!node || !node.bounds) return null;

                const b = node.bounds;
                if (x < b.x || x >= b.x + b.width || y < b.y || y >= b.y + b.height) {
                    return null;
                }

                if (!node.children || node.children.length === 0) {
                    return node;
                }

                for (const child of node.children) {
                    const hit = this.hitTest(child, x, y);
                    if (hit) return hit;
                }

                return null;
            }
        };

        /* ============================================================
         * SECTION: Renderer
         * WebGL rendering with text overlay on Canvas2D.
         * ============================================================ */

        const canvas = document.getElementById('canvas');
        const textCanvas = document.getElementById('textOverlay');
        const textCtx = textCanvas.getContext('2d');

        let rootData = null;
        let currentNode = null;
        let renderedRects = [];
        let canvasCSSWidth = 0;
        let canvasCSSHeight = 0;

        /**
         * Collect visible labels by traversing tree with pruning.
         * Skips branches that are outside viewport or too small for labels.
         */
        function collectVisibleLabels(node, results, zoom, panX, panY, viewW, viewH, minW, minH) {
            if (!node.bounds) return;
            const { x, y, width, height } = node.bounds;

            // Screen-space bounds
            const sx = x * zoom + panX;
            const sy = y * zoom + panY;
            const sw = width * zoom;
            const sh = height * zoom;

            // Prune: outside viewport
            if (sx + sw < 0 || sx > viewW || sy + sh < 0 || sy > viewH) return;

            // Prune: too small to ever have labels
            if (sw < minW && sh < minH) return;

            if (node.children) {
                for (const child of node.children) {
                    collectVisibleLabels(child, results, zoom, panX, panY, viewW, viewH, minW, minH);
                }
            } else if (sw >= minW && sh >= minH) {
                // Leaf node large enough for label
                results.push({ node, sx, sy, sw, sh });
            }
        }

        /** Render text labels on overlay canvas using tree traversal */
        function renderLabels() {
            const scale = Format.renderScale();
            const { zoom, panX, panY } = Viewport;

            textCtx.clearRect(0, 0, textCanvas.width, textCanvas.height);
            if (!currentNode) return;

            // Collect visible labels using tree traversal with pruning
            const labels = [];
            collectVisibleLabels(
                currentNode, labels,
                zoom, panX, panY,
                canvasCSSWidth, canvasCSSHeight,
                Config.LABEL_MIN_WIDTH, Config.LABEL_MIN_HEIGHT
            );

            // Pre-compute scaled padding
            const padX = Config.LABEL_PADDING_X * scale;
            const padY = Config.LABEL_PADDING_Y * scale;

            // Set up text style once
            textCtx.fillStyle = 'rgba(255,255,255,0.9)';
            textCtx.font = `${11 * scale}px -apple-system, BlinkMacSystemFont, sans-serif`;
            textCtx.shadowColor = 'rgba(0,0,0,0.8)';
            textCtx.shadowBlur = 2 * scale;
            textCtx.shadowOffsetX = 0;
            textCtx.shadowOffsetY = scale;

            const measureFn = t => textCtx.measureText(t).width;
            for (const { node, sx, sy, sw } of labels) {
                const displayText = Format.middleTruncate(node.name, measureFn, sw * scale - padX * 2);
                textCtx.fillText(displayText, sx * scale + padX, sy * scale + padY);
            }

            textCtx.shadowBlur = 0;
        }

        async function renderTreemap(node) {
            currentNode = node;
            updateStats();

            const container = document.getElementById('container');
            canvasCSSWidth = container.clientWidth;
            canvasCSSHeight = container.clientHeight;
            const scale = Format.renderScale();

            Format.sizeCanvas(canvas, canvasCSSWidth, canvasCSSHeight, scale);
            Format.sizeCanvas(textCanvas, canvasCSSWidth, canvasCSSHeight, scale);

            // Collect all leaf rects (in CSS pixel space)
            renderedRects = [];
            const baseRect = { x: 0, y: 0, width: canvasCSSWidth, height: canvasCSSHeight };
            collectLeafRects(node, baseRect, renderedRects);

            // Initialize WebGL on first use
            if (!webglInitialized) {
                WebGLRenderer.init(canvas);
                webglInitialized = true;
            }
            // Upload rects to GPU
            WebGLRenderer.setRects(renderedRects);
            // Render with viewport transform
            WebGLRenderer.render(Viewport, canvasCSSWidth, canvasCSSHeight);
            // Render text labels on overlay
            renderLabels();
            return { drawn: renderedRects.length, culled: 0 };
        }

        /**
         * WebGLRenderer - High-performance renderer using WebGL.
         * Draws all rectangles in a single draw call using instancing.
         */
        const WebGLRenderer = {
            gl: null,
            program: null,
            buffers: null,
            rectCount: 0,

            /** Vertex shader - transforms rect corners using viewport */
            VERT_SRC: `#version 300 es
                // Per-vertex: corner offset (0,0), (1,0), (0,1), (1,1)
                in vec2 a_corner;
                // Per-instance: rect position, size, color
                in vec4 a_rect;  // x, y, w, h
                in vec3 a_color;

                uniform vec2 u_resolution;
                uniform float u_zoom;
                uniform vec2 u_pan;

                out vec3 v_color;
                out vec2 v_uv;

                void main() {
                    // Calculate world position
                    vec2 pos = a_rect.xy + a_corner * a_rect.zw;
                    // Apply viewport transform
                    vec2 screen = pos * u_zoom + u_pan;
                    // Convert to clip space (-1 to 1)
                    vec2 clip = (screen / u_resolution) * 2.0 - 1.0;
                    clip.y = -clip.y;  // Flip Y for canvas coords
                    gl_Position = vec4(clip, 0.0, 1.0);

                    v_color = a_color;
                    v_uv = a_corner;
                }
            `,

            /** Fragment shader - applies gradient from dark to light */
            FRAG_SRC: `#version 300 es
                precision mediump float;
                in vec3 v_color;
                in vec2 v_uv;
                out vec4 fragColor;

                void main() {
                    // Diagonal gradient: dark at top-left, light at bottom-right
                    float t = (v_uv.x + v_uv.y) * 0.5;
                    vec3 dark = v_color * 0.6;
                    vec3 light = min(v_color * 1.3, vec3(1.0));
                    vec3 color = mix(dark, light, t);
                    fragColor = vec4(color, 1.0);
                }
            `,

            /** Initialize WebGL context and shaders */
            init(canvas) {
                const gl = canvas.getContext('webgl2', { antialias: false });
                if (!gl) throw new Error('WebGL2 not supported');
                this.gl = gl;

                // Compile shaders
                const vert = this._compileShader(gl.VERTEX_SHADER, this.VERT_SRC);
                const frag = this._compileShader(gl.FRAGMENT_SHADER, this.FRAG_SRC);

                // Link program
                const program = gl.createProgram();
                gl.attachShader(program, vert);
                gl.attachShader(program, frag);
                gl.linkProgram(program);
                if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
                    throw new Error('Shader link failed: ' + gl.getProgramInfoLog(program));
                }
                this.program = program;

                // Get locations
                this.locs = {
                    a_corner: gl.getAttribLocation(program, 'a_corner'),
                    a_rect: gl.getAttribLocation(program, 'a_rect'),
                    a_color: gl.getAttribLocation(program, 'a_color'),
                    u_resolution: gl.getUniformLocation(program, 'u_resolution'),
                    u_zoom: gl.getUniformLocation(program, 'u_zoom'),
                    u_pan: gl.getUniformLocation(program, 'u_pan')
                };

                // Create corner buffer (quad vertices)
                const cornerBuffer = gl.createBuffer();
                gl.bindBuffer(gl.ARRAY_BUFFER, cornerBuffer);
                gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
                    0, 0,  1, 0,  0, 1,  // Triangle 1
                    0, 1,  1, 0,  1, 1   // Triangle 2
                ]), gl.STATIC_DRAW);

                this.buffers = {
                    corner: cornerBuffer,
                    rect: gl.createBuffer(),
                    color: gl.createBuffer()
                };

                // Create VAO
                this.vao = gl.createVertexArray();
                gl.bindVertexArray(this.vao);

                // Corner attribute (per-vertex)
                gl.bindBuffer(gl.ARRAY_BUFFER, cornerBuffer);
                gl.enableVertexAttribArray(this.locs.a_corner);
                gl.vertexAttribPointer(this.locs.a_corner, 2, gl.FLOAT, false, 0, 0);

                // Rect attribute (per-instance)
                gl.bindBuffer(gl.ARRAY_BUFFER, this.buffers.rect);
                gl.enableVertexAttribArray(this.locs.a_rect);
                gl.vertexAttribPointer(this.locs.a_rect, 4, gl.FLOAT, false, 0, 0);
                gl.vertexAttribDivisor(this.locs.a_rect, 1);

                // Color attribute (per-instance)
                gl.bindBuffer(gl.ARRAY_BUFFER, this.buffers.color);
                gl.enableVertexAttribArray(this.locs.a_color);
                gl.vertexAttribPointer(this.locs.a_color, 3, gl.FLOAT, false, 0, 0);
                gl.vertexAttribDivisor(this.locs.a_color, 1);

                gl.bindVertexArray(null);
            },

            /** Compile a shader */
            _compileShader(type, source) {
                const gl = this.gl;
                const shader = gl.createShader(type);
                gl.shaderSource(shader, source);
                gl.compileShader(shader);
                if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
                    throw new Error('Shader compile failed: ' + gl.getShaderInfoLog(shader));
                }
                return shader;
            },

            /** Upload rect data to GPU */
            setRects(rects) {
                const gl = this.gl;
                this.rectCount = rects.length;

                // Build typed arrays
                const rectData = new Float32Array(rects.length * 4);
                const colorData = new Float32Array(rects.length * 3);

                for (let i = 0; i < rects.length; i++) {
                    const r = rects[i];
                    rectData[i * 4 + 0] = r.x;
                    rectData[i * 4 + 1] = r.y;
                    rectData[i * 4 + 2] = r.w;
                    rectData[i * 4 + 3] = r.h;

                    const [cr, cg, cb] = colorsRGB[r.colorIdx];
                    colorData[i * 3 + 0] = cr / 255;
                    colorData[i * 3 + 1] = cg / 255;
                    colorData[i * 3 + 2] = cb / 255;
                }

                // Upload to GPU
                gl.bindBuffer(gl.ARRAY_BUFFER, this.buffers.rect);
                gl.bufferData(gl.ARRAY_BUFFER, rectData, gl.STATIC_DRAW);

                gl.bindBuffer(gl.ARRAY_BUFFER, this.buffers.color);
                gl.bufferData(gl.ARRAY_BUFFER, colorData, gl.STATIC_DRAW);
            },

            /** Render all rects with current viewport */
            render(viewport, cssWidth, cssHeight) {
                const gl = this.gl;

                // Viewport uses actual canvas buffer size
                gl.viewport(0, 0, gl.canvas.width, gl.canvas.height);
                gl.clearColor(0.102, 0.102, 0.180, 1.0);  // #1a1a2e
                gl.clear(gl.COLOR_BUFFER_BIT);

                if (this.rectCount === 0) return;

                gl.useProgram(this.program);
                gl.bindVertexArray(this.vao);

                // Set uniforms (resolution is CSS pixel space where rects are defined)
                gl.uniform2f(this.locs.u_resolution, cssWidth, cssHeight);
                gl.uniform1f(this.locs.u_zoom, viewport.zoom);
                gl.uniform2f(this.locs.u_pan, viewport.panX, viewport.panY);

                // Draw all rects in one call
                gl.drawArraysInstanced(gl.TRIANGLES, 0, 6, this.rectCount);

                gl.bindVertexArray(null);
            }
        };

        let webglInitialized = false;

        // Hit-testing for tooltip
        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const mx = e.clientX - rect.left;
            const my = e.clientY - rect.top;

            // Convert screen coords to world coords for hit testing
            const world = Viewport.screenToWorld(mx, my, Viewport.zoom, Viewport.panX, Viewport.panY);
            const hit = currentNode ? TreeTraversal.hitTest(currentNode, world.x, world.y) : null;

            const tooltip = document.getElementById('tooltip');
            if (hit) {
                tooltip.innerHTML = `<strong>${hit.name}</strong><br>${Format.bytes(hit.size)}<br><small>${hit.path}</small>`;
                tooltip.style.display = 'block';
                tooltip.style.left = (e.clientX + 15) + 'px';
                tooltip.style.top = (e.clientY + 15) + 'px';
            } else {
                tooltip.style.display = 'none';
            }
        });

        canvas.addEventListener('mouseleave', () => {
            document.getElementById('tooltip').style.display = 'none';
        });

        /**
         * TouchMath - Pure functions for touch gesture calculations.
         * @pure All methods are pure functions.
         */
        const TouchMath = {
            /**
             * @pure Distance between two touch points.
             * @example TouchMath.distance({clientX:0,clientY:0}, {clientX:3,clientY:4}) // => 5
             */
            distance(t1, t2) {
                const dx = t2.clientX - t1.clientX;
                const dy = t2.clientY - t1.clientY;
                return Math.sqrt(dx * dx + dy * dy);
            },

            /**
             * @pure Midpoint between two touches, relative to a rect.
             * @example TouchMath.midpoint(t1, t2, {left:0,top:0}) // => {x, y}
             */
            midpoint(t1, t2, rect) {
                return {
                    x: (t1.clientX + t2.clientX) / 2 - rect.left,
                    y: (t1.clientY + t2.clientY) / 2 - rect.top
                };
            },

            /**
             * @pure Create initial touch state for pinch gesture.
             */
            createPinchState(t1, t2, rect, viewport) {
                const mid = this.midpoint(t1, t2, rect);
                return {
                    active: true,
                    initialZoom: viewport.zoom,
                    initialPanX: viewport.panX,
                    initialPanY: viewport.panY,
                    initialDist: this.distance(t1, t2),
                    initialMidX: mid.x,
                    initialMidY: mid.y
                };
            }
        };

        /**
         * ZoomMath - Pure functions for zoom/pan calculations.
         * @pure All methods are pure functions.
         */
        const ZoomMath = {
            /**
             * @pure Clamp zoom to valid range.
             * @example ZoomMath.clampZoom(0.5, 1, 20) // => 1
             */
            clampZoom(zoom, min, max) {
                return Math.max(min, Math.min(max, zoom));
            },

            /**
             * @pure Calculate new viewport state for pinch zoom.
             * Returns {zoom, panX, panY} without mutating anything.
             */
            calcPinchZoom(touchState, currentDist, currentMid, minZoom, maxZoom) {
                const zoomDelta = currentDist / touchState.initialDist;
                const newZoom = this.clampZoom(touchState.initialZoom * zoomDelta, minZoom, maxZoom);
                const world = Viewport.screenToWorld(
                    touchState.initialMidX, touchState.initialMidY,
                    touchState.initialZoom, touchState.initialPanX, touchState.initialPanY
                );
                return {
                    zoom: newZoom,
                    panX: currentMid.x - world.x * newZoom,
                    panY: currentMid.y - world.y * newZoom
                };
            },

            /**
             * @pure Zoom towards a screen point. Returns new viewport state.
             * @example ZoomMath.zoomTowards(100, 100, 2, {zoom:1, panX:0, panY:0}) // zoom to 2x at (100,100)
             */
            zoomTowards(screenX, screenY, newZoom, viewport) {
                const world = Viewport.screenToWorld(screenX, screenY, viewport.zoom, viewport.panX, viewport.panY);
                return {
                    zoom: newZoom,
                    panX: screenX - world.x * newZoom,
                    panY: screenY - world.y * newZoom
                };
            },

            /**
             * @pure Apply pan delta. Returns new viewport state.
             * @example ZoomMath.pan({zoom:1, panX:0, panY:0}, 10, 20) // => {zoom:1, panX:-10, panY:-20}
             */
            pan(viewport, deltaX, deltaY) {
                return {
                    zoom: viewport.zoom,
                    panX: viewport.panX - deltaX,
                    panY: viewport.panY - deltaY
                };
            }
        };

        /* ============================================================
         * SECTION: UI State
         * Mutable state for interaction tracking.
         * ============================================================ */

        let touchState = { active: false };

        /** Re-render with current viewport (instant, rects already on GPU) */
        function renderFast() {
            if (webglInitialized) {
                WebGLRenderer.render(Viewport, canvasCSSWidth, canvasCSSHeight);
                renderLabels();
            }
        }

        /* ============================================================
         * SECTION: Input Handlers
         * Event listeners - thin wrappers delegating to pure functions.
         * ============================================================ */

        canvas.addEventListener('touchstart', (e) => {
            if (e.touches.length >= 2) {
                e.preventDefault();
                touchState = TouchMath.createPinchState(
                    e.touches[0], e.touches[1],
                    canvas.getBoundingClientRect(), Viewport
                );
            }
        }, { passive: false });

        canvas.addEventListener('touchmove', (e) => {
            if (!touchState.active || e.touches.length < 2) return;
            e.preventDefault();

            const rect = canvas.getBoundingClientRect();
            const dist = TouchMath.distance(e.touches[0], e.touches[1]);
            const mid = TouchMath.midpoint(e.touches[0], e.touches[1], rect);
            Viewport.apply(ZoomMath.calcPinchZoom(touchState, dist, mid, Viewport.minZoom, Viewport.maxZoom));
            renderFast();
        }, { passive: false });

        canvas.addEventListener('touchend', (e) => {
            if (touchState.active && e.touches.length < 2) {
                touchState.active = false;
            }
        });

        canvas.addEventListener('dblclick', async () => {
            if (Viewport.zoom !== 1 || Viewport.panX !== 0 || Viewport.panY !== 0) {
                Viewport.apply(Viewport.defaults());
                if (currentNode) {
                    await renderTreemap(currentNode);
                }
            }
        });

        // Prevent browser zoom on pinch (must be at document level)
        document.addEventListener('wheel', (e) => {
            if (e.ctrlKey) e.preventDefault();
        }, { passive: false });

        canvas.addEventListener('wheel', (e) => {
            e.preventDefault();

            if (e.ctrlKey) {
                // Pinch-to-zoom: zoom towards cursor
                const rect = canvas.getBoundingClientRect();
                const newZoom = ZoomMath.clampZoom(
                    Viewport.zoom * (1 - e.deltaY * 0.01),
                    Viewport.minZoom,
                    Viewport.maxZoom
                );
                Viewport.apply(ZoomMath.zoomTowards(
                    e.clientX - rect.left,
                    e.clientY - rect.top,
                    newZoom,
                    Viewport
                ));
            } else {
                // Two-finger pan
                Viewport.apply(ZoomMath.pan(Viewport, e.deltaX, e.deltaY));
            }
            renderFast();
        }, { passive: false });

        /**
         * TreeUtils - Pure functions for tree traversal and stats.
         * @pure All methods are pure functions.
         */
        const TreeUtils = {
            /**
             * @pure Count files and folders in a tree.
             * @example TreeUtils.countItems(node) // => { files: 100, folders: 10 }
             */
            countItems(node) {
                let files = 0, folders = 0;
                if (node.children) {
                    folders++;
                    for (const child of node.children) {
                        const c = this.countItems(child);
                        files += c.files;
                        folders += c.folders;
                    }
                } else {
                    files = 1;
                }
                return { files, folders };
            }
        };

        function updateStats() {
            const stats = document.getElementById('stats');
            const count = TreeUtils.countItems(currentNode);
            stats.textContent = `${Format.bytes(currentNode.size)} | ${count.files} files, ${count.folders} folders`;
        }

        let resizeTimeout = null;
        window.addEventListener('resize', () => {
            if (!currentNode) return;
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(async () => {
                Viewport.apply(Viewport.defaults());
                await renderTreemap(currentNode);
            }, 150);
        });

        // Load JSON+zstd from file picker
        const loading = document.getElementById('loading');
        const fileInput = document.getElementById('fileInput');

        /**
         * Progress - Pure functions for progress bar calculations.
         * All functions are stateless and have no DOM dependencies.
         *
         * @example
         * Progress.calcOverall('parse', 50) // => 30 (halfway through parse phase)
         * Progress.calcStep(500, 1000) // => 50
         * Progress.formatPath('/very/long/path/...') // => '...ong/path/...'
         * Progress.shouldYield(lastTime, 120) // => true if 8.3ms elapsed
         */
        const Progress = {
            /** Phase ranges as [start%, end%] of overall progress */
            PHASES: {
                read: [0, 5],
                parse: [5, 50],
                tree: [50, 80],
                render: [80, 100]
            },

            /**
             * Calculate overall percentage from phase and step progress.
             * @param {string} phase - Phase name (read|parse|tree|render)
             * @param {number} stepPercent - Progress within phase (0-100)
             * @returns {number} Overall progress (0-100)
             * @example Progress.calcOverall('parse', 50) // => 30
             */
            calcOverall(phase, stepPercent) {
                const [start, end] = this.PHASES[phase] || [0, 100];
                return Math.round(start + (stepPercent / 100) * (end - start));
            },

            /**
             * Calculate step percentage from done/total counts.
             * @param {number} done - Items completed
             * @param {number} total - Total items
             * @returns {number} Percentage (0-100)
             * @example Progress.calcStep(250, 1000) // => 25
             */
            calcStep(done, total) {
                return total > 0 ? Math.round((done / total) * 100) : 0;
            },

            /**
             * Truncate path for display, keeping start and end visible.
             * @param {string} path - Full file path
             * @param {number} maxLen - Maximum length (default 60)
             * @returns {string} Truncated path with '....' in middle if needed
             * @example Progress.formatPath('/a/b/c/d/e/f/g.txt', 20) // => '/a/b/..../f/g.txt'
             */
            formatPath(path, maxLen = 60) {
                if (path.length <= maxLen) return path;
                const ellipsis = '....';
                const available = maxLen - ellipsis.length;
                const startLen = Math.ceil(available / 2);
                const endLen = Math.floor(available / 2);
                return path.slice(0, startLen) + ellipsis + path.slice(-endLen);
            },

            /**
             * Check if enough time elapsed to yield for UI update.
             * @param {number} lastYield - Timestamp of last yield (performance.now())
             * @returns {boolean} True if should yield
             * @example Progress.shouldYield(performance.now() - 10) // => true (at 120fps)
             */
            shouldYield(lastYield) {
                return performance.now() - lastYield >= (1000 / Config.TARGET_FPS);
            },

            /**
             * Yield to allow UI update, returns new timestamp.
             * @returns {Promise<number>} New timestamp after frame
             */
            async yieldFrame() {
                await new Promise(r => requestAnimationFrame(r));
                return performance.now();
            }
        };

        /**
         * ProgressUI - Configurable progress display.
         * Call show() with options to configure stages dynamically.
         *
         * @example ProgressUI.show({ stages: ['read', 'parse', 'tree', 'render'] })
         * @example ProgressUI.show({ stages: ['render'], showInfo: false })
         */
        const ProgressUI = {
            /** Stage definitions: id -> { icon, label } */
            STAGE_DEFS: {
                read:   { icon: 'mdi:file-download-outline', label: 'Read' },
                parse:  { icon: 'mdi:code-json', label: 'Parse' },
                tree:   { icon: 'mdi:file-tree-outline', label: 'Build' },
                render: { icon: 'mdi:brush-outline', label: 'Render' }
            },

            activeStages: [],
            showTimeout: null,
            isVisible: false,

            /**
             * Show progress UI with specified stages (after delay threshold).
             * @param {Object} options
             * @param {string[]} options.stages - Stage ids to show (default: all)
             * @param {boolean} options.showInfo - Show info line (default: true)
             */
            show({ stages = ['read', 'parse', 'tree', 'render'], showInfo = true } = {}) {
                this.activeStages = stages;
                this.buildStages(stages);
                document.getElementById('progressInfoLine').style.display = showInfo ? '' : 'none';

                // Delay showing until threshold reached
                clearTimeout(this.showTimeout);
                this.isVisible = false;
                this.showTimeout = setTimeout(() => {
                    loading.classList.remove('hidden');
                    loading.classList.add('processing');
                    this.isVisible = true;
                }, Config.PROGRESS_DELAY_MS);
            },

            /** Build stage HTML dynamically */
            buildStages(stages) {
                const container = document.getElementById('stagesContainer');
                container.innerHTML = stages.map(id => {
                    const def = this.STAGE_DEFS[id];
                    return `<div class="stage" id="stage-${id}">
                        <div class="stage-bubble"><span class="iconify" data-icon="${def.icon}"></span></div>
                        <div class="stage-label">${def.label}</div>
                    </div>`;
                }).join('');
                // Re-scan for new iconify elements
                if (window.Iconify) Iconify.scan();
            },

            /** Hide progress UI with fade-out transition */
            hide() {
                clearTimeout(this.showTimeout);
                if (this.isVisible) {
                    loading.classList.add('hidden');
                }
                this.isVisible = false;
            },

            /** Set stage state: 'active' or 'done' */
            setStage(stage, state) {
                const el = document.getElementById('stage-' + stage);
                if (!el) return;
                el.classList.remove('active', 'done');
                if (state === 'active' || state === 'done') el.classList.add(state);
            },

            /** Update progress bar */
            setProgress(label, percent) {
                document.getElementById('progressLabel').textContent = label;
                document.getElementById('progressPct').textContent = percent + '%';
                document.getElementById('progressFill').style.width = percent + '%';
            },

            /** Update info line */
            setInfo(text) {
                document.getElementById('progressInfoLine').textContent = text || '';
            }
        };

        /* ============================================================
         * SECTION: Main Application
         * File processing, initialization, and event wiring.
         * ============================================================ */

        async function processFile(file) {
            Viewport.apply(Viewport.defaults());
            ProgressUI.show({ stages: ['read', 'parse', 'tree', 'render'], showInfo: true });
            let lastYield = performance.now();

            // Stage 1: Read
            ProgressUI.setStage('read', 'active');
            ProgressUI.setProgress('Reading file...', 0);
            ProgressUI.setInfo(file.name);
            lastYield = await Progress.yieldFrame();
            const compressed = new Uint8Array(await file.arrayBuffer());
            ProgressUI.setStage('read', 'done');

            // Stage 2: Parse (includes decompress)
            ProgressUI.setStage('parse', 'active');
            ProgressUI.setProgress('Decompressing...', 0);
            ProgressUI.setInfo('');
            lastYield = await Progress.yieldFrame();
            const decompressed = fzstd.decompress(compressed);
            const text = new TextDecoder().decode(decompressed);
            const lines = text.split('\n');

            const header = JSON.parse(lines[0]);
            const totalFiles = header.count || lines.length - 1;

            const byInode = new Map();
            let lastPath = '';
            for (let i = 1; i < lines.length; i++) {
                if (!lines[i]) continue;
                const f = JSON.parse(lines[i]);
                const fileObj = { inode: f[0], size: f[1], path: f[2] };
                lastPath = fileObj.path;
                const existing = byInode.get(fileObj.inode);
                if (!existing || fileObj.path.length < existing.path.length) {
                    byInode.set(fileObj.inode, fileObj);
                }
                if (Progress.shouldYield(lastYield)) {
                    const pct = Progress.calcStep(i, totalFiles);
                    ProgressUI.setProgress(`Parsing ${i.toLocaleString()} / ${totalFiles.toLocaleString()}`, pct);
                    ProgressUI.setInfo(Progress.formatPath(lastPath));
                    lastYield = await Progress.yieldFrame();
                }
            }
            const uniqueFiles = Array.from(byInode.values());
            ProgressUI.setStage('parse', 'done');

            // Stage 3: Build tree
            ProgressUI.setStage('tree', 'active');
            ProgressUI.setInfo(`${uniqueFiles.length.toLocaleString()} unique files`);
            rootData = await buildTree(uniqueFiles, header.root, async (done, total, path) => {
                if (Progress.shouldYield(lastYield)) {
                    const pct = Progress.calcStep(done, total);
                    ProgressUI.setProgress(`Building ${done.toLocaleString()} / ${total.toLocaleString()}`, pct);
                    lastYield = await Progress.yieldFrame();
                }
            });
            ProgressUI.setStage('tree', 'done');

            // Stage 4: Render
            ProgressUI.setStage('render', 'active');
            ProgressUI.setInfo('');
            await renderTreemap(rootData);
            ProgressUI.setStage('render', 'done');

            ProgressUI.hide();
        }

        fileInput.addEventListener('change', e => {
            if (e.target.files[0]) processFile(e.target.files[0]);
        });

        loading.addEventListener('dragover', e => { e.preventDefault(); loading.style.background = '#2a2a4e'; });
        loading.addEventListener('dragleave', () => { loading.style.background = ''; });
        loading.addEventListener('drop', e => {
            e.preventDefault();
            loading.style.background = '';
            if (e.dataTransfer.files[0]) processFile(e.dataTransfer.files[0]);
        });
    </script>
</body>
</html>
