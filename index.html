<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Disk Space Treemap</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #eee;
            overflow: hidden;
        }
        #header {
            padding: 10px 20px;
            background: #16213e;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }
        #header h1 { font-size: 18px; font-weight: 500; }
        #stats { font-size: 13px; color: #888; }
        #tooltip {
            position: fixed;
            background: rgba(0,0,0,0.9);
            color: #fff;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 12px;
            pointer-events: none;
            z-index: 1000;
            display: none;
            max-width: 500px;
            word-wrap: break-word;
        }
        #container {
            width: 100vw;
            height: calc(100vh - 50px);
            position: relative;
        }
        #canvas {
            display: block;
            cursor: pointer;
        }
        /* Glassmorphism mixin - reusable milky glass effect */
        .glass {
            background: rgba(30, 30, 50, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        #loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 14px;
            text-align: left;
            padding: 30px 40px;
            border-radius: 16px;
            cursor: pointer;
            width: 450px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            transition: opacity 0.4s ease, filter 0.4s ease, transform 0.4s ease;
            opacity: 1;
            filter: blur(0);
        }
        #loading.hidden {
            opacity: 0;
            filter: blur(8px);
            transform: translate(-50%, -50%) scale(0.95);
            pointer-events: none;
        }
        #loading:not(.processing) { border: 2px dashed rgba(255,255,255,0.2); background: rgba(30,30,50,0.5); }
        #loading.processing { cursor: default; }
        #loading #fileInput {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }
        #loading:hover { border-color: rgba(108,155,207,0.5); }
        #loading .drop-text { text-align: center; font-size: 16px; }
        #loading .progress-section { display: none; }
        #loading.processing .drop-text { display: none; }
        #loading.processing .progress-section { display: block; }
        #loading .stages {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }
        #loading .stage {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }
        #loading .stage-bubble {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(255,255,255,0.08);
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255,255,255,0.25);
            font-size: 18px;
            transition: all 0.3s ease;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
        }
        #loading .stage.active .stage-bubble {
            background: rgba(108,155,207,0.4);
            color: #6c9bcf;
            box-shadow: 0 0 12px rgba(108,155,207,0.6), 0 0 24px rgba(108,155,207,0.3), inset 0 1px 2px rgba(255,255,255,0.2);
        }
        #loading .stage.done .stage-bubble {
            background: rgba(69,210,176,0.4);
            color: #45D2B0;
            box-shadow: 0 0 12px rgba(69,210,176,0.6), 0 0 24px rgba(69,210,176,0.3), inset 0 1px 2px rgba(255,255,255,0.2);
        }
        #loading .stage-label {
            font-size: 10px;
            color: #555;
            transition: color 0.3s ease;
        }
        #loading .stage.active .stage-label { color: #6c9bcf; }
        #loading .stage.done .stage-label { color: #45D2B0; }
        #loading .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(255,255,255,0.1);
            border-radius: 3px;
            overflow: hidden;
        }
        #loading .progress-fill {
            height: 100%;
            background: #6c9bcf;
            border-radius: 3px;
            width: 0%;
        }
        #loading .progress-info {
            display: flex;
            justify-content: space-between;
            margin-top: 8px;
            font-size: 11px;
            color: #888;
        }
        #loading .progress-info-line {
            font-size: 11px;
            color: #666;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 12px;
            height: 14px;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/fzstd@0.1.1/umd/index.min.js"></script>
    <script src="https://code.iconify.design/3/3.1.0/iconify.min.js"></script>
</head>
<body>
    <div id="header">
        <h1>Disk Space Visualization</h1>
        <div id="stats"></div>
    </div>
    <div id="container">
        <canvas id="canvas"></canvas>
    </div>
    <div id="tooltip"></div>
    <div id="loading" class="glass">
        <div class="drop-text">Drop .json.zst file here</div>
        <div class="progress-section">
            <div class="stages">
                <div class="stage" id="stage-read">
                    <div class="stage-bubble"><span class="iconify" data-icon="mdi:file-download-outline"></span></div>
                    <div class="stage-label">Read</div>
                </div>
                <div class="stage" id="stage-parse">
                    <div class="stage-bubble"><span class="iconify" data-icon="mdi:code-json"></span></div>
                    <div class="stage-label">Parse</div>
                </div>
                <div class="stage" id="stage-tree">
                    <div class="stage-bubble"><span class="iconify" data-icon="mdi:file-tree-outline"></span></div>
                    <div class="stage-label">Build</div>
                </div>
                <div class="stage" id="stage-render">
                    <div class="stage-bubble"><span class="iconify" data-icon="mdi:brush-outline"></span></div>
                    <div class="stage-label">Render</div>
                </div>
            </div>
            <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
            <div class="progress-info">
                <span id="progressLabel">Loading...</span>
                <span id="progressPct">0%</span>
            </div>
            <div class="progress-info-line" id="progressInfoLine"></div>
        </div>
        <input type="file" id="fileInput" accept=".zst">
    </div>

    <script>
        let rootData = null;
        let currentNode = null;
        let renderedRects = [];

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        /**
         * Config - All rendering constants in one place.
         * Used by pure functions for threshold decisions.
         */
        const Config = {
            /** Target frames per second for progress updates */
            TARGET_FPS: 120,

            /** Internal render scale (2 = render at 2x, display at 1x for more detail) */
            RENDER_SCALE: 2,

            /** Minimum area (px²) for gradient rendering. Below this, solid color only. */
            GRADIENT_MIN_AREA: 16,  // 4x4 at render scale

            /** Minimum area (px²) for stroke/border. Below this, no border. */
            STROKE_MIN_AREA: 4,     // 2x2 at render scale

            /** Minimum dimensions for text label */
            LABEL_MIN_WIDTH: 40,
            LABEL_MIN_HEIGHT: 16
        };

        /**
         * @pure
         * Determine render tier for a rectangle based on its area.
         * @param {number} width - Rect width in pixels (at render scale)
         * @param {number} height - Rect height in pixels (at render scale)
         * @returns {'full'|'solid'} Render tier
         * @example RenderTier.get(100, 100) // => 'full'
         * @example RenderTier.get(3, 3) // => 'solid'
         */
        const RenderTier = {
            get(width, height) {
                return width * height >= Config.GRADIENT_MIN_AREA ? 'full' : 'solid';
            },

            /** @pure Check if rect should have stroke */
            hasStroke(width, height) {
                return width * height >= Config.STROKE_MIN_AREA;
            },

            /** @pure Check if rect can fit a label */
            hasLabel(width, height) {
                return width >= Config.LABEL_MIN_WIDTH && height >= Config.LABEL_MIN_HEIGHT;
            }
        };

        // GrandPerspective "Rainbow" palette (exact colors from source)
        const colors = [
            '#FFFF54', '#C8E64C', '#8CD466', '#4DC742',
            '#45D2B0', '#46ACD3', '#438CCB', '#4262C7',
            '#5240C3', '#8C3FC0', '#D145C1', '#E64C8D',
            '#FF5454', '#FF8054', '#FFA054', '#FFB554'
        ];

        // Pre-parse colors to RGB for faster drawing
        const colorsRGB = colors.map(hex => {
            const num = parseInt(hex.slice(1), 16);
            return [(num >> 16), ((num >> 8) & 0xFF), (num & 0xFF)];
        });

        /**
         * @pure
         * Format bytes as human-readable string.
         * @param {number} bytes
         * @returns {string}
         * @example formatBytes(0) // => '0 B'
         * @example formatBytes(1024) // => '1 KB'
         * @example formatBytes(1536) // => '1.5 KB'
         * @example formatBytes(1073741824) // => '1 GB'
         */
        function formatBytes(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        // Build tree from flat file list (async with progress)
        async function buildTree(files, rootPath, onProgress) {
            const root = { name: rootPath, path: rootPath, size: 0, children: {} };
            const total = files.length;

            for (let i = 0; i < files.length; i++) {
                const { size, path } = files[i];
                const relativePath = path.startsWith(rootPath)
                    ? path.slice(rootPath.length).replace(/^\//, '')
                    : path;

                const parts = relativePath.split('/').filter(p => p);
                let current = root;

                for (let j = 0; j < parts.length; j++) {
                    const part = parts[j];
                    const isFile = j === parts.length - 1;

                    if (!current.children[part]) {
                        current.children[part] = {
                            name: part,
                            path: rootPath + '/' + parts.slice(0, j + 1).join('/'),
                            size: 0,
                            children: isFile ? null : {}
                        };
                    }

                    if (isFile) {
                        current.children[part].size = size;
                        current.children[part].children = null;
                    }

                    current = current.children[part];
                }

                // Propagate size up
                current = root;
                for (const part of parts) {
                    current.size += size;
                    current = current.children[part];
                }

                if (onProgress) {
                    await onProgress(i, total, path);
                }
            }

            // Convert children objects to sorted arrays
            function convertChildren(node) {
                if (node.children && typeof node.children === 'object') {
                    const arr = Object.values(node.children);
                    arr.forEach(convertChildren);
                    arr.sort((a, b) => b.size - a.size);
                    node.children = arr;
                }
                return node;
            }

            return convertChildren(root);
        }

        // Squarified treemap algorithm
        function squarify(children, rect, getSize) {
            if (!children || children.length === 0) return [];

            const results = [];
            const totalSize = children.reduce((sum, c) => sum + getSize(c), 0);
            if (totalSize === 0) return [];

            const area = rect.width * rect.height;
            const normalized = children.map(c => ({
                item: c,
                normalizedSize: (getSize(c) / totalSize) * area
            })).filter(x => x.normalizedSize > 0);

            layoutRow(normalized, rect, results);
            return results;
        }

        function layoutRow(items, rect, results) {
            if (items.length === 0) return;

            const isWide = rect.width >= rect.height;
            const side = isWide ? rect.height : rect.width;

            let row = [];
            let rowArea = 0;
            let remaining = [...items];

            while (remaining.length > 0) {
                const item = remaining[0];
                const testRow = [...row, item];
                const testArea = rowArea + item.normalizedSize;

                const currentWorst = row.length > 0 ? worstRatio(row, rowArea, side) : Infinity;
                const newWorst = worstRatio(testRow, testArea, side);

                if (row.length === 0 || newWorst <= currentWorst) {
                    row.push(item);
                    rowArea += item.normalizedSize;
                    remaining.shift();
                } else {
                    const rowRect = layoutRowRects(row, rowArea, rect, isWide, results);

                    if (isWide) {
                        rect = { x: rect.x + rowRect.usedWidth, y: rect.y,
                                 width: rect.width - rowRect.usedWidth, height: rect.height };
                    } else {
                        rect = { x: rect.x, y: rect.y + rowRect.usedHeight,
                                 width: rect.width, height: rect.height - rowRect.usedHeight };
                    }

                    row = [];
                    rowArea = 0;
                }
            }

            if (row.length > 0) {
                layoutRowRects(row, rowArea, rect, isWide, results);
            }
        }

        /**
         * @pure
         * Calculate worst aspect ratio in a row of treemap items.
         * Lower is better (1.0 = perfect square).
         * @param {Array} row - Items with normalizedSize
         * @param {number} area - Total area of row
         * @param {number} side - Length of the fixed side
         * @returns {number} Worst aspect ratio (>=1), or Infinity if invalid
         * @example worstRatio([], 0, 0) // => Infinity
         * @example worstRatio([{normalizedSize: 100}], 100, 10) // => 1
         */
        function worstRatio(row, area, side) {
            if (row.length === 0 || area === 0 || side === 0) return Infinity;
            const rowWidth = area / side;
            let worst = 0;
            for (const item of row) {
                const h = item.normalizedSize / rowWidth;
                const ratio = Math.max(rowWidth / h, h / rowWidth);
                worst = Math.max(worst, ratio);
            }
            return worst;
        }

        function layoutRowRects(row, rowArea, rect, isWide, results) {
            if (row.length === 0) return { usedWidth: 0, usedHeight: 0 };

            const side = isWide ? rect.height : rect.width;
            const rowThickness = rowArea / side;
            let offset = 0;

            for (const item of row) {
                const itemLength = item.normalizedSize / rowThickness;
                let itemRect;

                if (isWide) {
                    itemRect = { x: rect.x, y: rect.y + offset, width: rowThickness, height: itemLength };
                } else {
                    itemRect = { x: rect.x + offset, y: rect.y, width: itemLength, height: rowThickness };
                }

                results.push({ item: item.item, rect: itemRect });
                offset += itemLength;
            }

            return { usedWidth: isWide ? rowThickness : 0, usedHeight: isWide ? 0 : rowThickness };
        }

        /**
         * @pure
         * Hash a string to a 32-bit integer using djb2 algorithm.
         * @param {string} str - Input string
         * @returns {number} 32-bit hash
         * @example hashString('') // => 0
         * @example hashString('txt') // => 115801
         * @example hashString('jpg') // => 105765
         */
        function hashString(str) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                hash = ((hash << 5) - hash) + str.charCodeAt(i);
                hash |= 0;
            }
            return hash;
        }

        /**
         * @pure
         * Get color palette index for a filename based on its extension.
         * @param {string} name - Filename
         * @returns {number} Index into colors array (0-15)
         * @example getColorIndexForExtension('foo.txt') // => 9
         * @example getColorIndexForExtension('bar.jpg') // => 5
         * @example getColorIndexForExtension('noext') // => 0
         */
        function getColorIndexForExtension(name) {
            const dot = name.lastIndexOf('.');
            const ext = dot > 0 ? name.slice(dot + 1).toLowerCase() : '';
            const hash = Math.abs(hashString(ext));
            return hash % colors.length;
        }

        // Collect all leaf rectangles recursively
        function collectLeafRects(node, rect, results) {
            const children = node.children || [];
            if (children.length === 0) return;

            const layouts = squarify(children, rect, c => c.size);

            for (const layout of layouts) {
                const { item, rect: r } = layout;
                const hasChildren = item.children && item.children.length > 0;

                if (hasChildren) {
                    collectLeafRects(item, r, results);
                } else {
                    const colorIdx = getColorIndexForExtension(item.name);
                    results.push({ item, x: r.x, y: r.y, w: r.width, h: r.height, colorIdx });
                }
            }
        }

        async function renderTreemap(node, onProgress) {
            currentNode = node;
            updateStats();

            const container = document.getElementById('container');
            const cssWidth = container.clientWidth;
            const cssHeight = container.clientHeight;
            const scale = Config.RENDER_SCALE * (window.devicePixelRatio || 1);

            canvas.width = cssWidth * scale;
            canvas.height = cssHeight * scale;
            canvas.style.width = cssWidth + 'px';
            canvas.style.height = cssHeight + 'px';
            ctx.scale(scale, scale);

            // Collect all leaf rects
            renderedRects = [];
            const baseRect = { x: 0, y: 0, width: cssWidth, height: cssHeight };
            collectLeafRects(node, baseRect, renderedRects);

            // Draw all rects with progress
            return await drawCanvas(onProgress);
        }

        async function drawCanvas(onProgress) {
            const scale = Config.RENDER_SCALE * (window.devicePixelRatio || 1);
            const width = canvas.width / scale;
            const height = canvas.height / scale;

            ctx.fillStyle = '#1a1a2e';
            ctx.fillRect(0, 0, width, height);

            const total = renderedRects.length;
            let drawn = 0;

            for (let i = 0; i < renderedRects.length; i++) {
                const rect = renderedRects[i];
                const { x, y, w, h, colorIdx } = rect;
                const [r, g, b] = colorsRGB[colorIdx];
                const tier = RenderTier.get(w * Config.RENDER_SCALE, h * Config.RENDER_SCALE);

                drawn++;

                if (tier === 'full') {
                    // Full render: gradient + stroke + label
                    const gradient = ctx.createLinearGradient(x, y, x + w, y + h);
                    const dark = `rgb(${Math.round(r * 0.6)}, ${Math.round(g * 0.6)}, ${Math.round(b * 0.6)})`;
                    const light = `rgb(${Math.min(255, Math.round(r * 1.3))}, ${Math.min(255, Math.round(g * 1.3))}, ${Math.min(255, Math.round(b * 1.3))})`;
                    gradient.addColorStop(0, dark);
                    gradient.addColorStop(1, light);
                    ctx.fillStyle = gradient;
                } else {
                    // Solid render: just the base color
                    ctx.fillStyle = `rgb(${r}, ${g}, ${b})`;
                }

                ctx.fillRect(x, y, w, h);

                // Border for larger rects
                if (RenderTier.hasStroke(w * Config.RENDER_SCALE, h * Config.RENDER_SCALE)) {
                    ctx.strokeStyle = 'rgba(0,0,0,0.15)';
                    ctx.lineWidth = 0.5;
                    ctx.strokeRect(x, y, w, h);
                }

                // Label for largest rects
                if (RenderTier.hasLabel(w, h)) {
                    ctx.fillStyle = 'rgba(255,255,255,0.9)';
                    ctx.font = '11px -apple-system, BlinkMacSystemFont, sans-serif';
                    ctx.shadowColor = 'rgba(0,0,0,0.8)';
                    ctx.shadowBlur = 2;
                    ctx.shadowOffsetX = 0;
                    ctx.shadowOffsetY = 1;

                    const text = rect.item.name;
                    const maxWidth = w - 8;
                    let displayText = text;
                    if (ctx.measureText(text).width > maxWidth) {
                        while (displayText.length > 3 && ctx.measureText(displayText + '…').width > maxWidth) {
                            displayText = displayText.slice(0, -1);
                        }
                        displayText += '…';
                    }
                    ctx.fillText(displayText, x + 4, y + 12);
                    ctx.shadowBlur = 0;
                }

                if (onProgress) {
                    await onProgress(i, total, drawn);
                }
            }

            return { drawn };
        }

        // Hit-testing for tooltip
        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const mx = e.clientX - rect.left;
            const my = e.clientY - rect.top;

            // Find hit rect (iterate backwards for z-order, but we draw in order so just find any hit)
            let hit = null;
            for (const r of renderedRects) {
                if (mx >= r.x && mx < r.x + r.w && my >= r.y && my < r.y + r.h) {
                    hit = r;
                }
            }

            const tooltip = document.getElementById('tooltip');
            if (hit) {
                tooltip.innerHTML = `<strong>${hit.item.name}</strong><br>${formatBytes(hit.item.size)}<br><small>${hit.item.path}</small>`;
                tooltip.style.display = 'block';
                tooltip.style.left = (e.clientX + 15) + 'px';
                tooltip.style.top = (e.clientY + 15) + 'px';
            } else {
                tooltip.style.display = 'none';
            }
        });

        canvas.addEventListener('mouseleave', () => {
            document.getElementById('tooltip').style.display = 'none';
        });

        function updateStats() {
            const stats = document.getElementById('stats');
            const count = countItems(currentNode);
            stats.textContent = `${formatBytes(currentNode.size)} | ${count.files} files, ${count.folders} folders`;
        }

        function countItems(node) {
            let files = 0, folders = 0;
            if (node.children) {
                folders++;
                for (const child of node.children) {
                    const c = countItems(child);
                    files += c.files;
                    folders += c.folders;
                }
            } else {
                files = 1;
            }
            return { files, folders };
        }

        window.addEventListener('resize', () => {
            if (currentNode) renderTreemap(currentNode, null);
        });

        // Load JSON+zstd from file picker
        const loading = document.getElementById('loading');
        const fileInput = document.getElementById('fileInput');

        /**
         * Progress - Pure functions for progress bar calculations.
         * All functions are stateless and have no DOM dependencies.
         *
         * @example
         * Progress.calcOverall('parse', 50) // => 30 (halfway through parse phase)
         * Progress.calcStep(500, 1000) // => 50
         * Progress.formatPath('/very/long/path/...') // => '...ong/path/...'
         * Progress.shouldYield(lastTime, 120) // => true if 8.3ms elapsed
         */
        const Progress = {
            /** Phase ranges as [start%, end%] of overall progress */
            PHASES: {
                read: [0, 5],
                decompress: [5, 10],
                parse: [10, 50],
                tree: [50, 80],
                render: [80, 100]
            },

            /**
             * Calculate overall percentage from phase and step progress.
             * @param {string} phase - Phase name (read|decompress|parse|tree|render)
             * @param {number} stepPercent - Progress within phase (0-100)
             * @returns {number} Overall progress (0-100)
             * @example Progress.calcOverall('parse', 50) // => 30
             */
            calcOverall(phase, stepPercent) {
                const [start, end] = this.PHASES[phase] || [0, 100];
                return Math.round(start + (stepPercent / 100) * (end - start));
            },

            /**
             * Calculate step percentage from done/total counts.
             * @param {number} done - Items completed
             * @param {number} total - Total items
             * @returns {number} Percentage (0-100)
             * @example Progress.calcStep(250, 1000) // => 25
             */
            calcStep(done, total) {
                return total > 0 ? Math.round((done / total) * 100) : 0;
            },

            /**
             * Truncate path for display, keeping start and end visible.
             * @param {string} path - Full file path
             * @param {number} maxLen - Maximum length (default 60)
             * @returns {string} Truncated path with '....' in middle if needed
             * @example Progress.formatPath('/a/b/c/d/e/f/g.txt', 20) // => '/a/b/..../f/g.txt'
             */
            formatPath(path, maxLen = 60) {
                if (path.length <= maxLen) return path;
                const ellipsis = '....';
                const available = maxLen - ellipsis.length;
                const startLen = Math.ceil(available / 2);
                const endLen = Math.floor(available / 2);
                return path.slice(0, startLen) + ellipsis + path.slice(-endLen);
            },

            /**
             * Check if enough time elapsed to yield for UI update.
             * @param {number} lastYield - Timestamp of last yield (performance.now())
             * @returns {boolean} True if should yield
             * @example Progress.shouldYield(performance.now() - 10) // => true (at 120fps)
             */
            shouldYield(lastYield) {
                return performance.now() - lastYield >= (1000 / Config.TARGET_FPS);
            },

            /**
             * Yield to allow UI update, returns new timestamp.
             * @returns {Promise<number>} New timestamp after frame
             */
            async yieldFrame() {
                await new Promise(r => requestAnimationFrame(r));
                return performance.now();
            }
        };

        /**
         * ProgressUI - DOM rendering for progress state.
         * Separated from pure logic to allow testing/reuse of Progress.
         */
        const ProgressUI = {
            STAGES: ['read', 'parse', 'tree', 'render'],

            /** Show progress UI, hide drop text */
            show() {
                loading.classList.add('processing');
                this.resetStages();
            },

            /** Hide progress UI with fade-out transition */
            hide() {
                loading.classList.add('hidden');
            },

            /** Reset all stages to off state */
            resetStages() {
                this.STAGES.forEach(id => {
                    const el = document.getElementById('stage-' + id);
                    el.classList.remove('active', 'done');
                });
            },

            /**
             * Set stage state: 'off', 'active', or 'done'
             * @param {string} stage - Stage id (read|parse|tree|render)
             * @param {string} state - State (off|active|done)
             */
            setStage(stage, state) {
                const el = document.getElementById('stage-' + stage);
                el.classList.remove('active', 'done');
                if (state === 'active') el.classList.add('active');
                if (state === 'done') el.classList.add('done');
            },

            /** Update progress bar */
            setProgress(label, percent) {
                document.getElementById('progressLabel').textContent = label;
                document.getElementById('progressPct').textContent = percent + '%';
                document.getElementById('progressFill').style.width = percent + '%';
            },

            /** Update info line (context-dependent text) */
            setInfo(text) {
                document.getElementById('progressInfoLine').textContent = text || '';
            }
        };

        async function processFile(file) {
            ProgressUI.show();
            let lastYield = performance.now();

            // Stage 1: Read
            ProgressUI.setStage('read', 'active');
            ProgressUI.setProgress('Reading file...', 0);
            ProgressUI.setInfo(file.name);
            lastYield = await Progress.yieldFrame();
            const compressed = new Uint8Array(await file.arrayBuffer());
            ProgressUI.setStage('read', 'done');

            // Stage 2: Parse (includes decompress)
            ProgressUI.setStage('parse', 'active');
            ProgressUI.setProgress('Decompressing...', 0);
            ProgressUI.setInfo('');
            lastYield = await Progress.yieldFrame();
            const decompressed = fzstd.decompress(compressed);
            const text = new TextDecoder().decode(decompressed);
            const lines = text.split('\n');

            const header = JSON.parse(lines[0]);
            const totalFiles = header.count || lines.length - 1;

            const byInode = new Map();
            let lastPath = '';
            for (let i = 1; i < lines.length; i++) {
                if (!lines[i]) continue;
                const f = JSON.parse(lines[i]);
                const fileObj = { inode: f[0], size: f[1], path: f[2] };
                lastPath = fileObj.path;
                const existing = byInode.get(fileObj.inode);
                if (!existing || fileObj.path.length < existing.path.length) {
                    byInode.set(fileObj.inode, fileObj);
                }
                if (Progress.shouldYield(lastYield)) {
                    const pct = Progress.calcStep(i, totalFiles);
                    ProgressUI.setProgress(`Parsing ${i.toLocaleString()} / ${totalFiles.toLocaleString()}`, pct);
                    ProgressUI.setInfo(Progress.formatPath(lastPath));
                    lastYield = await Progress.yieldFrame();
                }
            }
            const uniqueFiles = Array.from(byInode.values());
            ProgressUI.setStage('parse', 'done');

            // Stage 3: Build tree
            ProgressUI.setStage('tree', 'active');
            ProgressUI.setInfo(`${uniqueFiles.length.toLocaleString()} unique files`);
            rootData = await buildTree(uniqueFiles, header.root, async (done, total, path) => {
                if (Progress.shouldYield(lastYield)) {
                    const pct = Progress.calcStep(done, total);
                    ProgressUI.setProgress(`Building ${done.toLocaleString()} / ${total.toLocaleString()}`, pct);
                    lastYield = await Progress.yieldFrame();
                }
            });
            ProgressUI.setStage('tree', 'done');

            // Stage 4: Render
            ProgressUI.setStage('render', 'active');
            ProgressUI.setInfo('');
            await renderTreemap(rootData, async (i, total, drawn) => {
                if (Progress.shouldYield(lastYield)) {
                    const pct = Progress.calcStep(i, total);
                    ProgressUI.setProgress(`Drawing ${drawn.toLocaleString()} / ${total.toLocaleString()}`, pct);
                    ProgressUI.setInfo('');
                    lastYield = await Progress.yieldFrame();
                }
            });
            ProgressUI.setStage('render', 'done');

            ProgressUI.hide();
        }

        fileInput.addEventListener('change', e => {
            if (e.target.files[0]) processFile(e.target.files[0]);
        });

        loading.addEventListener('dragover', e => { e.preventDefault(); loading.style.background = '#2a2a4e'; });
        loading.addEventListener('dragleave', () => { loading.style.background = ''; });
        loading.addEventListener('drop', e => {
            e.preventDefault();
            loading.style.background = '';
            if (e.dataTransfer.files[0]) processFile(e.dataTransfer.files[0]);
        });
    </script>
</body>
</html>
